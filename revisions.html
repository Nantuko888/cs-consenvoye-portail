.logo{width:108px;height:127px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 9px #000b)}

.tile:after{content:"";position:absolute;width:100%;height:52px;bottom:-34px;transform:rotate(-14deg);background:linear-gradient(180deg,transparent,#ff172d4d,#ff162e);border-top:2px solid #ff2c3d;box-shadow:0 -5px 20px #e8263d7b;pointer-events:none}
.tile:active{transform:scale(.98)}.tile:hover{border-color:#abebff;filter:brightness(1.13)}

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText" hidden><div class="modal-card"><h3 id="modalTitle">Bientôt disponible</h3><p id="modalText"></p><button id="closeModal" type="button">Fermer</button></div></div>
<script>
(function(){
 'use strict';
 const modal=document.getElementById('modal');
 const messages={
  rtn:['Références Techniques Nationales','Pour accéder au simulateur RTN, ouvre cette page depuis le portail CS Consenvoye.'],
  tableaux:['Tableaux à compléter','Ce type de question sera intégré aux révisions : fréquences cardiaques et respiratoires, classification ATLS, paramètres et autres exercices.'],
  autres:['Autres formations','Cet espace accueillera prochainement les autres fascicules et thèmes de formation.'],
  reprendre:['Reprendre une révision','La reprise des séances sera disponible après raccordement du simulateur et de la progression individuelle.'],
  resultats:['Mes résultats','Le suivi individuel sera disponible après raccordement sécurisé à Google Sheets.'],
  parametres:['Paramètres de révision','Les préférences des questionnaires seront accessibles lorsque le module RTN sera relié à cet espace.']
 };
 function close(){modal.classList.remove('open');modal.hidden=true;}
 document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>{
  // L'ouverture du simulateur RTN passe par le portail, qui détient
  // le jeton Google et qui communique avec Apps Script en toute sécurité.
  if(b.dataset.module==='rtn' && window.parent!==window){
    // Appel direct, depuis le clic, pour éviter le bloqueur de fenêtres surgissantes.
    try {
      if (typeof window.parent.__openRtnFromRevisions === 'function') {
        window.parent.__openRtnFromRevisions(); return;
      }
    } catch (_) {}
    window.parent.postMessage({type:'revisions:open-rtn'}, window.location.origin);
    return;
  }
  const m=messages[b.dataset.module];if(!m)return;
  document.getElementById('modalTitle').textContent=m[0];
  document.getElementById('modalText').textContent=m[1];
  modal.hidden=false;modal.classList.add('open');document.getElementById('closeModal').focus();
 }));
 document.getElementById('closeModal').addEventListener('click',close);
 modal.addEventListener('click',e=>{if(e.target===modal)close();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
 document.getElementById('back').addEventListener('click',()=>{
  try{const button=window.parent.document.querySelector('#revisions-screen > button');if(button){button.click();return;}}catch(e){}
  window.location.href='index.html';
 });
})();
</script>
