<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Planning — CS Consenvoye</title>

  <style>
    :root{
      --txt:#f4f4f4;
      --muted:rgba(255,255,255,.70);
      --shadow:0 14px 34px rgba(0,0,0,.40);
      --radius:22px;
      --stroke:rgba(255,255,255,.10);
      --orange:#d46a00;
      --orange2:#b95800;
      --today:#fff200;
      --note:#fff200;
      --success:#1ca84a;
    }

    *{box-sizing:border-box}

    html,body{height:100%}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--txt);
      background:#0b0b0b;
      overflow:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      background:
        linear-gradient(180deg,rgba(0,0,0,.52),rgba(0,0,0,.52)),
        url("background.png") center top/cover no-repeat;
      z-index:-2;
      transform:translateZ(0);
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(255,170,60,.16),
          rgba(0,0,0,.64) 62%
        );
      z-index:-1;
    }

    .wrap{
      height:100vh;
      max-width:980px;
      margin:0 auto;
      padding:
        calc(env(safe-area-inset-top) + 10px)
        12px
        calc(env(safe-area-inset-bottom) + 12px);
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:10px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:
        linear-gradient(
          180deg,
          rgba(212,106,0,.75),
          rgba(185,88,0,.58)
        );
      border:1px solid rgba(255,255,255,.12);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      min-height:46px;
    }

    .topbar .title{
      font-weight:950;
      letter-spacing:.8px;
      text-transform:uppercase;
      font-size:18px;
      margin:0;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .yearSelect{
      padding:5px 28px 5px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(0,0,0,.20);
      color:#fff;
      font-family:inherit;
      font-size:18px;
      font-weight:950;
      outline:none;
      cursor:pointer;
    }

    .yearSelect option{
      color:#111;
      background:#fff;
    }

    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      color:var(--txt);
      padding:9px 12px;
      border-radius:14px;
      font-weight:900;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:.15s ease;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .btn.saving{
      background:#177b36;
      border-color:#28cb60;
      color:#fff;
    }

    .btn.saved{
      background:var(--success);
      border-color:#56e17e;
      color:#fff;
    }

    .btn:disabled{
      cursor:default;
      opacity:1;
    }

    .monthbar{
      display:grid;
      grid-template-columns:52px 1fr 52px;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border-radius:18px;
      background:
        linear-gradient(
          180deg,
          rgba(212,106,0,.62),
          rgba(185,88,0,.45)
        );
      border:1px solid rgba(255,255,255,.12);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      min-height:50px;
    }

    .navbtn{
      height:42px;
      border-radius:16px;
      font-size:22px;
      font-weight:950;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:var(--txt);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .navbtn:active{transform:translateY(1px)}

    .navbtn:disabled{
      opacity:.35;
      cursor:default;
    }

    .monthname{
      text-align:center;
      font-weight:950;
      font-size:22px;
      letter-spacing:.4px;
      margin:0;
      white-space:nowrap;
    }

    .calCard{
      border-radius:var(--radius);
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.46),
          rgba(0,0,0,.30)
        );
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      overflow:hidden;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
    }

    .dow{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:8px;
      padding:0 2px;
      color:rgba(255,255,255,.72);
      font-weight:900;
      letter-spacing:.5px;
      font-size:14px;
      user-select:none;
    }

    .dow div{text-align:center}

    .grid{
      flex:1;
      display:grid;
      grid-template-columns:repeat(7,1fr);
      grid-auto-rows:minmax(54px,1fr);
      gap:8px;
      min-height:0;
    }

    .day{
      position:relative;
      border-radius:18px;
      background:rgba(0,0,0,.26);
      border:1px solid rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:950;
      font-size:22px;
      color:rgba(255,255,255,.92);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .day.is-empty{
      opacity:.12;
      pointer-events:none;
    }

    .day.has-color::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:18px;
      background:var(--dayColor,transparent);
      opacity:.78;
      z-index:0;
    }

    .day span{
      position:relative;
      z-index:1;
    }

    .day.is-today{
      box-shadow:
        inset 0 0 0 4px #ffffff,
        0 0 8px rgba(0,0,0,.6);
      border-color:#ffffff;
    }

    .day.has-note{
      cursor:pointer;
    }

    .day.has-note::after{
      content:"";
      position:absolute;
      top:8px;
      right:8px;
      width:8px;
      height:8px;
      border-radius:999px;
      background:rgba(255,242,0,.95);
      box-shadow:0 0 8px rgba(255,242,0,.45);
      z-index:2;
    }

    .legend{
      border-radius:var(--radius);
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.40),
          rgba(0,0,0,.28)
        );
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:10px;
      overflow:hidden;
      min-height:92px;
    }

    .legendGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px 10px;
      align-items:center;
    }

    .legItem{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border-radius:16px;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.08);
      min-height:44px;
    }

    .sq{
      width:20px;
      height:20px;
      border-radius:5px;
      border:1px solid rgba(255,255,255,.18);
      flex:0 0 auto;
    }

    .legTxt{
      font-weight:900;
      font-size:18px;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .status{
      position:fixed;
      left:12px;
      right:12px;
      bottom:calc(env(safe-area-inset-bottom) + 12px);
      z-index:250;
      display:none;
      max-width:980px;
      margin:0 auto;
      pointer-events:none;
      text-align:center;
    }

    .status .pill{
      pointer-events:auto;
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:10px 14px;
      border-radius:16px;
      background:rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:var(--shadow);
      color:#fff;
      font-weight:900;
    }

    .status.success .pill{
      background:rgba(17,126,54,.92);
      border-color:rgba(94,231,132,.55);
    }

    .status .small{
      font-weight:800;
      opacity:.85;
      font-size:13px;
    }

    .noteOverlay,
    .editOverlay,
    .formOverlay{
      position:fixed;
      inset:0;
      display:none;
    }

    .noteOverlay{
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      z-index:120;
    }

    .editOverlay,
    .formOverlay{
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .editOverlay{z-index:140}
    .formOverlay{z-index:180}

    .noteOverlay.show,
    .editOverlay.show,
    .formOverlay.show{
      display:block;
    }

    .noteSheet,
    .editSheet,
    .formSheet{
      position:absolute;
      left:12px;
      right:12px;
      bottom:calc(env(safe-area-inset-bottom) + 12px);
      max-width:980px;
      margin:0 auto;
      border-radius:22px;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.78),
          rgba(0,0,0,.62)
        );
      border:1px solid rgba(255,255,255,.14);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .noteSheet{height:min(52vh,520px)}
    .editSheet{height:min(62vh,620px)}
    .formSheet{height:min(76vh,700px)}

    .noteHead,
    .editHead,
    .formHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
    }

    .noteTitle,
    .editTitle,
    .formTitle{
      font-weight:950;
      font-size:16px;
      color:rgba(255,255,255,.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .noteClose,
    .iconBtn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      color:var(--txt);
      padding:8px 10px;
      border-radius:14px;
      font-weight:950;
      cursor:pointer;
      min-width:42px;
    }

    .iconBtn.danger{
      border-color:rgba(255,80,80,.35);
    }

    .noteBody,
    .editBody{
      padding:12px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .formBody{
      padding:10px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .evCard,
    .row,
    .formBlock,
    .timeSection{
      border-radius:18px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      padding:10px 12px;
    }

    .evTop,
    .rowTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:6px;
    }

    .evName,
    .rowName{
      font-weight:950;
      font-size:16px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .evTime{
      font-weight:900;
      font-size:13px;
      color:rgba(255,255,255,.78);
      white-space:nowrap;
    }

    .evMeta,
    .rowSub{
      font-weight:850;
      font-size:13px;
      color:rgba(255,255,255,.78);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }

    .chipDot{
      width:10px;
      height:10px;
      border-radius:3px;
      border:1px solid rgba(255,255,255,.20);
    }

    .evDetails{
      font-size:15px;
      font-weight:850;
      color:rgba(255,255,255,.92);
      white-space:pre-wrap;
    }

    .rowBtns,
    .editActions,
    .formActions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .formLabel{
      display:block;
      margin:0 0 5px 0;
      font-size:12px;
      font-weight:900;
      color:rgba(255,255,255,.82);
      text-transform:uppercase;
    }

    .fieldText,
    .fieldArea,
    .fieldSelect{
      width:100%;
      outline:none;
      background:rgba(0,0,0,.18);
      color:var(--txt);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.10);
      font-family:inherit;
      font-size:14px;
    }

    .fieldArea{
      min-height:88px;
      resize:vertical;
      font-weight:800;
    }

    .timePickerGroup{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .timePickerRow{
      display:grid;
      grid-template-columns:1fr 18px 1fr;
      gap:8px;
      align-items:center;
    }

    .timeColon{
      text-align:center;
      font-size:24px;
      font-weight:950;
    }

    .wheel{
      position:relative;
      height:128px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      overflow-y:auto;
      scroll-snap-type:y mandatory;
      scrollbar-width:none;
    }

    .wheel::-webkit-scrollbar{display:none}

    .wheelPad{height:42px}

    .wheelInner{
      display:flex;
      flex-direction:column;
    }

    .wheelItem{
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      font-weight:900;
      color:rgba(255,255,255,.40);
      scroll-snap-align:center;
      opacity:.65;
    }

    .wheelItem.active{
      color:#fff;
      opacity:1;
    }

    .wheelFocus{
      position:absolute;
      left:6px;
      right:6px;
      top:42px;
      height:42px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      pointer-events:none;
    }

    .wheelFadeTop,
    .wheelFadeBottom{
      position:absolute;
      left:0;
      right:0;
      height:26px;
      pointer-events:none;
      z-index:2;
    }

    .wheelFadeTop{
      top:0;
      background:linear-gradient(180deg,rgba(0,0,0,.46),transparent);
    }

    .wheelFadeBottom{
      bottom:0;
      background:linear-gradient(0deg,rgba(0,0,0,.46),transparent);
    }

    @media(max-width:520px){
      .timePickerGroup{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="wrap">

  <div class="topbar">

    <h1 class="title">
      <span>PLANNING</span>
      <span id="yearControl"></span>
    </h1>

    <div style="display:flex;gap:10px;align-items:center;">

      <span
        id="editLabel"
        style="display:none;margin-right:6px;font-weight:700;font-size:12px;color:#fff200;">
        MODE ÉDITION
      </span>

      <button
        class="btn"
        id="btnLock"
        style="display:none;">
        🔒
      </button>

      <button class="btn" id="btnBack">
        Retour
      </button>

    </div>

  </div>

  <div class="monthbar">

    <button class="navbtn" id="btnPrev">‹</button>

    <h2 class="monthname" id="monthName">—</h2>

    <button class="navbtn" id="btnNext">›</button>

  </div>

  <section class="calCard">

    <div class="dow">
      <div>Lun</div>
      <div>Mar</div>
      <div>Mer</div>
      <div>Jeu</div>
      <div>Ven</div>
      <div>Sam</div>
      <div>Dim</div>
    </div>

    <div class="grid" id="grid"></div>

  </section>

  <section class="legend">
    <div class="legendGrid" id="legendGrid"></div>
  </section>

</div>


<div class="status" id="status">
  <div class="pill">

    <span id="statusIcon">⚠️</span>

    <div>
      <div id="statusTxt"></div>
      <div class="small" id="statusSub"></div>
    </div>

  </div>
</div>


<div class="noteOverlay" id="noteOverlay">

  <div class="noteSheet">

    <div class="noteHead">
      <div class="noteTitle" id="noteTitle"></div>
      <button class="noteClose" id="noteClose">Fermer</button>
    </div>

    <div class="noteBody" id="noteBody"></div>

  </div>

</div>


<div class="editOverlay" id="editOverlay">

  <div class="editSheet">

    <div class="editHead">

      <div class="editTitle" id="editTitle"></div>

      <div class="editActions">
        <button class="iconBtn" id="btnAddEvent">＋</button>
        <button class="iconBtn" id="btnCloseEdit">✕</button>
      </div>

    </div>

    <div class="editBody" id="editBody"></div>

  </div>

</div>


<div class="formOverlay" id="formOverlay">

  <div class="formSheet">

    <div class="formHead">

      <div class="formTitle" id="formTitle">
        Événement
      </div>

      <button class="iconBtn" id="btnFormCancel">
        ✕
      </button>

    </div>

    <div class="formBody">

      <div class="formBlock">

        <label class="formLabel">
          Titre
        </label>

        <input
          class="fieldText"
          id="fTitle"
          type="text">

      </div>


      <div class="formBlock">

        <label class="formLabel">
          Catégorie
        </label>

        <select
          class="fieldSelect"
          id="fCategory">
        </select>

      </div>


      <div class="timePickerGroup">

        <div class="timeSection">

          <label class="formLabel">
            Heure début
          </label>

          <div class="timePickerRow">

            <div class="wheel" id="startHourWheel">
              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>
              <div class="wheelInner" id="startHourInner"></div>
            </div>

            <div class="timeColon">:</div>

            <div class="wheel" id="startMinuteWheel">
              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>
              <div class="wheelInner" id="startMinuteInner"></div>
            </div>

          </div>

        </div>


        <div class="timeSection">

          <label class="formLabel">
            Heure fin
          </label>

          <div class="timePickerRow">

            <div class="wheel" id="endHourWheel">
              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>
              <div class="wheelInner" id="endHourInner"></div>
            </div>

            <div class="timeColon">:</div>

            <div class="wheel" id="endMinuteWheel">
              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>
              <div class="wheelInner" id="endMinuteInner"></div>
            </div>

          </div>

        </div>

      </div>


      <div class="formBlock">

        <label class="formLabel">
          Lieu
        </label>

        <input
          class="fieldText"
          id="fLocation"
          type="text">

      </div>


      <div class="formBlock">

        <label class="formLabel">
          Détails / note
        </label>

        <textarea
          class="fieldArea"
          id="fDetails">
        </textarea>

      </div>


      <div
        class="formActions"
        style="justify-content:flex-end">

        <button
          class="btn"
          id="btnFormClose">
          Annuler
        </button>

        <button
          class="btn"
          id="btnFormSave">
          Enregistrer
        </button>

      </div>

    </div>

  </div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzPHCDdW7wkFCVkMOL_2srZmdnjZ1QKmToUFtqIZBPjSUNtOwM-Ac7ua0w9dhCv3oI/exec";

const BACK_URL = "index.html";

const PUBLIC_YEAR = 2026;

let ACTIVE_YEAR = PUBLIC_YEAR;

let ADMIN_YEARS = [PUBLIC_YEAR];

let ADMIN_YEARS_LOADED = false;

let WHEELS_INITIALIZED = false;

let SAVE_IN_PROGRESS = false;

const CACHE_MAX_AGE_MS =
1000 * 60 * 60 * 24 * 7;

const LS_EMAIL =
"cs_portail_email_v1";


const DEFAULT_CATEGORIES = [
  {category:"FMA centre",color:"#ff2d2d",order:1},
  {category:"FMA équipe 1",color:"#24d36a",order:2},
  {category:"FMA équipe 2",color:"#f6a000",order:3},
  {category:"JSP",color:"#4aa8ff",order:4},
  {category:"Navette",color:"#2f79ff",order:5},
  {category:"RECSEC",color:"#a081ff",order:6},
  {category:"Sainte Barbe",color:"#ff5a5a",order:7}
];

const OVERRIDE_COLORS = {
  "fma centre":"#ff2d2d"
};

const $ = id =>
document.getElementById(id);

const $grid = $("grid");
const $monthName = $("monthName");
const $legendGrid = $("legendGrid");

const $btnPrev = $("btnPrev");
const $btnNext = $("btnNext");

const $btnLock = $("btnLock");

};


function norm(s){

  return String(s || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/['’]/g,"")
    .replace(/\s+/g," ");

}


function escapeHtml(s){

  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function ymd(d){

  return (
    d.getFullYear()
    +
    "-"
    +
    String(
      d.getMonth()+1
    ).padStart(2,"0")
    +
    "-"
    +
    String(
      d.getDate()
    ).padStart(2,"0")
  );

}


function firstMondayGrid(
  year,
  monthIndex
){

  const d =
  new Date(
    year,
    monthIndex,
    1
  );

  const offset =
  d.getDay() === 0
    ? 6
    : d.getDay()-1;

  d.setDate(
    d.getDate()-offset
  );

  d.setHours(12,0,0,0);

  return d;

}


function toFRDate(str){

  const [y,m,d] =
  String(str).split("-");

  const dt =
  new Date(
    Number(y),
    Number(m)-1,
    Number(d)
  );

  return (
    dowsFR[dt.getDay()]
    +
    " "
    +
    d
    +
    "/"
    +
    m
    +
    "/"
    +
    y
  );

}


function formatTimeRange(
  start,
  end
){

  if(start && end){
    return `${start}–${end}`;
  }

  return start || end || "";

}

function jsonp(
  url,
  cbName,
  timeoutMs=15000
){

  return new Promise(
    (resolve,reject)=>{

      const script =
      document.createElement(
        "script"
      );

      const cleanup = ()=>{

        script.remove();

        try{
          delete window[cbName];
        }catch(e){}

      };

      const timer =
      setTimeout(
        ()=>{

          cleanup();

          reject(
            new Error(
              "Timeout JSONP"
            )
          );

        },
        timeoutMs
      );

      window[cbName] =
      data=>{

        clearTimeout(timer);

        cleanup();

        resolve(data);

      };

      script.src =
      url
      +
      (
        url.includes("?")
          ? "&"
          : "?"
      )
      +
      "t="
      +
      Date.now();

      script.onerror =
      ()=>{

        clearTimeout(timer);

        cleanup();

        reject(
          new Error(
            "Erreur JSONP"
          )
        );

      };

      document.head.appendChild(
        script
      );

    }
  );

}

async function loadPlanningYears_(){

  if(
    ADMIN_YEARS_LOADED
  ){
    return;
  }

  const cb =
  "years_"
  +
  Math.random()
    .toString(36)
    .slice(2);

  try{

    const res =
    await jsonp(
      `${API}?view=planning_years_list`
      +
      `&nocache=1`
      +
      `&callback=${cb}`,
      cb
    );

    const years =
    (
      Array.isArray(
        res?.years
      )
        ? res.years
        : []
    )
    .map(
      x=>
        Number(
          typeof x === "object"
            ? x.year
            : x
        )
    )
    .filter(
      Number.isInteger
    );

    ADMIN_YEARS =
    [
      ...new Set(
        [
          PUBLIC_YEAR,
          PUBLIC_YEAR+1,
          ...years
        ]
      )
    ]
    .sort(
      (a,b)=>a-b
    );

  }catch(e){

    ADMIN_YEARS = [
      PUBLIC_YEAR,
      PUBLIC_YEAR+1
    ];

  }

  ADMIN_YEARS_LOADED =
  true;

}


function rebuildMaps(){

  eventsByDate =
  new Map();

  hasNoteByDate =
  new Map();

  categoryKeysByDate =
  new Map();

  for(
    const ev
    of events
  ){

    const date =
    String(
      ev.date || ""
    ).trim();

    if(!date){
      continue;
    }

    if(
      !eventsByDate.has(date)
    ){

      eventsByDate.set(
        date,
        []
      );

    }

    eventsByDate
      .get(date)
      .push(ev);

    if(
      String(
        ev.details || ""
      ).trim()
    ){

      hasNoteByDate.set(
        date,
        true
      );

    }

  }


  catColor =
  new Map();

  catLabel =
  new Map();

  catOrder =
  new Map();


  const cats =
  [...categoriesRaw]
    .map(
      c=>({

        category:
        String(
          c.category || ""
        ).trim(),

        color:
        String(
          c.color || ""
        ).trim(),

        order:
        Number(
          c.order || 9999
        )

      })
    )
    .filter(
      c=>c.category
    );


  for(
    const c
    of cats
  ){

    const k =
    norm(
      c.category
    );

    catLabel.set(
      k,
      c.category
    );

    catColor.set(
      k,
      OVERRIDE_COLORS[k]
      ||
      c.color
      ||
      "#777"
    );

    catOrder.set(
      k,
      c.order
    );

  }


  for(
    const [date,arr]
    of
    eventsByDate.entries()
  ){

    const set =
    new Set();

    for(
      const ev
      of arr
    ){

      const k =
      norm(
        ev.category
      );

      if(k){
        set.add(k);
      }

    }

    const keys =
    [...set];

    keys.sort(
      (a,b)=>
        (
          catOrder.get(a)
          ||
          9999
        )
        -
        (
          catOrder.get(b)
          ||
          9999
        )
    );

    categoryKeysByDate.set(
      date,
      keys
    );

  }

}


function getColorForCategory(k){

  k =
  norm(k);

  return (
    OVERRIDE_COLORS[k]
    ||
    catColor.get(k)
    ||
    "#777"
  );

}


function getDayBackground(
  dateStr
){

  const keys =
  categoryKeysByDate.get(
    dateStr
  )
  ||
  [];

  const colors =
  keys.map(
    getColorForCategory
  );

  if(
    colors.length === 0
  ){
    return "";
  }

  if(
    colors.length === 1
  ){
    return colors[0];
  }

  const step =
  100/colors.length;

  const parts =
  [];

  colors.forEach(
    (color,i)=>{

      parts.push(
        `${color} ${i*step}%`
      );

      parts.push(
        `${color} ${(i+1)*step}%`
      );

    }
  );

  return (
    `linear-gradient(90deg,${parts.join(",")})`
  );

}

function renderMonth(){

  $monthName.textContent =
  monthsFR[currentMonth];

  $btnPrev.disabled =
  currentMonth === 0;

  $btnNext.disabled =
  currentMonth === 11;

  const start =
  firstMondayGrid(
    ACTIVE_YEAR,
    currentMonth
  );

  const today =
  ymd(
    new Date()
  );

  $grid.innerHTML =
  "";

  for(
    let i=0;
    i<42;
    i++
  ){

    const d =
    new Date(start);

    d.setDate(
      start.getDate()+i
    );

    const inMonth =
    d.getMonth()
    ===
    currentMonth;

    const date =
    ymd(d);

    const cell =
    document.createElement(
      "div"
    );

    cell.className =
    "day"
    +
    (
      inMonth
        ? ""
        : " is-empty"
    );


    if(inMonth){

      cell.dataset.date =
      date;

      const bg =
      getDayBackground(
        date
      );

      if(bg){

        cell.classList.add(
          "has-color"
        );

        cell.style.setProperty(
          "--dayColor",
          bg
        );

      }

      if(
        date === today
      ){

        cell.classList.add(
          "is-today"
        );

      }

      if(
        hasNoteByDate.get(date)
      ){

        cell.classList.add(
          "has-note"
        );

      }

    }

    cell.innerHTML =
    `<span>${
      inMonth
        ? d.getDate()
        : ""
    }</span>`;

    $grid.appendChild(
      cell
    );

  }

}

        PUBLIC_YEAR+1
      ];

  const select =

    "select"
  );

  select.className =
  "yearSelect";

  years.forEach(
    year=>{

      const option =
      document.createElement(
        "option"
      );

      option.value =
      year;

      option.textContent =
      year;

      option.selected =
      year === ACTIVE_YEAR;

      select.appendChild(
        option
      );

    }
  );

  select.onchange =
  async ()=>{

    ACTIVE_YEAR =
    Number(
      select.value
    );

    currentMonth =
    new Date().getFullYear()
    ===
    ACTIVE_YEAR
      ? new Date().getMonth()
      : 0;

    events = [];

    rebuildMaps();

    renderMonth();

    await loadApi();

  };

  $yearControl.appendChild(
    select
  );

}

function buildWheel(
  key
){

  const p =
  TIME_PICKERS[key];

  const values =
  [];

  for(
    let i=0;
    i<LOOP_DUPLICATES;
    i++
  ){

    values.push(
      ...p.values
    );

  }

  p.inner.innerHTML =
  "";

  const pad =
  document.createElement(
    "div"
  );

  pad.className =
  "wheelPad";

  p.inner.appendChild(
    pad
  );

  values.forEach(
    v=>{

      const item =
      document.createElement(
        "div"
      );

      item.className =
      "wheelItem";

      item.textContent =
      v;

      item.dataset.value =
      v;

      p.inner.appendChild(
        item
      );

    }
  );

  p.inner.appendChild(
    pad.cloneNode()
  );

  p.wheel.addEventListener(
    "scroll",
    ()=>{

      const center =
      p.wheel.scrollTop
      +
      p.wheel.clientHeight/2;

      let best =
      null;

      let dist =
      Infinity;

      [
        ...p.inner.querySelectorAll(
          ".wheelItem"
        )
      ]
      .forEach(
        item=>{

          item.classList.remove(
            "active"
          );

          const d =
          Math.abs(
            item.offsetTop
            +
            item.offsetHeight/2
            -
            center
          );

          if(
            d < dist
          ){

            dist =
            d;

            best =
            item;

          }

        }
      );

      if(best){

        best.classList.add(
          "active"
        );

        p.value =
        best.dataset.value;

      }

    }
  );

}


function ensureWheelsInitialized_(){

  if(
    WHEELS_INITIALIZED
  ){
    return;
  }

  Object.keys(
    TIME_PICKERS
  )
  .forEach(
    buildWheel
  );

  WHEELS_INITIALIZED =
  true;

}


function setWheelValue(
  key,
  value
){

  const p =
  TIME_PICKERS[key];

  const matches =
  [
    ...p.inner.querySelectorAll(
      `.wheelItem[data-value="${value}"]`
    )
  ];

  const item =
  matches[
    Math.floor(
      matches.length/2
    )
  ];

  if(!item){
    return;
  }

  p.wheel.scrollTop =
  item.offsetTop
  -
  p.wheel.clientHeight/2
  +
  item.offsetHeight/2;

  p.value =
  value;

}


function setTimeValue(
  prefix,
  value
){

  const [h,m] =
  String(
    value || "00:00"
  )
  .split(":");

  setWheelValue(
    prefix+"Hour",
    h
  );

  setWheelValue(
    prefix+"Minute",
    m
  );

}


function getTimeValue(
  prefix
){

  return (
    TIME_PICKERS[
      prefix+"Hour"
    ].value
    +
    ":"
    +
    TIME_PICKERS[
      prefix+"Minute"
    ].value
  );

}

  FORM_STATE = {

  buildCategoryOptions(
    ev?.category
    ||
    ""
  );

  $formTitle.textContent =
  mode === "edit"
    ? `Modifier — ${toFRDate(date)}`
    : `Ajouter — ${toFRDate(date)}`;

  $fTitle.value =
  ev?.title || "";

  $fLocation.value =
  ev?.location || "";

  $fDetails.value =
  ev?.details || "";

  $formOverlay.classList.add(
    "show"

  requestAnimationFrame(
    ()=>{

      setTimeValue(
        "start",
        ev?.start || "08:00"
      );

      setTimeValue(
        "end",
        ev?.end || "09:00"
      );

    }
  );

}

/*
  Mise à jour locale instantanée.
  Cela évite d'attendre le rechargement
  complet Google Sheets.
*/
function applySavedEventLocally_(
  payload
){

  if(
    FORM_STATE.mode === "edit"
    &&
    FORM_STATE.originalEvent
  ){

    const old =
    FORM_STATE.originalEvent;

    events =
    events.filter(
      ev=>
        ev !== old
        &&
        String(
          ev.event_id || ev.id || ""
        )
        !==
        String(
          old.event_id || old.id || ""
        )
    );

  }

  events.push({

    date:
    FORM_STATE.dateStr,

    title:
    payload.title,

    start:
    payload.start,

    end:
    payload.end,

    category:
    payload.category,

    location:
    payload.location,

    details:
    payload.details

  });

  rebuildMaps();

  renderMonth();

}


async function saveEventForm(){

  if(
    SAVE_IN_PROGRESS
  ){
    return;
  }


  const payload = {

    title:
    String(
      $fTitle.value || ""
    ).trim(),

    category:
    String(
      $fCategory.value || ""
    ).trim(),

    location:
    String(
      $fLocation.value || ""
    ).trim(),

    details:
    String(
      $fDetails.value || ""
    ).trim(),

    start:
    getTimeValue(
      "start"
    ),

    end:
    getTimeValue(
      "end"
    )

  };


  if(
    !payload.title
  ){

    alert(
      "Titre obligatoire."
    );

    return;

  }


  if(
    payload.end
    <
    payload.start
  ){

    alert(
      "Heure de fin incorrecte."
    );

    return;

  }


  SAVE_IN_PROGRESS =
  true;

  setSaveButtonState(
    "saving"
  );


  try{

    if(
      FORM_STATE.mode === "edit"
      &&
      FORM_STATE.originalEvent
    ){

      await apiDeleteEvent_(
        FORM_STATE.dateStr,
        FORM_STATE.originalEvent
      );

    }


    await apiAddEvent_(
      FORM_STATE.dateStr,
      payload
    );


    /*
      GOOGLE A CONFIRMÉ L'ÉCRITURE.
      On met à jour l'écran immédiatement.
    */
    applySavedEventLocally_(
      payload
    );


    setSaveButtonState(
      "saved"
    );


    /*
      Petit délai juste pour que l'utilisateur
      voie "Enregistré".
    */
    await new Promise(
      resolve=>
        setTimeout(
          resolve,
          300
        )
    );


    /*
      On ferme les deux tableaux.
    */
    closeEventForm();

    closeEdit();


    /*
      Message vert bref.
    */
    showSavedMessage();


    /*
      IMPORTANT :
      rafraîchissement Google Sheets
      EN ARRIÈRE-PLAN.
      Aucun blocage visuel.
    */
    loadApi(true)
      .catch(
        ()=>{}
      );


  }catch(err){

    alert(
      "Erreur lors de l'enregistrement : "
      +
      String(
        err?.message
        ||
        err
      )
    );

  }finally{

    SAVE_IN_PROGRESS =
    false;

    setTimeout(
      ()=>setSaveButtonState(
        "normal"
      ),
      400
    );

  }

}


async function apiAddEvent_(
  date,
  p
){

  const email =
  getEmailLocal();

  const cb =
  "add_"
  +
  Math.random()
    .toString(36)
    .slice(2);

  const url =
  `${API}?view=planning_add`
  +
  `&email=${encodeURIComponent(email)}`
  +
  `&date=${encodeURIComponent(date)}`
  +
  `&start=${encodeURIComponent(p.start)}`
  +
  `&end=${encodeURIComponent(p.end)}`
  +
  `&title=${encodeURIComponent(p.title)}`
  +
  `&category=${encodeURIComponent(p.category)}`
  +
  `&location=${encodeURIComponent(p.location)}`
  +
  `&details=${encodeURIComponent(p.details)}`
  +
  `&nocache=1`
  +
  `&callback=${cb}`;

  const res =
  await jsonp(
    url,
    cb,
    20000
  );

  if(
    !res?.ok
  ){

    throw new Error(
      res?.error
      ||
      "Erreur ajout"
    );

  }

}


async function apiDeleteEvent_(
  date,
  ev
){

  const id =
  String(
    ev?.event_id
    ||
    ev?.id
    ||
    ""
  );

  if(!id){

    throw new Error(
      "Identifiant événement manquant."
    );

  }

  const email =
  getEmailLocal();

  const cb =
  "del_"
  +
  Math.random()
    .toString(36)
    .slice(2);

  const res =
  await jsonp(
    `${API}?view=planning_delete`
    +
    `&email=${encodeURIComponent(email)}`
    +
    `&event_id=${encodeURIComponent(id)}`
    +
    `&nocache=1`
    +
    `&callback=${cb}`,
    cb
  );

  if(
    !res?.ok
  ){

    throw new Error(
      res?.error
      ||
      "Erreur suppression"
    );

  }

}


function saveCache_(payload){

  try{

    localStorage.setItem(
      `cs_planning_cache_v1_${ACTIVE_YEAR}`,
      JSON.stringify({
        savedAt:Date.now(),
        payload
      })
    );

  }catch(e){}

}


function loadCache_(){

  try{

    const raw =
    localStorage.getItem(
      `cs_planning_cache_v1_${ACTIVE_YEAR}`
    );

    if(!raw){
      return null;
    }

    return JSON.parse(
      raw
    ).payload;

  }catch(e){

    return null;

  }

}


function applyPlanningData_(
  py,
  pc
){

  events =
  Array.isArray(
    py?.events
  )
    ? py.events
    : [];

  categoriesRaw =
  Array.isArray(
    pc?.categories
  )
  &&
  pc.categories.length
    ? pc.categories
    : DEFAULT_CATEGORIES.slice();

  rebuildMaps();

  renderLegend();

  renderMonth();

}


async function loadApi(
  force=false
){

  const cached =
  loadCache_();

  if(
    cached
    &&
    !force
  ){

    applyPlanningData_(
      cached.py,
      cached.pc
    );

  }


  const cb1 =
  "py_"
  +
  Math.random()
    .toString(36)
    .slice(2);

  const cb2 =
  "pc_"
  +
  Math.random()
    .toString(36)
    .slice(2);


  const [py,pc] =
  await Promise.all(
    [

      jsonp(
        `${API}?view=planning_year`
        +
        `&year=${ACTIVE_YEAR}`
        +
        (
          force
          ? "&nocache=1"
          : ""
        )
        +
        `&callback=${cb1}`,
        cb1
      ),

      jsonp(
        `${API}?view=planning_categories`
        +
        `&callback=${cb2}`,
        cb2
      )

    ]
  );


  applyPlanningData_(
    py,
    pc
  );

  saveCache_({
    py,
    pc
  });

}
