<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning — CS Consenvoye</title>

<style>
:root{
  --txt:#f4f4f4;
  --muted:rgba(255,255,255,.70);
  --shadow:0 14px 34px rgba(0,0,0,.40);
  --stroke:rgba(255,255,255,.10);
  --orange:#d46a00;
  --orange2:#b95800;
  --green:#168039;
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:#0b0b0b;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(180deg,rgba(0,0,0,.52),rgba(0,0,0,.52)),
    url("background.png") center top/cover no-repeat;
}

.bg:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(255,170,60,.16),
      rgba(0,0,0,.64) 62%
    );
}

.wrap{
  height:100vh;
  max-width:980px;
  margin:auto;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    12px
    calc(env(safe-area-inset-bottom) + 12px);
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:10px;
}

.topbar{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:18px;
  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.75),
      rgba(185,88,0,.58)
    );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}

.title{
  margin:0;
  font-size:18px;
  font-weight:950;
  letter-spacing:.8px;
  text-transform:uppercase;
  white-space:nowrap;
}

.yearSelect{
  margin-left:5px;
  padding:5px 28px 5px 9px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.20);
  color:white;
  font:inherit;
  font-size:18px;
  font-weight:950;
}

.yearSelect option{
  color:#111;
  background:white;
}

.btn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.18);
  color:white;
  padding:9px 12px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

.btnGreen{
  background:var(--green)!important;
  border-color:rgba(80,220,120,.45)!important;
  color:#fff!important;
}

.btn:disabled{
  opacity:.55;
}

.monthbar{
  min-height:50px;
  display:grid;
  grid-template-columns:52px 1fr 52px;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:18px;
  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.62),
      rgba(185,88,0,.45)
    );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
}

.navbtn{
  height:42px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.18);
  color:white;
  font-size:22px;
  font-weight:950;
}

.navbtn:disabled{
  opacity:.35;
}

.monthname{
  text-align:center;
  margin:0;
  font-size:22px;
  font-weight:950;
}

.calCard{
  min-height:0;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:hidden;
  border-radius:22px;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.46),
      rgba(0,0,0,.30)
    );
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
}

.dow{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  font-size:14px;
  font-weight:900;
  color:rgba(255,255,255,.72);
}

.dow div{
  text-align:center;
}

.grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-auto-rows:minmax(54px,1fr);
  gap:8px;
}

.day{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.92);
  font-size:22px;
  font-weight:950;
  user-select:none;
}

.day.empty{
  opacity:.12;
}

.day.colored:before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:18px;
  background:var(--dayColor);
  opacity:.78;
}

.day span{
  position:relative;
  z-index:1;
}

.day.today{
  border-color:white;
  box-shadow:
    inset 0 0 0 4px white,
    0 0 8px rgba(0,0,0,.6);
}

.day.note:after{
  content:"";
  position:absolute;
  z-index:3;
  top:8px;
  right:8px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff200;
  box-shadow:0 0 8px rgba(255,242,0,.5);
}

.legend{
  min-height:92px;
  padding:10px;
  border-radius:22px;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.40),
      rgba(0,0,0,.28)
    );
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
}

.legendGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 10px;
}

.legItem{
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:16px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.08);
}

.sq{
  width:20px;
  height:20px;
  flex:none;
  border-radius:5px;
}

.legTxt{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:120;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(7px);
}

.overlay.show{
  display:block;
}

.sheet{
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  max-width:980px;
  margin:auto;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border-radius:22px;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.82),
      rgba(0,0,0,.68)
    );
  border:1px solid rgba(255,255,255,.14);
  box-shadow:var(--shadow);
}

.noteSheet{height:min(55vh,560px)}
.editSheet{height:min(64vh,640px)}
.formSheet{height:min(82vh,760px)}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.10);
}

.headTitle{
  font-size:16px;
  font-weight:950;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.body{
  flex:1;
  padding:10px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.card,
.formBlock{
  padding:10px 12px;
  border-radius:18px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.10);
}

.evTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.evName{
  font-size:16px;
  font-weight:950;
}

.evTime{
  font-size:13px;
  font-weight:900;
  color:rgba(255,255,255,.78);
  white-space:nowrap;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:7px 0;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.06);
  font-size:13px;
  font-weight:850;
}

.dot{
  width:10px;
  height:10px;
  border-radius:3px;
}

.details{
  white-space:pre-wrap;
  line-height:1.3;
  font-size:15px;
  font-weight:800;
}

.label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  font-weight:900;
  color:rgba(255,255,255,.78);
  text-transform:uppercase;
}

.field{
  width:100%;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.18);
  color:white;
  font:inherit;
  font-size:14px;
  font-weight:850;
  outline:none;
}

textarea.field{
  min-height:85px;
  resize:vertical;
}

.timeRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
}

.attachmentPreview{
  display:none;
  margin-top:10px;
  overflow:hidden;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:#080808;
}

.attachmentPreview.show{
  display:block;
}

.attachmentPreview img{
  display:block;
  width:100%;
  max-height:260px;
  object-fit:contain;
}

.attachmentBar{
  padding:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.evImage{
  display:block;
  margin-top:9px;
  overflow:hidden;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.12);
  background:#080808;
}

.evImage img{
  display:block;
  width:100%;
  max-height:360px;
  object-fit:contain;
}

.uploadOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    10px
    calc(env(safe-area-inset-bottom) + 10px);
  background:rgba(0,0,0,.90);
}

.uploadOverlay.show{
  display:flex;
  flex-direction:column;
}

.uploadHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:10px;
}

.uploadWindow{
  flex:1;
  min-height:0;
  overflow:hidden;
  border-radius:20px;
  background:#151515;
  border:1px solid rgba(255,255,255,.12);
}

.uploadFrame{
  width:100%;
  height:100%;
  border:0;
}

.status{
  display:none;
  position:fixed;
  z-index:500;
  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  max-width:980px;
  margin:auto;
}

.status.show{
  display:block;
}

.statusBox{
  display:inline-block;
  padding:10px 13px;
  border-radius:15px;
  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.15);
  font-size:14px;
  font-weight:850;
}

@media(max-width:520px){
  .timeRow{
    grid-template-columns:1fr;
  }

  .legTxt{
    font-size:15px;
  }

  .day{
    font-size:20px;
  }
}
</style>
</head>

function norm(value){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase()
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  );

}


function escapeHtml(value){

  return String(
    value == null
      ? ""
      : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function getEmailLocal(){

  return String(
    localStorage.getItem(
      LS_EMAIL
    ) || ""
  )
  .trim()
  .toLowerCase();

}


function cacheKey(){

  try{

    localStorage.setItem(
      cacheKey(),
      JSON.stringify({
        py,
        pc,
        savedAt:Date.now()
      })
    );

  }catch(e){}

}


function loadCache(){

  try{

    const raw =
      localStorage.getItem(
        cacheKey()
      );

    if(!raw){
      return null;
    }

    const data =
      JSON.parse(raw);

    if(!data){
      return null;
    }

    return data;

  }catch(e){

    return null;

  }

}


function jsonp(
  url,
  callbackName,
  timeout = 20000
){

  return new Promise(
    (resolve,reject)=>{

      const script =
        document.createElement(
          "script"
        );

      let timer = null;


      function cleanup(){

        if(timer){
          clearTimeout(timer);
        }

        try{
          delete window[
            callbackName
          ];
        }catch(e){}

        try{
          script.remove();
        }catch(e){}

      }


      window[
        callbackName
      ] =
        data => {

          cleanup();

          resolve(data);

        };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              "Erreur réseau"
            )
          );

        };


      timer =
        setTimeout(
          ()=>{

            cleanup();

            reject(
              new Error(
                "Délai dépassé"
              )
            );

          },
          timeout
        );


      script.src =
        url;

      document.head.appendChild(
        script
      );

    }
  );

}

function getAttachmentUrl(ev){

  return String(

    ev?.attachment_url ||

    ev?.piece_jointe ||

    ev?.attachment ||

    ev?.image_url ||

    ev?.image ||

    ""

  ).trim();

}


function timeRange(
  start,
  end
){

  start =
    String(
      start || ""
    ).trim();

  end =
    String(
      end || ""
    ).trim();


  if(start && end){

    return (
      start +
      " → " +
      end
    );

  }

  return (
    start ||
    end ||
    ""
  );

}


function frDate(dateStr){

  const p =
    String(
      dateStr
    ).split("-");

  if(p.length !== 3){
    return dateStr;
  }

  return (
    p[2] +
    "/" +
    p[1] +
    "/" +
    p[0]
  );

}

========================================================= */

function getCategoryColor(category){

  const key =
    norm(category);

  const cat =
    categoriesRaw.find(
      c =>
        norm(c.category) === key
    );

  return (
    cat?.color ||
    "#777777"
  );

}


/* =========================================================
   RECONSTRUCTION DES ÉVÉNEMENTS
========================================================= */

function rebuildMaps(){

  eventsByDate =
    new Map();

  firstCategoryByDate =
    new Map();

  hasNoteByDate =
    new Map();


  for(
    const ev of events
  ){

    const date =
      String(
        ev.date || ""
      ).trim();

    if(!date){
      continue;
    }


    if(
      !eventsByDate.has(date)
    ){

      eventsByDate.set(
        date,
        []
      );

    }


    eventsByDate
      .get(date)
      .push(ev);


    if(
      !firstCategoryByDate.has(
        date
      )
    ){

      firstCategoryByDate.set(
        date,
        ev.category || ""
      );

    }


    if(
      String(
        ev.details || ""
      ).trim()

      ||

      getAttachmentUrl(ev)
    ){

      hasNoteByDate.set(
        date,
        true
      );

    }

  }

}

========================================================= */

const MONTHS = [
  "Janvier",
  "Février",
  "Mars",
  "Avril",
  "Mai",
  "Juin",
  "Juillet",
  "Août",
  "Septembre",
  "Octobre",
  "Novembre",
  "Décembre"
];


function renderMonth(){

  $monthName.textContent =
    MONTHS[currentMonth];


  $btnPrev.disabled =
    currentMonth === 0;

  $btnNext.disabled =
    currentMonth === 11;


  $grid.innerHTML =
    "";


  const firstDay =
    new Date(
      ACTIVE_YEAR,
      currentMonth,
      1
    );


  const mondayIndex =
    (
      firstDay.getDay() + 6
    ) % 7;


  const daysInMonth =
    new Date(
      ACTIVE_YEAR,
      currentMonth + 1,
      0
    ).getDate();


  const total =
    42;


  const today =
    new Date();


  const todayStr =
    [
      today.getFullYear(),
      String(
        today.getMonth() + 1
      ).padStart(2,"0"),
      String(
        today.getDate()
      ).padStart(2,"0")
    ].join("-");


  for(
    let i=0;
    i<total;
    i++
  ){

    const dayNumber =
      i
      -
      mondayIndex
      +
      1;


    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "day";


    if(
      dayNumber < 1
      ||
      dayNumber > daysInMonth
    ){

      cell.classList.add(
        "empty"
      );

      cell.innerHTML =
        "<span></span>";

      $grid.appendChild(
        cell
      );

      continue;

    }


    const dateStr =
      ACTIVE_YEAR
      +
      "-"
      +
      String(
        currentMonth + 1
      ).padStart(2,"0")
      +
      "-"
      +
      String(
        dayNumber
      ).padStart(2,"0");


    cell.dataset.date =
      dateStr;


    const category =
      firstCategoryByDate.get(
        dateStr
      );


    if(category){

      cell.classList.add(
        "colored"
      );

      cell.style.setProperty(
        "--dayColor",
        getCategoryColor(
          category
        )
      );

    }


    if(
      dateStr === todayStr
    ){

      cell.classList.add(
        "today"
      );

    }


    if(
      hasNoteByDate.get(
        dateStr
      )
    ){

      cell.classList.add(
        "note"
      );

    }


    cell.innerHTML =
      "<span>"
      +
      dayNumber
      +
      "</span>";


    $grid.appendChild(
      cell
    );

  }

}

/* =========================================================
   CHARGEMENT RAPIDE
========================================================= */

async function loadApi(
  forceFresh = false
){

  const cached =
    loadCache();


  /*
   * On affiche immédiatement
   * le dernier planning connu.
   */
  if(
    !forceFresh
    &&
    cached?.py
    &&
    cached?.pc
  ){

    applyPlanningData(
      cached.py,
      cached.pc
    );

  }


  const cb1 =
    "cbPlan_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const cb2 =
    "cbCat_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const planningUrl =
    API
    +
    "?view=planning_year"
    +
    "&year="
    +
    encodeURIComponent(
      ACTIVE_YEAR
    )
    +
    (
      forceFresh
        ? "&nocache=1"
        : ""
    )
    +
    "&callback="
    +
    cb1;


  const categoriesUrl =
    API
    +
    "?view=planning_categories"
    +
    (
      forceFresh
        ? "&nocache=1"
        : ""
    )
    +
    "&callback="
    +
    cb2;


  try{

    const [
      py,
      pc
    ] =
      await Promise.all([

        jsonp(
          planningUrl,
          cb1
        ),

        jsonp(
          categoriesUrl,
          cb2
        )

      ]);


    if(
      py?.ok === false
    ){

      throw new Error(
        py.error ||
        "Erreur planning"
      );

    }


    if(
      pc?.ok === false
    ){

      throw new Error(
        pc.error ||
        "Erreur catégories"
      );

    }


    applyPlanningData(
      py,
      pc
    );


    saveCache(
      py,
      pc
    );


    hideStatus();


    return py;

  }catch(err){

    if(
      cached?.py
      &&
      cached?.pc
    ){

      applyPlanningData(
        cached.py,
        cached.pc
      );

      return cached.py;

    }


    showStatus(
      "Impossible de charger le planning."
    );


    throw err;

  }

}

async function loadYears(){

  if(!IS_ADMIN){

    ADMIN_YEARS =
      [PUBLIC_YEAR];

    return;

  }


  const cb =
    "cbYears_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const url =
    API
    +
    "?view=planning_years_list"
    +
    "&email="
    +
    encodeURIComponent(
      getEmailLocal()
    )
    +
    "&nocache=1"
    +
    "&callback="
    +
    cb;


  const res =
    await jsonp(
      url,
      cb
    );


  let years =
    [];


  if(
    Array.isArray(
      res?.years
    )
  ){

    years =
      res.years;

  }


  years =
    years
    .map(Number)
    .filter(
      y =>
        Number.isFinite(y)
    );


  if(
    !years.includes(
      PUBLIC_YEAR
    )
  ){

    years.push(
      PUBLIC_YEAR
    );

  }


  years.sort(
    (a,b)=>
      a-b
  );


  ADMIN_YEARS =
    years.length
      ? years
      : [PUBLIC_YEAR];

}

async function addEventApi(
  dateStr,
  ev
){

  const email =
    getEmailLocal();


  if(!email){

    throw new Error(
      "Email administrateur introuvable."
    );

  }


  const cb =
    "cbAdd_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const params =
    new URLSearchParams({
      view:"planning_add",
      email,
      year:String(
        ACTIVE_YEAR
      ),
      date:dateStr,
      title:
        ev.title || "",
      start:
        ev.start || "",
      end:
        ev.end || "",
      category:
        ev.category || "",
      location:
        ev.location || "",
      details:
        ev.details || "",
      attachment_url:
        ev.attachment_url || "",
      nocache:"1",
      callback:cb
    });


  const url =
    API
    +
    "?"
    +
    params.toString();


  const res =
    await jsonp(
      url,
      cb
    );


  if(
    !res
    ||
    res.ok !== true
  ){

    throw new Error(
      res?.error ||
      "Erreur lors de l'enregistrement."
    );

  }


  return res;

}


/* =========================================================
   EVENT ID FRAIS
========================================================= */

function sameEvent(
  a,
  b,
  dateStr
){

  return (

    String(
      a?.date || ""
    )
    ===
    String(
      dateStr || ""
    )

    &&

    String(
      a?.title || ""
    ).trim()
    ===
    String(
      b?.title || ""
    ).trim()

    &&

    String(
      a?.start || ""
    ).slice(0,5)
    ===
    String(
      b?.start || ""
    ).slice(0,5)

  );

}


async function getFreshEvent(
  dateStr,
  oldEvent
){

  /*
   * On force une lecture fraîche de Sheets
   * avant toute modification ou suppression.
   *
   * Cela évite le fameux :
   * event_id non trouvé dans Sheets
   * provoqué par un ID issu de l'ancien cache.
   */
  await loadApi(
    true
  );


  return (
    events.find(
      ev =>
        sameEvent(
          ev,
          oldEvent,
          dateStr
        )
    )
    ||
    null
  );

}


/* =========================================================
   API SUPPRESSION
========================================================= */

async function deleteEventById(
  eventId
){

  if(!eventId){

    throw new Error(
      "event_id introuvable."
    );

  }


  const email =
    getEmailLocal();


  const cb =
    "cbDelete_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const params =
    new URLSearchParams({
      view:"planning_delete",
      email,
      event_id:
        String(eventId),
      nocache:"1",
      callback:cb
    });


  const res =
    await jsonp(
      API
      +
      "?"
      +
      params.toString(),
      cb
    );


  if(
    !res
    ||
    res.ok !== true
  ){

    throw new Error(
      res?.error ||
      "Erreur suppression."
    );

  }


  return res;

}


async function deleteEventSafe(
  dateStr,
  oldEvent
){

  /*
   * On ne fait plus confiance à l'event_id
   * qui était présent dans le cache.
   */
  const freshEvent =
    await getFreshEvent(
      dateStr,
      oldEvent
    );


  if(!freshEvent){

    throw new Error(
      "Événement introuvable dans le planning actuel."
    );

  }


  const eventId =
    freshEvent.event_id
    ||
    freshEvent.id
    ||
    "";


  return deleteEventById(
    eventId
  );

}

async function deleteAttachment(
  url
){

  url =
    String(
      url || ""
    ).trim();


  if(!url){
    return;
  }


  const cb =
    "cbAttachmentDelete_"
    +
    Math.random()
      .toString(36)
      .slice(2);


  const params =
    new URLSearchParams({
      view:
        "planning_attachment_delete",
      email:
        getEmailLocal(),
      url,
      callback:cb
    });


  try{

    await jsonp(
      API
      +
      "?"
      +
      params.toString(),
      cb
    );

  }catch(e){}

}


/* =========================================================
   MESSAGE DE RETOUR UPLOAD
========================================================= */

window.addEventListener(
  "message",
  async event => {

    const data =
      event.data || {};


    if(
      data.type
      ===
      "planning-attachment-success"
    ){

      const url =
        String(
          data.url
          ||
          data.attachment_url
          ||
          data.file_url
          ||
          ""
        ).trim();


      if(!url){

        alert(
          "L'image a été envoyée mais aucune URL n'a été reçue."
        );

        return;

      }


      /*
       * Si on avait déjà envoyé une nouvelle image
       * dans ce même formulaire, on supprime l'ancienne.
       */
      if(
        FORM_NEW_UPLOAD_URL
        &&
        FORM_NEW_UPLOAD_URL
        !== url
      ){

        deleteAttachment(
          FORM_NEW_UPLOAD_URL
        ).catch(()=>{});

      }


      FORM_NEW_UPLOAD_URL =
        url;

      FORM_ATTACHMENT_URL =
        url;


      renderAttachmentPreview();


      closeAttachmentUpload();

    }


    if(
      data.type
      ===
      "planning-attachment-close"
    ){

      closeAttachmentUpload();

    }

  }
);


/* =========================================================
   CONTRÔLE DES HEURES
========================================================= */

function minutesFromTime(
  value
){

  const p =
    String(
      value || "00:00"
    ).split(":");


  return (
    Number(
      p[0] || 0
    )
    *
    60
    +
    Number(
      p[1] || 0
    )
  );

}


function validateTimes(
  start,
  end
){

  const startMinutes =
    minutesFromTime(
      start
    );


  let endMinutes =
    minutesFromTime(
      end
    );


  /*
   * IMPORTANT :
   *
   * une fin à 00:00 signifie MINUIT.
   *
   * Exemple :
   * 23:45 → 00:00
   * est parfaitement valide.
   */
  if(
    end === "00:00"
    &&
    start !== "00:00"
  ){

    endMinutes =
      24 * 60;

  }


  return (
    endMinutes
    >=
    startMinutes
  );

}


/* =========================================================
   ENREGISTREMENT
========================================================= */

async function saveEvent(){

  const title =
    String(
      $fTitle.value || ""
    ).trim();


  const category =
    String(
      $fCategory.value || ""
    ).trim();


  const start =
    String(
      $fStart.value || ""
    ).trim();


  const end =
    String(
      $fEnd.value || ""
    ).trim();


  const location =
    String(
      $fLocation.value || ""
    ).trim();


  const details =
    String(
      $fDetails.value || ""
    ).trim();


  const attachmentUrl =
    String(
      FORM_ATTACHMENT_URL || ""
    ).trim();


  if(!title){

    alert(
      "Titre obligatoire."
    );

    return;

  }


  if(!start){

    alert(
      "Heure de début obligatoire."
    );

    return;

  }


  if(!end){

    alert(
      "Heure de fin obligatoire."
    );

    return;

  }


  if(
    !validateTimes(
      start,
      end
    )
  ){

    alert(
      "Heure de fin incorrecte."
    );

    return;

  }


  $btnFormSave.disabled =
    true;


  $btnFormSave.textContent =
    "Enregistrement…";


  try{

    /*
     * MODIFICATION
     *
     * On récupère d'abord l'événement frais
     * depuis Sheets avant de le supprimer.
     */
    if(
      FORM_STATE.mode === "edit"
      &&
      FORM_STATE.originalEvent
    ){

      await deleteEventSafe(
        FORM_STATE.dateStr,
        FORM_STATE.originalEvent
      );

    }


    /*
     * Création de la nouvelle ligne.
     */
    await addEventApi(
      FORM_STATE.dateStr,
      {
        title,
        category,
        start,
        end,
        location,
        details,
        attachment_url:
          attachmentUrl
      }
    );


    /*
     * L'image nouvellement envoyée est maintenant
     * officiellement utilisée par l'événement.
     *
     * Elle ne doit donc plus être supprimée
     * à la fermeture du formulaire.
     */
    FORM_NEW_UPLOAD_URL =
      "";


    /*
     * Si on a remplacé ou supprimé
     * l'ancienne image, on la met à la corbeille.
     */
    const oldAttachment =
      String(
        FORM_ORIGINAL_ATTACHMENT_URL
        ||
        ""
      ).trim();


    if(
      oldAttachment
      &&
      oldAttachment
      !== attachmentUrl
    ){

      deleteAttachment(
        oldAttachment
      ).catch(()=>{});

    }


    /*
     * Bouton vert + confirmation visuelle.
     */
    $btnFormSave.textContent =
      "✓ Enregistré";


    /*
     * Actualisation fraîche du planning.
     */
    await loadApi(
      true
    );


    /*
     * On ferme sans supprimer l'image enregistrée.
     */
    FORM_NEW_UPLOAD_URL =
      "";


    $formOverlay.classList.remove(
      "show"
    );


    FORM_STATE = {
      mode:"add",
      dateStr:"",
      originalEvent:null
    };


    FORM_ATTACHMENT_URL =
      "";

    FORM_ORIGINAL_ATTACHMENT_URL =
      "";


    if(editDate){

      renderEditList(
        editDate
      );

    }


  }catch(err){

    $btnFormSave.disabled =
      false;


    $btnFormSave.textContent =
      "Enregistrer";


    alert(
      "Erreur : "
      +
      (
        err?.message
        ||
        err
      )
    );


    return;

  }


  setTimeout(
    ()=>{

      $btnFormSave.disabled =
        false;

      $btnFormSave.textContent =
        "Enregistrer";

    },
    300
  );

}

$yearSelect
  .addEventListener(
    "change",
    async ()=>{

      if(!IS_ADMIN){

        $yearSelect.value =
          PUBLIC_YEAR;

        return;

      }


      const year =
        Number(
          $yearSelect.value
        );


      if(
        !ADMIN_YEARS.includes(
          year
        )
      ){

        return;

      }


      ACTIVE_YEAR =
        year;


      closeNote();

      closeEdit();


      const cache =
        loadCache();


      if(
        cache?.py
        &&
        cache?.pc
      ){

        applyPlanningData(
          cache.py,
          cache.pc
        );

      }else{

        events = [];

        categoriesRaw =
          DEFAULT_CATEGORIES.slice();

        rebuildMaps();

        renderLegend();

      }


      const now =
        new Date();


      currentMonth =
        (
          now.getFullYear()
          ===
          ACTIVE_YEAR
        )
          ? now.getMonth()
          : 0;


      renderMonth();


      await loadApi();

    }
  );

/* =========================================================
   DÉMARRAGE
========================================================= */

(async function(){

  ACTIVE_YEAR =
    PUBLIC_YEAR;


  const now =
    new Date();


  currentMonth =
    (
      now.getFullYear()
      ===
      ACTIVE_YEAR
    )
      ? now.getMonth()
      : 0;


  /*
   * 2026 apparaît immédiatement
   * dans le menu déroulant.
   */
  $yearSelect.innerHTML =
    `<option value="${PUBLIC_YEAR}">${PUBLIC_YEAR}</option>`;


  $yearSelect.style.display =
    "inline-block";


  /*
   * Affichage immédiat du cache.
   */
  const cache =
    loadCache();


  if(
    cache?.py
    &&
    cache?.pc
  ){

    applyPlanningData(
      cache.py,
      cache.pc
    );

  }else{

    categoriesRaw =
      DEFAULT_CATEGORIES.slice();

    events = [];

    rebuildMaps();

    renderLegend();

    renderMonth();

  }


  /*
   * Planning et authentification
   * sont lancés en parallèle.
   */
  const planningPromise =
    loadApi();


  const adminPromise =
    (async ()=>{

      try{

        await loadRole();

      }catch(e){

        IS_ADMIN =
          false;

      }


      if(IS_ADMIN){

        try{

          await loadYears();

        }catch(e){

          ADMIN_YEARS =
            [PUBLIC_YEAR];

        }

      }


      renderYears();


      if(IS_ADMIN){

        $btnLock.style.display =
          "inline-block";

      }else{

        $btnLock.style.display =
          "none";

        setEditMode(
          false
        );

      }

    })();


  await Promise.allSettled([
    planningPromise,
    adminPromise
  ]);

})();
