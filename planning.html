<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Planning — CS Consenvoye</title>

<style>

:root{
  --txt:#f4f4f4;
  --shadow:0 14px 34px rgba(0,0,0,.40);
  --radius:22px;
  --stroke:rgba(255,255,255,.10);
  --success:#20a447;
  --danger:#a72525;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:#0b0b0b;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.52),
      rgba(0,0,0,.52)
    ),
    url("background.png")
    center top / cover no-repeat;

  z-index:-2;
}

.wrap{
  height:100vh;
  max-width:980px;
  margin:0 auto;

  padding:
    calc(env(safe-area-inset-top) + 10px)
    12px
    calc(env(safe-area-inset-bottom) + 12px);

  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:10px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:10px 12px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.75),
      rgba(185,88,0,.58)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:var(--shadow);

  min-height:46px;
}

.title{
  margin:0;

  display:flex;
  align-items:center;
  gap:6px;

  font-size:18px;
  font-weight:950;

  letter-spacing:.8px;

  white-space:nowrap;
}

.yearSelect{
  padding:5px 28px 5px 10px;

  border-radius:12px;

  border:1px solid rgba(255,255,255,.22);

  background:rgba(0,0,0,.20);

  color:#fff;

  font-size:18px;
  font-weight:950;
}

.yearSelect option{
  color:#111;
  background:#fff;
}

.btn{
  border:1px solid rgba(255,255,255,.18);

  background:rgba(0,0,0,.18);

  color:#fff;

  padding:9px 12px;

  border-radius:14px;

  font-weight:900;

  cursor:pointer;

  transition:.12s;
}

.btn.saving{
  background:#177d38;
  border-color:#48db73;
}

.btn.saved{
  background:#20a447;
  border-color:#64eb89;
}

.btn:disabled{
  opacity:1;
}

.monthbar{
  display:grid;

  grid-template-columns:52px 1fr 52px;

  align-items:center;

  gap:10px;

  padding:8px 10px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.62),
      rgba(185,88,0,.45)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:var(--shadow);
}

.navbtn{
  height:42px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.14);

  background:rgba(0,0,0,.18);

  color:#fff;

  font-size:22px;
  font-weight:950;

  cursor:pointer;
}

.navbtn:disabled{
  opacity:.35;
}

.monthname{
  margin:0;

  text-align:center;

  font-size:22px;

  font-weight:950;
}

.calCard{
  min-height:0;

  display:flex;

  flex-direction:column;

  gap:10px;

  padding:12px;

  border-radius:22px;

  background:rgba(0,0,0,.34);

  border:1px solid var(--stroke);

  box-shadow:var(--shadow);
}

.dow{
  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:8px;

  color:rgba(255,255,255,.72);

  font-size:14px;

  font-weight:900;
}

.dow div{
  text-align:center;
}

.grid{
  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:repeat(7,1fr);

  grid-auto-rows:minmax(54px,1fr);

  gap:8px;
}

.day{
  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:18px;

  background:rgba(0,0,0,.26);

  border:1px solid rgba(255,255,255,.06);

  font-size:22px;

  font-weight:950;

  color:#fff;

  user-select:none;
}

.day.is-empty{
  opacity:.12;

  pointer-events:none;
}

.day.has-color::before{
  content:"";

  position:absolute;

  inset:0;

  border-radius:18px;

  background:var(--dayColor);

  opacity:.78;
}

.day span{
  position:relative;

  z-index:1;
}

.day.is-today{
  box-shadow:
    inset 0 0 0 4px #fff,
    0 0 8px rgba(0,0,0,.6);
}

.day.has-note::after{
  content:"";

  position:absolute;

  top:8px;
  right:8px;

  width:8px;
  height:8px;

  border-radius:100%;

  background:#fff200;

  z-index:2;
}

.legend{
  min-height:92px;

  padding:10px;

  border-radius:22px;

  background:rgba(0,0,0,.34);

  border:1px solid var(--stroke);

  box-shadow:var(--shadow);
}

.legendGrid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px 10px;
}

.legItem{
  min-height:44px;

  display:flex;

  align-items:center;

  gap:10px;

  padding:8px 10px;

  border-radius:16px;

  background:rgba(0,0,0,.18);

  border:1px solid rgba(255,255,255,.08);
}

.sq{
  width:20px;
  height:20px;

  flex:none;

  border-radius:5px;
}

.legTxt{
  font-size:18px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* MESSAGES */

.status{
  position:fixed;

  left:12px;
  right:12px;

  bottom:calc(env(safe-area-inset-bottom) + 12px);

  z-index:300;

  display:none;

  text-align:center;

  pointer-events:none;
}

.status .pill{
  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:10px 14px;

  border-radius:16px;

  background:rgba(0,0,0,.82);

  border:1px solid rgba(255,255,255,.14);

  box-shadow:var(--shadow);

  font-weight:900;
}

.status.success .pill{
  background:rgba(22,128,57,.95);
}

.status.danger .pill{
  background:rgba(151,24,24,.95);
}


/* FENÊTRES */

.noteOverlay,
.editOverlay,
.formOverlay{
  position:fixed;

  inset:0;

  display:none;

  background:rgba(0,0,0,.60);
}

.noteOverlay{
  z-index:120;
}

.editOverlay{
  z-index:140;
}

.formOverlay{
  z-index:180;
}

.noteOverlay.show,
.editOverlay.show,
.formOverlay.show{
  display:block;
}

.noteSheet,
.editSheet,
.formSheet{
  position:absolute;

  left:12px;
  right:12px;

  bottom:calc(env(safe-area-inset-bottom) + 12px);

  max-width:980px;

  margin:auto;

  display:flex;

  flex-direction:column;

  overflow:hidden;

  border-radius:22px;

  background:#171717;

  border:1px solid rgba(255,255,255,.14);

  box-shadow:var(--shadow);
}

.noteSheet{
  height:min(52vh,520px);
}

.editSheet{
  height:min(62vh,620px);
}

.formSheet{
  height:min(76vh,700px);
}

.noteHead,
.editHead,
.formHead{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding:12px;

  border-bottom:1px solid rgba(255,255,255,.10);
}

.noteTitle,
.editTitle,
.formTitle{
  font-size:16px;

  font-weight:950;
}

.noteBody,
.editBody,
.formBody{
  padding:12px;

  overflow:auto;

  display:flex;

  flex-direction:column;

  gap:10px;
}

.iconBtn,
.noteClose{
  min-width:42px;

  padding:8px 10px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.18);

  background:rgba(0,0,0,.18);

  color:#fff;

  font-weight:950;

  cursor:pointer;
}

.iconBtn.danger{
  border-color:rgba(255,80,80,.45);
}

.iconBtn.deleting{
  min-width:120px;

  background:#8d1f1f;

  border-color:#ff6060;
}

.iconBtn.deleted{
  min-width:110px;

  background:#a52222;
}

.row,
.evCard,
.formBlock,
.timeSection{
  padding:10px 12px;

  border-radius:18px;

  background:rgba(0,0,0,.22);

  border:1px solid rgba(255,255,255,.10);
}

.rowTop,
.evTop{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:6px;
}

.rowName,
.evName{
  font-weight:950;
}

.evTime{
  font-size:13px;

  font-weight:900;

  color:rgba(255,255,255,.75);
}

.rowSub,
.evMeta{
  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-bottom:8px;

  font-size:13px;

  font-weight:850;

  color:rgba(255,255,255,.75);
}

.rowBtns,
.formActions,
.editActions{
  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;
}

.chip{
  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:5px 9px;

  border-radius:999px;

  background:rgba(255,255,255,.06);
}

.chipDot{
  width:10px;
  height:10px;

  border-radius:3px;
}

.evDetails{
  font-size:15px;

  font-weight:850;

  white-space:pre-wrap;
}


/* FORMULAIRE */

.formLabel,
.timeLabel{
  display:block;

  margin-bottom:5px;

  font-size:12px;

  font-weight:900;

  text-transform:uppercase;

  color:rgba(255,255,255,.82);
}

.fieldText,
.fieldArea,
.fieldSelect{
  width:100%;

  padding:10px 12px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.10);

  outline:none;

  background:rgba(0,0,0,.20);

  color:#fff;

  font-family:inherit;

  font-size:14px;

  font-weight:900;
}

.fieldArea{
  min-height:88px;

  resize:vertical;
}


/* ROULETTES */

.timePickerGroup{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;
}

.timePickerRow{
  display:grid;

  grid-template-columns:1fr 18px 1fr;

  gap:8px;

  align-items:center;
}

.timeColon{
  text-align:center;

  font-size:24px;

  font-weight:950;
}

.wheel{
  position:relative;

  height:128px;

  overflow-y:auto;

  border-radius:18px;

  border:1px solid rgba(255,255,255,.12);

  background:rgba(255,255,255,.05);

  scrollbar-width:none;
}

.wheel::-webkit-scrollbar{
  display:none;
}

.wheelInner{
  display:flex;

  flex-direction:column;
}

.wheelPad{
  height:42px;

  flex:none;
}

.wheelItem{
  height:42px;

  flex:none;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;

  font-weight:900;

  opacity:.45;
}

.wheelItem.active{
  opacity:1;
}

.wheelFocus{
  position:absolute;

  top:42px;

  left:6px;
  right:6px;

  height:42px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.18);

  background:rgba(255,255,255,.08);

  pointer-events:none;
}

.wheelFadeTop,
.wheelFadeBottom{
  position:absolute;

  left:0;
  right:0;

  height:28px;

  pointer-events:none;

  z-index:2;
}

.wheelFadeTop{
  top:0;

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.5),
    transparent
  );
}

.wheelFadeBottom{
  bottom:0;

  background:linear-gradient(
    0deg,
    rgba(0,0,0,.5),
    transparent
  );
}

@media(max-width:520px){

  .timePickerGroup{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<div class="bg"></div>


<div class="wrap">


<div class="topbar">

  <h1 class="title">

    <span>
      PLANNING
    </span>

    <span id="yearControl"></span>

  </h1>


  <div style="display:flex;align-items:center;gap:10px">

    <span
      id="editLabel"
      style="
        display:none;
        font-size:12px;
        font-weight:800;
        color:#fff200
      ">

      MODE ÉDITION

    </span>


    <button
      class="btn"
      id="btnLock"
      style="display:none">

      🔒

    </button>


    <button
      class="btn"
      id="btnBack">

      Retour

    </button>

  </div>

</div>


<div class="monthbar">

  <button
    class="navbtn"
    id="btnPrev">

    ‹

  </button>


  <h2
    class="monthname"
    id="monthName">

    —

  </h2>


  <button
    class="navbtn"
    id="btnNext">

    ›

  </button>

</div>


<section class="calCard">


<div class="dow">

  <div>Lun</div>
  <div>Mar</div>
  <div>Mer</div>
  <div>Jeu</div>
  <div>Ven</div>
  <div>Sam</div>
  <div>Dim</div>

</div>


<div
  class="grid"
  id="grid">
</div>


</section>


<section class="legend">

  <div
    class="legendGrid"
    id="legendGrid">
  </div>

</section>


</div>


<div
  class="status"
  id="status">

  <div class="pill">

    <span id="statusIcon">
      ⚠️
    </span>

    <span id="statusTxt">
    </span>

  </div>

</div>


<!-- NOTES -->

<div
  class="noteOverlay"
  id="noteOverlay">

  <div class="noteSheet">

    <div class="noteHead">

      <div
        class="noteTitle"
        id="noteTitle">
      </div>

      <button
        class="noteClose"
        id="noteClose">

        Fermer

      </button>

    </div>


    <div
      class="noteBody"
      id="noteBody">
    </div>

  </div>

</div>


<!-- EDITION -->

<div
  class="editOverlay"
  id="editOverlay">

  <div class="editSheet">

    <div class="editHead">

      <div
        class="editTitle"
        id="editTitle">
      </div>


      <div class="editActions">

        <button
          class="iconBtn"
          id="btnAddEvent">

          ＋

        </button>


        <button
          class="iconBtn"
          id="btnCloseEdit">

          ✕

        </button>

      </div>

    </div>


    <div
      class="editBody"
      id="editBody">
    </div>

  </div>

</div>


<!-- FORMULAIRE -->

<div
  class="formOverlay"
  id="formOverlay">

  <div class="formSheet">

    <div class="formHead">

      <div
        class="formTitle"
        id="formTitle">

        Événement

      </div>


      <button
        class="iconBtn"
        id="btnFormCancel">

        ✕

      </button>

    </div>


    <div class="formBody">


      <div class="formBlock">

        <label class="formLabel">
          Titre
        </label>

        <input
          id="fTitle"
          class="fieldText"
          type="text">

      </div>


      <div class="formBlock">

        <label class="formLabel">
          Catégorie
        </label>

        <select
          id="fCategory"
          class="fieldSelect">
        </select>

      </div>


      <div class="timePickerGroup">


        <div class="timeSection">

          <label class="timeLabel">
            Heure début
          </label>


          <div class="timePickerRow">

            <div
              class="wheel"
              id="startHourWheel">

              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>

              <div
                class="wheelInner"
                id="startHourInner">
              </div>

            </div>


            <div class="timeColon">
              :
            </div>


            <div
              class="wheel"
              id="startMinuteWheel">

              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>

              <div
                class="wheelInner"
                id="startMinuteInner">
              </div>

            </div>

          </div>

        </div>


        <div class="timeSection">

          <label class="timeLabel">
            Heure fin
          </label>


          <div class="timePickerRow">

            <div
              class="wheel"
              id="endHourWheel">

              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>

              <div
                class="wheelInner"
                id="endHourInner">
              </div>

            </div>


            <div class="timeColon">
              :
            </div>


            <div
              class="wheel"
              id="endMinuteWheel">

              <div class="wheelFadeTop"></div>
              <div class="wheelFadeBottom"></div>
              <div class="wheelFocus"></div>

              <div
                class="wheelInner"
                id="endMinuteInner">
              </div>

            </div>

          </div>

        </div>


      </div>


      <div class="formBlock">

        <label class="formLabel">
          Lieu
        </label>

        <input
          id="fLocation"
          class="fieldText"
          type="text">

      </div>


      <div class="formBlock">

        <label class="formLabel">
          Détails / note
        </label>

        <textarea
          id="fDetails"
          class="fieldArea">
        </textarea>

      </div>


      <div
        class="formActions"
        style="justify-content:flex-end">

        <button
          class="btn"
          id="btnFormClose">

          Annuler

        </button>


        <button
          class="btn"
          id="btnFormSave">

          Enregistrer

        </button>

      </div>


    </div>

  </div>

</div>

){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase()
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .replace(
    /['’]/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  );

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function ymd(
  date
){

  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth()+1
    ).padStart(
      2,
      "0"
    )
    +
    "-"
    +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function getCacheKey_(){

    "cs_planning_cache_v2_"

function getEmailLocal(){

function firstMondayGrid(
  year,
  month
){

  const d =
  new Date(
    year,
    month,
    1
  );


  const offset =
  d.getDay() === 0
    ? 6
    : d.getDay()-1;


  d.setDate(
    d.getDate()-offset
  );


  d.setHours(
    12,
    0,
    0,
    0
  );


  return d;

}


function toFRDate(
  value
){

  const [
    y,
    m,
    d
  ] =
  String(
    value
  )
  .split("-");


  const dt =
  new Date(
    Number(y),
    Number(m)-1,
    Number(d),
    12
  );


  return (
    dowsFR[
      dt.getDay()
    ]
    +
    " "
    +
    d
    +
    "/"
    +
    m
    +
    "/"
    +
    y
  );

}


function formatTimeRange(
  start,
  end
){

  if(
    start
    &&
    end
  ){

    return (
      start
      +
      "–"
      +
      end
    );

  }


  return (
    start
    ||
    end
    ||
    ""
  );

}

/* =========================================================
   JSONP
========================================================= */

function jsonp(
  url,
  cbName,
  timeout=15000
){

  return new Promise(
    (
      resolve,
      reject
    )=>{


      const script =
      document.createElement(
        "script"
      );


      const clean =
      ()=>{

        script.remove();


        try{

          delete window[
            cbName
          ];

        }catch(e){}

      };


      const timer =
      setTimeout(
        ()=>{

          clean();


          reject(
            new Error(
              "Timeout"
            )
          );

        },
        timeout
      );


      window[
        cbName
      ] =
      data=>{

        clearTimeout(
          timer
        );


        clean();


        resolve(
          data
        );

      };


      script.onerror =
      ()=>{

        clearTimeout(
          timer
        );


        clean();


        reject(
          new Error(
            "Erreur réseau"
          )
        );

      };


      script.src =
      url
      +
      (
        url.includes("?")
          ? "&"
          : "?"
      )
      +
      "_="
      +
      Date.now();


      document.head
        .appendChild(
          script
        );

    }
  );

}

/* =========================================================
   MAPS / COULEURS
========================================================= */

function rebuildMaps(){

  eventsByDate =
  new Map();


  categoryKeysByDate =
  new Map();


  hasNoteByDate =
  new Map();


  catColor =
  new Map();


  catLabel =
  new Map();


  catOrder =
  new Map();


  for(
    const c
    of categoriesRaw
  ){

    const name =
    String(
      c.category || ""
    ).trim();


    if(!name){
      continue;
    }


    const key =
    norm(
      name
    );


    catLabel.set(
      key,
      name
    );


    catColor.set(
      key,
      String(
        c.color || "#777"
      )
    );


    catOrder.set(
      key,
      Number(
        c.order || 9999
      )
    );

  }


  for(
    const ev
    of events
  ){

    const date =
    String(
      ev.date || ""
    ).trim();


    if(!date){
      continue;
    }


    if(
      !eventsByDate.has(
        date
      )
    ){

      eventsByDate.set(
        date,
        []
      );

    }


    eventsByDate
      .get(
        date
      )
      .push(
        ev
      );


    if(
      String(
        ev.details || ""
      ).trim()
    ){

      hasNoteByDate.set(
        date,
        true
      );

    }

  }


  for(
    const [
      date,
      arr
    ]
    of
    eventsByDate.entries()
  ){

    const set =
    new Set();


    for(
      const ev
      of arr
    ){

      const key =
      norm(
        ev.category || ""
      );


      if(key){

        set.add(
          key
        );

      }

    }


    const keys =
    [
      ...set
    ];


    keys.sort(
      (
        a,
        b
      )=>
        (
          catOrder.get(a)
          ||
          9999
        )
        -
        (
          catOrder.get(b)
          ||
          9999
        )
    );


    categoryKeysByDate.set(
      date,
      keys
    );

  }

}


function getColorForCategory(
  key
){

  return (
    catColor.get(
      norm(
        key
      )
    )
    ||
    "#777"
  );

}


function getDayBackground(
  date
){

  const keys =
  categoryKeysByDate.get(
    date
  )
  ||
  [];


  if(
    !keys.length
  ){

    return "";

  }


  const colors =
  keys.map(
    getColorForCategory
  );


  if(
    colors.length === 1
  ){

    return colors[0];

  }


  const step =
  100
  /
  colors.length;


  const parts =
  [];


  colors.forEach(
    (
      color,
      index
    )=>{

      const start =
      index
      *
      step;


      const end =
      (
        index+1
      )
      *
      step;


      parts.push(
        `${color} ${start}%`
      );


      parts.push(
        `${color} ${end}%`
      );

    }
  );


  return (
    "linear-gradient(90deg,"
    +
    parts.join(",")
    +
    ")"
  );

}

function renderMonth(){

  $monthName.textContent =
  monthsFR[
    currentMonth
  ];


  $btnPrev.disabled =
  currentMonth === 0;


  $btnNext.disabled =
  currentMonth === 11;


  const first =
  firstMondayGrid(
    ACTIVE_YEAR,
    currentMonth
  );


  const today =
  ymd(
    new Date()
  );


  $grid.innerHTML =
  "";


  for(
    let i=0;
    i<42;
    i++
  ){

    const d =
    new Date(
      first
    );


    d.setDate(
      first.getDate()
      +
      i
    );


    const inMonth =
    d.getMonth()
    ===
    currentMonth;


    const date =
    ymd(
      d
    );


    const cell =
    document.createElement(
      "div"
    );


    cell.className =
    "day"
    +
    (
      inMonth
        ? ""
        : " is-empty"
    );


    if(inMonth){

      cell.dataset.date =
      date;


      const bg =
      getDayBackground(
        date
      );


      if(bg){

        cell.classList.add(
          "has-color"
        );


        cell.style.setProperty(
          "--dayColor",
          bg
        );

      }


      if(
        date === today
      ){

        cell.classList.add(
          "is-today"
        );

      }


      if(
        hasNoteByDate.get(
          date
        )
      ){

        cell.classList.add(
          "has-note"
        );

      }

    }


    cell.innerHTML =
    `<span>${
      inMonth
        ? d.getDate()
        : ""
    }</span>`;


    $grid.appendChild(
      cell
    );

  }

}

      new Date();

          ===

            ?

/* =========================================================
   SYNCHRONISATION
========================================================= */

function applyPlanningResponse_(
  py
){

  events =
  Array.isArray(
    py?.events
  )
    ?
    py.events
    :
    [];


  rebuildMaps();


  renderMonth();


  savePlanningCache_(
    py
  );

}


function applyCategoriesResponse_(
  pc
){

  if(
    Array.isArray(
      pc?.categories
    )
    &&
    pc.categories.length
  ){

    categoriesRaw =
    pc.categories;


    saveCategoriesCache_(
      pc
    );


    rebuildMaps();


    renderLegend();


    renderMonth();

  }

}


function loadLocalYear_(){

  /*
    CETTE FONCTION NE FAIT
    AUCUN APPEL INTERNET.
  */

  const planningCache =
  loadPlanningCache_();


  const categoriesCache =
  loadCategoriesCache_();


  if(
    categoriesCache?.categories
  ){

    categoriesRaw =
    categoriesCache.categories;

  }


  if(
    planningCache?.py
  ){

    events =
    Array.isArray(
      planningCache.py.events
    )
      ?
      planningCache.py.events
      :
      [];

  }


  rebuildMaps();


  renderLegend();


  renderMonth();


  return {
    planningCache,
    categoriesCache
  };

}


async function refreshPlanning_(
  forceFresh=false
){

  const cb =
  "planning_"
  +
  Math.random()
    .toString(36)
    .slice(2);


  const url =
  `${API}?view=planning_year`
  +
  `&year=${ACTIVE_YEAR}`
  +
  (
    forceFresh
      ?
      "&nocache=1"
      :
      ""
  )
  +
  `&callback=${cb}`;


  const py =
  await jsonp(
    url,
    cb,
    20000
  );


  if(
    py?.ok === false
  ){

    throw new Error(
      py.error
      ||
      "Erreur planning"
    );

  }


  applyPlanningResponse_(
    py
  );


  return py;

}

function removeEventLocally_(
  ev
){

  const id =
  String(
    ev?.event_id
    ||
    ev?.id
    ||
    ""
  );


  events =
  events.filter(
    item=>{

      const itemId =
      String(
        item?.event_id
        ||
        item?.id
        ||
        ""
      );


      if(
        id
        &&
        itemId === id
      ){

        return false;

      }


      return (
        item
        !==
        ev
      );

    }
  );


  rebuildMaps();


  renderMonth();


  /*
    Sauvegarde directement
    l'état local sans l'événement.
  */

  savePlanningCache_({
    ok:true,
    events
  });

}

async function apiDeleteEvent_(
  ev
){

  const email =
  getEmailLocal();


  if(!email){

    throw new Error(
      "Email introuvable"
    );

  }


  const eventId =
  String(
    ev?.event_id
    ||
    ev?.id
    ||
    ""
  )
  .trim();


  /*
    ÉVÉNEMENT FANTÔME :
    PAS D'ID = suppression locale.
  */

  if(!eventId){

    return {
      ok:true,
      deleted:0
    };

  }


  const cb =
  "delete_"
  +
  Math.random()
    .toString(36)
    .slice(2);


  const res =
  await jsonp(

    `${API}?view=planning_delete`
    +
    `&email=${encodeURIComponent(email)}`
    +
    `&event_id=${encodeURIComponent(eventId)}`
    +
    `&nocache=1`
    +
    `&callback=${cb}`,

    cb,

    20000

  );


  if(
    !res
    ||
    res.ok !== true
  ){

    throw new Error(
      res?.error
      ||
      "Suppression impossible"
    );

  }


  /*
    deleted = 0 n'est volontairement
    PAS une erreur.
  */

  return res;

}



/* =========================================================
   FORMULAIRE / ROULETTES
========================================================= */

const HOURS =
Array.from(
  {
    length:24
  },
  (
    _,
    i
  )=>
    String(
      i
    )
    .padStart(
      2,
      "0"
    )
);


const MINUTES =
[
  "00",
  "15",
  "30",
  "45"
];


const TIME_PICKERS = {

  startHour:{
    wheel:$("startHourWheel"),
    inner:$("startHourInner"),
    values:HOURS,
    value:"08"
  },

  startMinute:{
    wheel:$("startMinuteWheel"),
    inner:$("startMinuteInner"),
    values:MINUTES,
    value:"00"
  },

  endHour:{
    wheel:$("endHourWheel"),
    inner:$("endHourInner"),
    values:HOURS,
    value:"09"
  },

  endMinute:{
    wheel:$("endMinuteWheel"),
    inner:$("endMinuteInner"),
    values:MINUTES,
    value:"00"
  }

};


function buildWheel_(
  key
){

  const picker =
  TIME_PICKERS[
    key
  ];


  picker.inner.innerHTML =
  "";


  const values =
  [];


  /*
    Moins de répétitions qu'avant :
    beaucoup moins de DOM.
  */

  for(
    let i=0;
    i<5;
    i++
  ){

    values.push(
      ...picker.values
    );

  }


  const top =
  document.createElement(
    "div"
  );


  top.className =
  "wheelPad";


  picker.inner.appendChild(
    top
  );


  for(
    const value
    of values
  ){

    const item =
    document.createElement(
      "div"
    );


    item.className =
    "wheelItem";


    item.dataset.value =
    value;


    item.textContent =
    value;


    picker.inner.appendChild(
      item
    );

  }


  const bottom =
  document.createElement(
    "div"
  );


  bottom.className =
  "wheelPad";


  picker.inner.appendChild(
    bottom
  );


  let timer;


  picker.wheel.addEventListener(
    "scroll",
    ()=>{

      clearTimeout(
        timer
      );


      timer =
      setTimeout(
        ()=>{

          updateWheel_(
            key
          );

        },
        60
      );

    }
  );

}


function updateWheel_(
  key
){

  const picker =
  TIME_PICKERS[
    key
  ];


  const items =
  [
    ...picker.inner
      .querySelectorAll(
        ".wheelItem"
      )
  ];


  const center =
  picker.wheel.scrollTop
  +
  picker.wheel.clientHeight
  /
  2;


  let nearest =
  null;


  let nearestDistance =
  Infinity;


  for(
    const item
    of items
  ){

    item.classList.remove(
      "active"
    );


    const itemCenter =
    item.offsetTop
    +
    item.offsetHeight
    /
    2;


    const distance =
    Math.abs(
      center
      -
      itemCenter
    );


    if(
      distance
      <
      nearestDistance
    ){

      nearestDistance =
      distance;


      nearest =
      item;

    }

  }


  if(nearest){

    nearest.classList.add(
      "active"
    );


    picker.value =
    nearest.dataset.value;

  }

}


function ensureWheels_(){

  if(
    WHEELS_INITIALIZED
  ){
    return;
  }


  /*
    CRÉÉES UNIQUEMENT
    QUAND ON OUVRE LE FORMULAIRE.
  */

  buildWheel_(
    "startHour"
  );


  buildWheel_(
    "startMinute"
  );


  buildWheel_(
    "endHour"
  );


  buildWheel_(
    "endMinute"
  );


  WHEELS_INITIALIZED =
  true;

}


function setWheelValue_(
  key,
  value
){

  const picker =
  TIME_PICKERS[
    key
  ];


  const items =
  [
    ...picker.inner
      .querySelectorAll(
        ".wheelItem"
      )
  ]
  .filter(
    item=>
      item.dataset.value
      ===
      value
  );


  const item =
  items[
    Math.floor(
      items.length/2
    )
  ];


  if(!item){
    return;
  }


  picker.wheel.scrollTop =
  item.offsetTop
  -
  picker.wheel.clientHeight
  /
  2
  +
  item.offsetHeight
  /
  2;


  picker.value =
  value;


  updateWheel_(
    key
  );

}


function setTime_(
  prefix,
  value
){

  const [
    h,
    m
  ] =
  String(
    value || "00:00"
  )
  .split(":");


  setWheelValue_(
    prefix+"Hour",
    HOURS.includes(h)
      ?
      h
      :
      "00"
  );


  setWheelValue_(
    prefix+"Minute",
    MINUTES.includes(m)
      ?
      m
      :
      "00"
  );

}


function getTime_(
  prefix
){

  return (
    TIME_PICKERS[
      prefix+"Hour"
    ].value
    +
    ":"
    +
    TIME_PICKERS[
      prefix+"Minute"
    ].value
  );

}


function buildCategoryOptions_(

async function apiAddEvent_(
  date,
  payload
){

  const email =
  getEmailLocal();


  if(!email){

    throw new Error(
      "Email introuvable"
    );

  }


  const cb =
  "add_"
  +
  Math.random()
    .toString(36)
    .slice(2);


  const url =
  `${API}?view=planning_add`
  +
  `&email=${encodeURIComponent(email)}`
  +
  `&date=${encodeURIComponent(date)}`
  +
  `&start=${encodeURIComponent(payload.start)}`
  +
  `&end=${encodeURIComponent(payload.end)}`
  +
  `&title=${encodeURIComponent(payload.title)}`
  +
  `&category=${encodeURIComponent(payload.category)}`
  +
  `&location=${encodeURIComponent(payload.location)}`
  +
  `&details=${encodeURIComponent(payload.details)}`
  +
  `&nocache=1`
  +
  `&callback=${cb}`;


  const res =
  await jsonp(
    url,
    cb,
    20000
  );


  if(
    !res
    ||
    res.ok !== true
  ){

    throw new Error(
      res?.error
      ||
      "Enregistrement impossible"
    );

  }


  return res;

}



/* =========================================================
   ENREGISTREMENT
========================================================= */

function setSaveState_(
  state
){

  $btnFormSave.classList.remove(
    "saving",
    "saved"
  );


  if(
    state === "saving"
  ){

    $btnFormSave.classList.add(
      "saving"
    );


    $btnFormSave.textContent =
    "Enregistrement…";


    $btnFormSave.disabled =
    true;

  }

  else if(
    state === "saved"
  ){

    $btnFormSave.classList.add(
      "saved"
    );


    $btnFormSave.textContent =
    "✓ Enregistré";


    $btnFormSave.disabled =
    true;

  }

  else{

    $btnFormSave.textContent =
    "Enregistrer";


    $btnFormSave.disabled =
    false;

  }

}


function addEventLocally_(
  payload,
  response
){

  if(
    FORM_STATE.mode
    ===
    "edit"
    &&
    FORM_STATE.originalEvent
  ){

    const old =
    FORM_STATE.originalEvent;


    const id =
    String(
      old.event_id
      ||
      old.id
      ||
      ""
    );


    events =
    events.filter(
      item=>{

        if(
          item === old
        ){

          return false;

        }


        if(
          id
          &&
          String(
            item.event_id
            ||
            item.id
            ||
            ""
          )
          ===
          id
        ){

          return false;

        }


        return true;

      }
    );

  }


  const newEvent = {

    date:
    FORM_STATE.dateStr,

    title:
    payload.title,

    category:
    payload.category,

    start:
    payload.start,

    end:
    payload.end,

    location:
    payload.location,

    details:
    payload.details

  };


  /*
    Si Apps Script renvoie
    l'identifiant, on le garde.
  */

  if(
    response?.event_id
  ){

    newEvent.event_id =
    response.event_id;

  }


  if(
    response?.id
    &&
    !newEvent.event_id
  ){

    newEvent.id =
    response.id;

  }


  events.push(
    newEvent
  );


  rebuildMaps();


  renderMonth();


  savePlanningCache_({
    ok:true,
    events
  });

}


async function saveEventForm_(){

  if(
    SAVE_IN_PROGRESS
  ){
    return;
  }


  const payload = {

    title:
    String(
      $fTitle.value || ""
    ).trim(),

    category:
    String(
      $fCategory.value || ""
    ).trim(),

    location:
    String(
      $fLocation.value || ""
    ).trim(),

    details:
    String(
      $fDetails.value || ""
    ).trim(),

    start:
    getTime_(
      "start"
    ),

    end:
    getTime_(
      "end"
    )

  };


  if(
    !payload.title
  ){

    alert(
      "Titre obligatoire."
    );


    return;

  }


  if(
    payload.end
    <
    payload.start
  ){

    alert(
      "Heure de fin incorrecte."
    );


    return;

  }


  SAVE_IN_PROGRESS =
  true;


  setSaveState_(
    "saving"
  );


  try{

    /*
      MODIFICATION =
      suppression ancienne ligne
      puis ajout nouvelle ligne.
    */

    if(
      FORM_STATE.mode
      ===
      "edit"
      &&
      FORM_STATE.originalEvent
    ){

      await apiDeleteEvent_(
        FORM_STATE.originalEvent
      );

    }


    const response =
    await apiAddEvent_(
      FORM_STATE.dateStr,
      payload
    );


    /*
      L'ÉCRAN EST MODIFIÉ
      IMMÉDIATEMENT.
    */

    addEventLocally_(
      payload,
      response
    );


    setSaveState_(
      "saved"
    );


    await new Promise(
      resolve=>
        setTimeout(
          resolve,
          200
        )
    );


    closeEventForm();


    closeEdit();


    showSavedMessage();


    /*
      GOOGLE EST RELU APRÈS,
      SANS ATTENTE VISUELLE.
    */

    refreshPlanning_(
      true
    )
    .catch(
      ()=>{}
    );


  }catch(error){

    alert(
      "Erreur enregistrement : "
      +
      String(
        error?.message
        ||
        error
      )
    );

  }


  SAVE_IN_PROGRESS =
  false;


  setTimeout(
    ()=>setSaveState_(
      "normal"
    ),
    300
  );

}
