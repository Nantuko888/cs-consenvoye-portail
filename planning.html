<script>
const API="https://script.google.com/macros/s/AKfycbzPHCDdW7wkFCVkMOL_2srZmdnjZ1QKmToUFtqIZBPjSUNtOwM-Ac7ua0w9dhCv3oI/exec";
const BACK_URL="index.html",PUBLIC_YEAR=2026,LS_EMAIL="cs_portail_email_v1",LS_ROLE="cs_role_v1",CACHE_MAX_AGE_MS=604800000;
let ADMIN_YEARS=[PUBLIC_YEAR],ACTIVE_YEAR=PUBLIC_YEAR,IS_ADMIN=false,EDIT_MODE=false,events=[],categoriesRaw=[],eventsByDate=new Map(),catColor=new Map(),catLabel=new Map(),catOrder=new Map(),firstCatByDate=new Map(),hasNoteByDate=new Map(),currentMonth=0,_editDate="";
const DEFAULT_CATEGORIES=[{category:"FMA centre",color:"#ff2d2d",order:1},{category:"FMA équipe 1",color:"#24d36a",order:2},{category:"FMA équipe 2",color:"#f6a000",order:3},{category:"JSP",color:"#4aa8ff",order:4},{category:"Navette",color:"#2f79ff",order:5},{category:"RECSEC",color:"#a081ff",order:6},{category:"Sainte Barbe",color:"#ff5a5a",order:7}],OVERRIDE_COLORS={"fma centre":"#ff2d2d"};
const $=id=>document.getElementById(id),monthsFR=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"],dowsFR=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,"0")),MINUTES=["00","15","30","45"];
const TIME_PICKERS={startHour:{wheel:$("startHourWheel"),inner:$("startHourInner"),values:HOURS,value:"08"},startMinute:{wheel:$("startMinuteWheel"),inner:$("startMinuteInner"),values:MINUTES,value:"00"},endHour:{wheel:$("endHourWheel"),inner:$("endHourInner"),values:HOURS,value:"09"},endMinute:{wheel:$("endMinuteWheel"),inner:$("endMinuteInner"),values:MINUTES,value:"00"}};
let FORM_STATE={mode:"add",dateStr:"",originalEvent:null},FORM_ATTACHMENT_URL="",FORM_ORIGINAL_ATTACHMENT_URL="",FORM_NEW_UPLOAD_URL="";

function norm(s){return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['’]/g,"").replace(/\s+/g," ")}
function escapeHtml(s){return(s==null?"":String(s)).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function firstMondayGrid(y,m){const d=new Date(y,m,1),o=d.getDay()===0?6:d.getDay()-1;d.setDate(d.getDate()-o);d.setHours(12,0,0,0);return d}
function toFRDate(s){const[y,m,d]=String(s||"").split("-");if(!y||!m||!d)return s;const dt=new Date(+y,+m-1,+d,12);return`${dowsFR[dt.getDay()]} ${d}/${m}/${y}`}
function formatTimeRange(s,e){s=String(s||"").trim();e=String(e||"").trim();return s&&e?`${s}–${e}`:s||e||""}
function getEmailLocal(){return(localStorage.getItem(LS_EMAIL)||"").trim().toLowerCase()}
function getAttachmentUrl_(ev){return String(ev?.attachment_url||ev?.piece_jointe||ev?.attachment||ev?.image_url||ev?.image||"").trim()}
function getCacheKey_(){return`cs_planning_cache_v2_${ACTIVE_YEAR}`}
function showStatus(t,s){$("statusTxt").textContent=t||"";$("statusSub").textContent=s||"";$("status").style.display="block"}
function hideStatus(){$("status").style.display="none"}

function jsonp(url,cb,timeout=15000){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    const cleanup=()=>{
      script.remove();
      try{delete window[cb]}catch(e){window[cb]=undefined}
    };
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("Timeout JSONP"));
    },timeout);

    window[cb]=data=>{
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.src=url+(url.includes("?")?"&":"?")+"t="+Date.now();

    script.onerror=()=>{
      clearTimeout(timer);
      cleanup();
      reject(new Error("Erreur JSONP"));
    };

    document.head.appendChild(script);
  });
}

async function loadMyRole_(){
  const savedRole=String(localStorage.getItem(LS_ROLE)||"").trim().toLowerCase();

  IS_ADMIN=
    savedRole==="admin"
    ||
    savedRole==="administrateur";

  const email=getEmailLocal();

  if(!email)return;

  const cb=
    "cb_auth_"
    +
    Math.random().toString(36).slice(2);

  try{
    const res=
      await jsonp(
        `${API}?view=auth_check&email=${encodeURIComponent(email)}&callback=${cb}`,
        cb,
        8000
      );

    if(res?.ok===true){
      const role=
        String(res.role||"")
          .trim()
          .toLowerCase();

      IS_ADMIN=
        role==="admin"
        ||
        role==="administrateur";

      try{
        localStorage.setItem(
          LS_ROLE,
          role
        );
      }catch(e){}
    }
  }catch(e){}
}

async function loadPlanningYears_(){
  const currentYear=
    new Date().getFullYear();

  ADMIN_YEARS=[
    currentYear,
    currentYear+1
  ];
}

function rebuildMaps(){
  eventsByDate=new Map();
  hasNoteByDate=new Map();

  for(const ev of events){
    const d=String(ev.date||"").trim();

    if(!d)continue;

    if(!eventsByDate.has(d)){
      eventsByDate.set(d,[]);
    }

    eventsByDate.get(d).push(ev);

    if(
      String(ev.details||"").trim()
      ||
      getAttachmentUrl_(ev)
    ){
      hasNoteByDate.set(d,true);
    }
  }

  catColor=new Map();
  catLabel=new Map();
  catOrder=new Map();

  const cats=[
    ...(categoriesRaw.length?categoriesRaw:DEFAULT_CATEGORIES)
  ]
  .map(c=>({
    category:String(c.category||"").trim(),
    color:String(c.color||"").trim(),
    order:Number(c.order||9999)||9999
  }))
  .filter(c=>c.category)
  .sort((a,b)=>(a.order-b.order)||a.category.localeCompare(b.category));

  for(const c of cats){
    const k=norm(c.category);

    if(catLabel.has(k))continue;

    catLabel.set(k,c.category);
    catColor.set(k,OVERRIDE_COLORS[k]||c.color||"rgba(255,255,255,.25)");
    catOrder.set(k,c.order);
  }

  firstCatByDate=new Map();

  for(const[d,arr]of eventsByDate){
    let best="";
    let bo=9999;

    for(const ev of arr){
      const k=norm(ev.category||"");
      const o=catOrder.get(k)??9999;

      if(o<bo){
        bo=o;
        best=k;
      }
    }

    firstCatByDate.set(
      d,
      best||norm(arr[0]?.category||"")
    );
  }
}

function getColorForCategory(k){
  k=norm(k);
  return OVERRIDE_COLORS[k]||catColor.get(k)||"rgba(255,255,255,.25)";
}

      ACTIVE_YEAR,

  const cb=
    "cb_add_"

  const url=
    `${API}?view=planning_add`
    +
    `&email=${encodeURIComponent(email)}`
    +
    `&date=${encodeURIComponent(dateStr)}`
    +
    `&start=${encodeURIComponent(p.start||"")}`
    +
    `&end=${encodeURIComponent(p.end||"")}`
    +
    `&title=${encodeURIComponent(p.title||"")}`
    +

    +

async function apiDeleteEvent_(dateStr,ev){
  const email=getEmailLocal();

  if(!email){
    throw new Error(
      "Email introuvable. Reconnecte-toi sur le portail."
    );
  }

  const id=
    String(
      ev?.event_id
      ||
      ev?.id
      ||
      ""
    ).trim();

  const cb=
    "cb_del_"
    +
    Math.random().toString(36).slice(2);

  let url=
    `${API}?view=planning_delete`
    +
    `&email=${encodeURIComponent(email)}`;

  url+=
    id
      ?`&event_id=${encodeURIComponent(id)}`
      :`&date=${encodeURIComponent(dateStr)}&title=${encodeURIComponent(ev?.title||"")}&start=${encodeURIComponent(ev?.start||"")}`;

  url+=
    `&callback=${cb}`;

  const res=
    await jsonp(
      url,
      cb,
      20000
    );

  if(!res?.ok){
    throw new Error(
      res?.error||"Erreur suppression"
    );
  }

  if(Number(res.deleted||0)<1){

      "Événement introuvable dans le planning."
    );
  }

  return res;
}

function buildWheel(key){
  const p=
    TIME_PICKERS[key];

  if(
    !p
    ||
    !p.wheel
    ||
    !p.inner
  )return;

  p.inner.innerHTML=
    '<div class="wheelPad"></div>';

  for(let r=0;r<9;r++){
    for(const v of p.values){
      const i=
        document.createElement("div");

      i.className="wheelItem";
      i.dataset.value=v;
      i.textContent=v;

      i.onclick=
        ()=>setWheelValue(key,v,true);

      p.inner.appendChild(i);
    }
  }

  p.inner.insertAdjacentHTML(
    "beforeend",
    '<div class="wheelPad"></div>'
  );

  p.wheel.addEventListener(
    "scroll",
    ()=>{
      clearTimeout(p.timer);

      p.timer=
        setTimeout(
          ()=>snapWheel(key),
          70
        );
    }
  );
}

function getWheelItems(k){
  return[
    ...TIME_PICKERS[k]
      .inner
      .querySelectorAll(".wheelItem")
  ];
}

function nearest(k){
  const p=
    TIME_PICKERS[k];

  const c=
    p.wheel.scrollTop
    +
    p.wheel.clientHeight/2;

  let best=null;
  let dist=Infinity;

  for(const i of getWheelItems(k)){
    const d=
      Math.abs(
        c
        -
        (
          i.offsetTop
          +
          i.offsetHeight/2
        )
      );

    if(d<dist){
      dist=d;
      best=i;
    }
  }

  return best;
}

function setWheelValue(k,v,smooth=false){
  const p=
    TIME_PICKERS[k];

  const items=
    getWheelItems(k)
      .filter(
        i=>i.dataset.value===v
      );

  const target=
    items[
      Math.floor(items.length/2)
    ];

  if(!target)return;

  p.wheel.scrollTo({
    top:
      target.offsetTop
      -
      (
        p.wheel.clientHeight
        -
        target.offsetHeight
      )/2,
    behavior:smooth?"smooth":"auto"
  });

  p.value=v;

  setTimeout(
    ()=>{
      getWheelItems(k)
        .forEach(
          i=>
            i.classList.toggle(
              "active",
              i===nearest(k)
            )
        );

      const n=
        nearest(k);

      if(n){
        p.value=n.dataset.value;
      }
    },
    smooth?150:0
  );
}

function snapWheel(k){
  const p=
    TIME_PICKERS[k];

  const i=
    nearest(k);

  if(!i)return;

  p.wheel.scrollTo({
    top:
      i.offsetTop
      -
      (
        p.wheel.clientHeight
        -
        i.offsetHeight
      )/2,
    behavior:"smooth"
  });

  p.value=i.dataset.value;

  getWheelItems(k)
    .forEach(
      x=>
        x.classList.toggle(
          "active",
          x===i
        )
    );
}

async function saveEventForm(){
  const title=
    $("fTitle").value.trim();

  const category=
    $("fCategory").value.trim();

  const location=
    $("fLocation").value.trim();

  const details=
    $("fDetails").value.trim();

  const start=
    getTimeValue("start");

  const end=
    getTimeValue("end");

  const attachment_url=
    String(
      FORM_ATTACHMENT_URL||""
    ).trim();

  if(!title){
    alert("Titre obligatoire.");
    return;
  }

  const min=t=>{
    const[h,m]=
      t.split(":").map(Number);

    return h*60+m;
  };

  let endM=
    end==="00:00"
    &&
    start!=="00:00"
      ?1440
      :min(end);

  if(endM<min(start)){
    alert("Heure fin incorrecte.");
    return;
  }

  const btn=
    $("btnFormSave");

  btn.disabled=true;
  btn.textContent="Enregistrement…";

  try{
    const old=
      FORM_STATE.originalEvent;

    if(
      FORM_STATE.mode==="edit"
      &&
      old
    ){
      await apiDeleteEvent_(
        FORM_STATE.dateStr,
        old
      );
    }

    const res=
      await apiAddEvent_(
        FORM_STATE.dateStr,
        {
          title,
          start,
          end,
          category,
          location,
          details,
          attachment_url
        }
      );

    if(old){
      events=
        events.filter(
          x=>x!==old
        );
    }

    const ev={
      event_id:res.event_id||"",
      id:res.event_id||"",
      date:FORM_STATE.dateStr,
      title,
      start,
      end,
      category,
      location,
      details,
      attachment_url
    };

    events.push(ev);

    const oldAtt=
      String(
        FORM_ORIGINAL_ATTACHMENT_URL||""
      ).trim();

    FORM_NEW_UPLOAD_URL="";

    if(
      oldAtt
      &&
      oldAtt!==attachment_url
    ){
      apiDeleteAttachment_(
        oldAtt
      ).catch(()=>{});
    }

    rebuildMaps();
    renderMonth();
    saveCacheCurrent_();

    $("formOverlay")
      .classList
      .remove("show");

    FORM_ATTACHMENT_URL="";
    FORM_ORIGINAL_ATTACHMENT_URL="";
    FORM_NEW_UPLOAD_URL="";

    if(_editDate){
      renderEditList(_editDate);
    }

    btn.textContent="✓ Enregistré";

  }catch(err){
    alert(
      "Erreur : "
      +
      (err?.message||err)
    );
  }finally{
    btn.disabled=false;

    setTimeout(
      ()=>btn.textContent="Enregistrer",
      350
    );
  }
}

function saveCache_(payload){
  try{
    localStorage.setItem(
      getCacheKey_(),
      JSON.stringify({
        savedAt:Date.now(),
        payload
      })
    );
  }catch(e){}
}

function loadCache_(){
  try{
    const o=
      JSON.parse(
        localStorage.getItem(
          getCacheKey_()
        )
        ||
        "null"
      );

    return(
      o?.payload
      &&
      (
        !o.savedAt
        ||
        Date.now()-o.savedAt<=CACHE_MAX_AGE_MS
      )
    )
      ?o.payload
      :null;

  }catch(e){
    return null;
  }
}

function saveCacheCurrent_(){
  saveCache_({
    py:{
      ok:true,
      year:ACTIVE_YEAR,
      events
    },
    pc:{
      ok:true,
      categories:categoriesRaw
    }
  });
}

function applyPlanningData_(py,pc){
  events=
    Array.isArray(py?.events)
      ?py.events
      :[];

  categoriesRaw=
    Array.isArray(pc?.categories)
    &&
    pc.categories.length
      ?pc.categories
      :DEFAULT_CATEGORIES.slice();

  rebuildMaps();
  renderLegend();
  renderMonth();
}

async function loadApi(forceFresh=false){
  const cached=
    loadCache_();

  if(
    !forceFresh
    &&
    cached?.py
    &&
    cached?.pc
  ){
    applyPlanningData_(
      cached.py,
      cached.pc
    );

    showStatus(
      "Synchronisation…",
      "Mise à jour en cours."
    );

  }else{
    showStatus(
      "Chargement…",
      "Récupération du planning."
    );
  }

  const cb1=
    "cb_py_"
    +
    Math.random().toString(36).slice(2);

  const cb2=
    "cb_pc_"
    +
    Math.random().toString(36).slice(2);

  try{
    const[py,pc]=
      await Promise.all([
        jsonp(
          `${API}?view=planning_year&year=${ACTIVE_YEAR}${forceFresh?"&nocache=1":""}&callback=${cb1}`,
          cb1
        ),
        jsonp(
          `${API}?view=planning_categories${forceFresh?"&nocache=1":""}&callback=${cb2}`,
          cb2
        )
      ]);

    if(py?.ok===false){
      throw new Error(
        py.error||"planning invalide"
      );
    }

    if(pc?.ok===false){
      throw new Error(
        pc.error||"catégories invalides"
      );
    }

    applyPlanningData_(py,pc);

    saveCache_({
      py,
      pc
    });

    hideStatus();

  }catch(e){
    if(
      cached?.py
      &&
      cached?.pc
    ){
      showStatus(
        "Hors ligne / lent",
        "Données en cache."
      );

      setTimeout(
        hideStatus,
        2200
      );

      return;
    }

    events=[];
    categoriesRaw=
      DEFAULT_CATEGORIES.slice();

    rebuildMaps();
    renderLegend();
    renderMonth();

    showStatus(
      "API HS / lente",
      "Impossible de charger le planning."
    );
  }
}

      o.selected=
        y===ACTIVE_YEAR;

      s.appendChild(o);
    }

  }else{
    ACTIVE_YEAR=
      PUBLIC_YEAR;

    $("yearText").textContent=
      PUBLIC_YEAR;

    $("yearText").style.display=
      "inline";

    $("yearSelect").style.display=
      "none";
  }
}

$("btnBack").onclick=
  ()=>location.href=BACK_URL;

$("btnPrev").onclick=
  ()=>{
    if(currentMonth>0){
      currentMonth--;
      renderMonth();
    }
  };

$("btnNext").onclick=
  ()=>{
    if(currentMonth<11){
      currentMonth++;
      renderMonth();
    }
  };

$("btnLock").onclick=
  ()=>IS_ADMIN&&setEditMode(!EDIT_MODE);

$("noteClose").onclick=
  closeNote;

$("btnCloseEdit").onclick=
  closeEdit;

$("btnAddEvent").onclick=
  ()=>_editDate&&openEventForm("add",_editDate,null);

$("btnFormCancel").onclick=
  closeEventForm;

$("btnFormClose").onclick=
  closeEventForm;

$("btnFormSave").onclick=
  saveEventForm;

$("btnAttachmentUpload").onclick=
  openAttachmentUpload_;

$("btnAttachmentUploadClose").onclick=
  closeAttachmentUpload_;

$("btnAttachmentRemove").onclick=
  ()=>{
    const u=
      String(
        FORM_ATTACHMENT_URL||""
      ).trim();

    if(!u)return;

    if(
      FORM_NEW_UPLOAD_URL
      &&
      u===FORM_NEW_UPLOAD_URL
    ){
      const tmp=
        FORM_NEW_UPLOAD_URL;

      FORM_NEW_UPLOAD_URL="";

      apiDeleteAttachment_(tmp)
        .catch(()=>{});
    }

    FORM_ATTACHMENT_URL="";

    renderAttachmentPreview_();
  };

$("grid").onclick=
  e=>{
    const d=
      e.target.closest(".day");

    if(
      !d
      ||
      d.classList.contains("is-empty")
      ||
      !d.dataset.date
    )return;

    if(
      EDIT_MODE
      &&
      IS_ADMIN
    ){
      openEdit(d.dataset.date);
    }else if(
      d.classList.contains("has-note")
    ){
      openNote(d.dataset.date);
    }
  };

$("noteOverlay").onclick=
  e=>
    e.target===$("noteOverlay")
    &&
    closeNote();

$("editOverlay").onclick=
  e=>
    e.target===$("editOverlay")
    &&
    closeEdit();

$("formOverlay").onclick=
  e=>
    e.target===$("formOverlay")
    &&
    closeEventForm();

$("imageViewerClose").onclick=
  closeImageViewer_;

$("imageViewer").onclick=
  e=>{
    if(
      e.target===$("imageViewer")
      ||
      e.target.classList.contains("imageViewerBody")
    ){
      closeImageViewer_();
    }
  };

window.addEventListener(
  "message",
  e=>{
    const d=e.data||{};

    if(
      d.type==="planning-attachment-success"
    ){
      const u=
        String(
          d.url
          ||
          d.attachment_url
          ||
          d.file_url
          ||
          ""
        ).trim();

      if(!u){
        alert(
          "L'image a été envoyée mais aucune URL n'a été reçue."
        );
        return;
      }

      const prev=
        String(
          FORM_NEW_UPLOAD_URL||""
        ).trim();

      if(
        prev
        &&
        prev!==u
      ){
        apiDeleteAttachment_(prev)
          .catch(()=>{});
      }

      FORM_NEW_UPLOAD_URL=u;
      FORM_ATTACHMENT_URL=u;

      renderAttachmentPreview_();
      closeAttachmentUpload_();

    }else if(
      d.type==="planning-attachment-close"
    ){
      closeAttachmentUpload_();
    }
  }
);

$("yearSelect").onchange=
  async()=>{
    if(!IS_ADMIN)return;

    const y=
      Number(
        $("yearSelect").value
      );

    if(!ADMIN_YEARS.includes(y))return;

    ACTIVE_YEAR=y;

    closeNote();
    closeEdit();

    events=[];

    rebuildMaps();

    currentMonth=
      new Date().getFullYear()===ACTIVE_YEAR
        ?new Date().getMonth()
        :0;

    renderMonth();

    await loadApi();
  };

document.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Escape"){
      closeImageViewer_();
      closeNote();
      closeEdit();
      closeEventForm();
    }
  }
);

(async function(){
  categoriesRaw=
    DEFAULT_CATEGORIES.slice();

  rebuildMaps();
  renderLegend();

  const now=
    new Date();

  currentMonth=
    now.getFullYear()===PUBLIC_YEAR
      ?now.getMonth()
      :0;

  renderMonth();

  try{
    initWheels();
  }catch(e){
    console.warn(
      "Sélecteurs horaires non initialisés",
      e
    );
  }

  const planningPromise=
    loadApi().catch(()=>{});

  try{
    await loadMyRole_();
  }catch(e){}

  if(IS_ADMIN){
    $("btnLock").style.display=
      "inline-block";

    try{
      await loadPlanningYears_();
    }catch(e){}

  }else{
    $("btnLock").style.display=
      "none";

    setEditMode(false);
  }

  updateYearDisplay_();

  await planningPromise;
})();
</script>
</body>
</html>
