<style>
:root{
  --maxw: 760px;
  --titleMaxH: 34vh;
  --btn: clamp(100px, min(22vw, 15vh), 170px);

html, body{

  overscroll-behavior-y:none;

/* modes */
body.mode-login{

.title{
  margin-top: calc(env(safe-area-inset-top) + 2px);

/* RAMPE LUMINEUSE */
.refreshBtn{
  position:fixed;
  top:14px;
  left:14px;
  z-index:9999;

  width:62px;
  height:44px;
  padding:0;

  border:none;
  background:transparent;
  box-shadow:none;
  cursor:pointer;

  display:none;
  align-items:center;
  justify-content:center;

  -webkit-tap-highlight-color:transparent;
}

.lightbarIcon{
  width:58px;
  height:34px;
  display:block;
  overflow:visible;
  filter: drop-shadow(0 0 3px rgba(120,190,255,.14));
}

.barShell{
  fill: rgba(20,28,38,.78);
  stroke: rgba(255,255,255,.16);
  stroke-width: 1.3;
}

.barFoot{
  fill: rgba(255,255,255,.55);
}

.mod{
  opacity:.28;
  transition:opacity .15s linear, filter .15s linear;
}
.modBlue{
  fill:#3d8cff;
}
.modWhite{
  fill:#eef7ff;
}

.refreshBtn:not(.loading) .lightbarIcon{
  opacity:.92;
  transform:scale(1);
}

.refreshBtn:not(.loading) .modLeftBlue,
.refreshBtn:not(.loading) .modRightBlue{
  opacity:.72;
  filter: drop-shadow(0 0 4px rgba(61,140,255,.28));
}
.refreshBtn:not(.loading) .modMidWhite{
  opacity:.56;
  filter: drop-shadow(0 0 4px rgba(255,255,255,.18));
}

.refreshBtn.loading .lightbarIcon{
  animation: barBodyPulse .9s linear infinite;
}

.refreshBtn.loading .modLeftBlue{
  animation: flashLeft .9s linear infinite;
}
.refreshBtn.loading .modMidWhite{
  animation: flashCenter .9s linear infinite;
}
.refreshBtn.loading .modRightBlue{
  animation: flashRight .9s linear infinite;
}

@keyframes barBodyPulse{
  0%,100%{
    transform:scale(1);
    filter: drop-shadow(0 0 4px rgba(110,180,255,.16));
  }
  50%{
    transform:scale(1.03);
    filter:
      drop-shadow(0 0 6px rgba(110,180,255,.24))
      drop-shadow(0 0 12px rgba(255,255,255,.10));
  }
}

@keyframes flashLeft{
  0%,100%{
    opacity:.22;
    filter:none;
  }
  10%,28%{
    opacity:1;
    filter:
      drop-shadow(0 0 6px rgba(61,140,255,.75))
      drop-shadow(0 0 14px rgba(61,140,255,.45));
  }
  40%,100%{
    opacity:.22;
    filter:none;
  }
}

@keyframes flashCenter{
  0%,18%{
    opacity:.18;
    filter:none;
  }
  30%,48%{
    opacity:1;
    filter:
      drop-shadow(0 0 8px rgba(255,255,255,.78))
      drop-shadow(0 0 16px rgba(255,255,255,.35));
  }
  60%,100%{
    opacity:.18;
    filter:none;
  }
}

@keyframes flashRight{
  0%,40%{
    opacity:.22;
    filter:none;
  }
  52%,70%{
    opacity:1;
    filter:
      drop-shadow(0 0 6px rgba(61,140,255,.75))
      drop-shadow(0 0 14px rgba(61,140,255,.45));
  }
  82%,100%{
    opacity:.22;
    filter:none;
  }
}

<script>
/* CONFIG */
const GOOGLE_CLIENT_ID = "690765229829-6m73boc7cn4lhkvjel8aa2vo96e83f0t.apps.googleusercontent.com";
const API = "https://script.google.com/macros/s/AKfycbzPHCDdW7wkFCVkMOL_2srZmdnjZ1QKmToUFtqIZBPjSUNtOwM-Ac7ua0w9dhCv3oI/exec";
const LS_KEY = "cs_portail_email_v1";

/* DOM */
const $loginBox = document.getElementById("loginBox");
const $portal = document.getElementById("portal");
const $msg = document.getElementById("loginMsg");
const $logoutPortal = document.getElementById("logoutBtnPortal");
const $refreshBtn = document.getElementById("refreshBtn");

/* UI */
function showMsg(t){
  $msg.textContent = t || "";
}
function showSync(){
  if($refreshBtn){
    $refreshBtn.classList.add("loading");
    $refreshBtn.style.display = "flex";
  }
}
function hideSync(){
  if($refreshBtn){
    $refreshBtn.classList.remove("loading");
  }
}
function showRefreshBtn(){
  if($refreshBtn) $refreshBtn.style.display = "flex";
}
function hideRefreshBtn(){

}

/* État URL portail */
function markPortalUrl_(){
  if (!location.search.includes("portal=1")) {
    history.replaceState({page:"portal"}, "", location.pathname + "?portal=1");
  } else {
    history.replaceState({page:"portal"}, "", location.pathname + location.search);
  }
}
function clearPortalUrl_(){
  history.replaceState({page:"login"}, "", location.pathname);
}

function showPortal(){
  document.body.classList.remove("mode-login");
  document.body.classList.add("mode-portal");
  $loginBox.style.display = "none";
  $portal.style.display = "flex";
  showRefreshBtn();
  markPortalUrl_();
}
function showLogin(){
  document.body.classList.remove("mode-portal");
  document.body.classList.add("mode-login");
  $portal.style.display = "none";
  $loginBox.style.display = "block";
  hideRefreshBtn();
  clearPortalUrl_();
}

/* Refresh sûr */
function refreshPage(){
  window.location.href = window.location.pathname + "?r=" + Date.now();
}

/* JWT email */
function b64urlToUtf8(b64url){
  let s = String(b64url || "").replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  let out = "";
  for (let i=0;i<bin.length;i++){
    out += "%" + bin.charCodeAt(i).toString(16).padStart(2,"0");
  }
  return decodeURIComponent(out);
}
function parseJwtEmail(credential){
  const parts = String(credential || "").split(".");
  if (parts.length < 2) return "";
  const payloadJson = b64urlToUtf8(parts[1]);
  const payload = JSON.parse(payloadJson);
  return String(payload.email || "").trim().toLowerCase();
}

/* JSONP */
function jsonp(url, cbName, timeoutMs = 30000){
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.async = true;
    script.defer = true;
    script.crossOrigin = "anonymous";

    const cleanup = () => {
      script.remove();
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Timeout JSONP"));
    }, timeoutMs);

    window[cbName] = (data) => {
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "_t=" + Date.now();

    script.onerror = () => {
      clearTimeout(timer);
      cleanup();
      reject(new Error("Erreur JSONP (script bloqué)"));
    };

    document.head.appendChild(script);
  });
}

async function authCheck(email){
  const cb = "cb_auth_" + Math.random().toString(36).slice(2);
  const url = `${API}?view=auth_check&email=${encodeURIComponent(email)}&nocache=1&callback=${cb}`;
  try {
    return await jsonp(url, cb, 30000);
  } catch(e1){
    return await jsonp(url, cb, 30000);
  }
}

/* Overlay Vérification */
let $checking = null;

function ensureChecking(){
  if($checking) return;

  $checking = document.createElement("div");
  $checking.style.position = "fixed";
  $checking.style.inset = "0";
  $checking.style.display = "none";
  $checking.style.alignItems = "center";
  $checking.style.justifyContent = "center";
  $checking.style.background = "rgba(0,0,0,.55)";
  $checking.style.backdropFilter = "blur(8px)";
  $checking.style.webkitBackdropFilter = "blur(8px)";
  $checking.style.zIndex = "999999";
  $checking.innerHTML = `
    <div style="padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.60);color:#fff;font-weight:900;">
      Vérification de l’accès…
    </div>
  `;
  document.body.appendChild($checking);
}
function showChecking(){
  ensureChecking();
  $loginBox.style.display = "none";
  $portal.style.display = "none";
  hideRefreshBtn();
  $checking.style.display = "flex";
}
function hideChecking(){
  ensureChecking();
  $checking.style.display = "none";
}

/* Déconnexion */
function doLogout(){
  localStorage.removeItem(LS_KEY);
  localStorage.removeItem("cs_role_v1");
  localStorage.removeItem("cs_gardes_postees_v1");
  localStorage.removeItem("cs_online_badge_cache_v1");
  showLogin();
  showMsg("Déconnecté.");
}
$logoutPortal.addEventListener("click", doLogout);

/* logique centrale login */
async function checkAndShow_(email){
  showChecking();
  showMsg("");

  try{
    const res = await authCheck(email);

    if(res && res.ok === true){
      localStorage.setItem(LS_KEY, email);
      localStorage.setItem("cs_role_v1", String(res.role || "").trim().toLowerCase());
      localStorage.setItem("cs_gardes_postees_v1", String(Number(res.gardes_postees || 0)));

      hideChecking();
      showPortal();
      showMsg("");
      return true;
    }

    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_gardes_postees_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    hideChecking();
    showLogin();
    showMsg("Accès refusé.");
    return false;

  }catch(err){
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_gardes_postees_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    hideChecking();
    showLogin();
    showMsg("Erreur réseau / serveur.");
    return false;
  }
}

/* Google callback */
async function handleCredentialResponse(response){
  showMsg("Vérification de l’accès…");

  const email = parseJwtEmail(response.credential);
  if(!email){
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_gardes_postees_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    showLogin();
    showMsg("Erreur : email introuvable.");
    return;
  }

  await checkAndShow_(email);
}

/* Boot */
(async function(){
  const saved = (localStorage.getItem(LS_KEY) || "").trim().toLowerCase();

  if(saved){
    showPortal();
    showSync();

    try{
      const res = await authCheck(saved);

      if(res && res.ok === true){
        localStorage.setItem("cs_role_v1", String(res.role || "").trim().toLowerCase());
        localStorage.setItem("cs_gardes_postees_v1", String(Number(res.gardes_postees || 0)));
        hideSync();
        return;
      }

      hideSync();
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem("cs_role_v1");
      localStorage.removeItem("cs_gardes_postees_v1");
      localStorage.removeItem("cs_online_badge_cache_v1");
      showLogin();
      showMsg("Accès refusé.");
      return;

    }catch(e){
      showSync();
      setTimeout(() => hideSync(), 1800);
      return;
    }
  }

  showLogin();
})();

/* ADMIN */
const ADMIN_URL = "admin.html";
const DENIED_IMG = "acces_refuse.png";

function isAdminLocal(){
  return (localStorage.getItem("cs_role_v1") || "").trim().toLowerCase() === "admin";
}

let _denyActive = false;
let _denyPopHandler = null;

function showDenied(){
  if (document.getElementById("denyOverlay")) return;

  _denyActive = true;

  const overlay = document.createElement("div");
  overlay.id = "denyOverlay";
  overlay.style.cssText = `
    position:fixed; inset:0; z-index:999999;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:12px;
  `;

  const img = document.createElement("img");
  img.src = DENIED_IMG;
  img.alt = "Accès refusé";
  img.style.cssText = `
    width:100%;
    height:100%;
    object-fit:contain;
    max-width:100vw;
    max-height:100vh;
  `;

  overlay.appendChild(img);
  document.body.appendChild(overlay);

  try{
    history.pushState({denied:true}, "", location.href);
  }catch(e){}

  _denyPopHandler = function(){
    hideDenied();
  };
  window.addEventListener("popstate", _denyPopHandler);
}

function hideDenied(){
  const overlay = document.getElementById("denyOverlay");
  if(overlay) overlay.remove();

  _denyActive = false;

  if(_denyPopHandler){
    window.removeEventListener("popstate", _denyPopHandler);
    _denyPopHandler = null;
  }
}

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && _denyActive){
    hideDenied();
  }
});

document.getElementById("btnAdmin").addEventListener("click", (e)=>{
  e.preventDefault();
  if(isAdminLocal()){
    location.href = ADMIN_URL;
  }else{
    showDenied();
  }
});

/* PWA back */
window.addEventListener("popstate", function(){
  if(_denyActive){
    hideDenied();
    return;
  }

  if(document.body.classList.contains("mode-portal")){
    history.replaceState({page:"portal"}, "", location.pathname + "?portal=1");
  }
});

/* ONLINE USERS */
const ONLINE_CACHE_KEY = "cs_online_badge_cache_v1";
const ONLINE_REFRESH_MS = 60000;

const $onlineBadge = document.getElementById("onlineBadge");
const $onlineBadgeText = document.getElementById("onlineBadgeText");
const $onlinePanel = document.getElementById("onlinePanel");
const $onlinePanelCount = document.getElementById("onlinePanelCount");
const $onlinePanelBody = document.getElementById("onlinePanelBody");

let _onlineTimer = null;
let _onlineOpen = false;

function fmtLast_(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "—";

    const now = new Date();
    const diff = Math.round((now - d) / 60000);

    if(diff < 1) return "à l’instant";
    if(diff < 60) return `il y a ${diff} min`;

    return d.toLocaleString("fr-FR", {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch(e){
    return "—";
  }
}

function agentLabel_(it){
  const n = String(it.nom || "").trim();
  if(n) return n;

  const em = String(it.email || "").trim();
  if(!em) return "Agent";

  return em.split("@")[0]
    .split(/[._-]/)
    .filter(Boolean)
    .map(x => x.charAt(0).toUpperCase() + x.slice(1))
    .join(" ");
}

function renderOnline_(items){
  items = Array.isArray(items) ? items : [];

  const online = items.filter(x => Number(x.en_ligne || 0) === 1);
  const count = online.length;

  if($onlineBadge){
    $onlineBadge.hidden = false;
  }

  if($onlineBadgeText){
    $onlineBadgeText.textContent = count + (count > 1 ? " agents en ligne" : " agent en ligne");
  }

  if($onlinePanelCount){
    $onlinePanelCount.textContent = String(count);
  }

  if(!$onlinePanelBody) return;

  if(!items.length){
    $onlinePanelBody.innerHTML = `<tr><td class="onlineEmpty">Aucune connexion</td></tr>`;
    return;
  }

  $onlinePanelBody.innerHTML = items.map(it=>{
    const on = Number(it.en_ligne || 0) === 1;
    return `
      <tr>
        <td>
          <div class="onlineName">${escapeHtml_(agentLabel_(it))}</div>
          <div class="onlineLast">Dernière connexion : ${escapeHtml_(fmtLast_(it.derniere_connexion || it.maj_session || ""))}</div>
        </td>
        <td class="onlineStatus ${on ? "" : "off"}">${on ? "en ligne" : "hors ligne"}</td>
      </tr>
    `;
  }).join("");
}

function escapeHtml_(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function loadOnlineCache_(){
  try{
    const raw = localStorage.getItem(ONLINE_CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !Array.isArray(obj.items)) return null;
    return obj.items;
  }catch(e){
    return null;
  }
}

function saveOnlineCache_(items){
  try{
    localStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify({
      ts: Date.now(),
      items
    }));
  }catch(e){}
}

function jsonpOnline_(){
  return new Promise((resolve, reject)=>{
    const cb = "cb_online_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");

    window[cb] = function(data){
      try{ delete window[cb]; }catch(e){}
      s.remove();
      resolve(data);
    };

    s.onerror = function(){
      try{ delete window[cb]; }catch(e){}
      s.remove();
      reject(new Error("online jsonp error"));
    };

    s.src = API + "?view=agents_status&callback=" + encodeURIComponent(cb) + "&nocache=1";
    document.head.appendChild(s);
  });
}

async function refreshOnline_(){
  try{
    const data = await jsonpOnline_();
    if(data && data.ok){
      const items = Array.isArray(data.items) ? data.items : [];
      saveOnlineCache_(items);
      renderOnline_(items);
    }
  }catch(e){
    const cached = loadOnlineCache_();
    if(cached) renderOnline_(cached);
  }
}

function startOnline_(){
  const cached = loadOnlineCache_();
  if(cached) renderOnline_(cached);

  refreshOnline_();

  if(_onlineTimer) clearInterval(_onlineTimer);
  _onlineTimer = setInterval(refreshOnline_, ONLINE_REFRESH_MS);
}

if($onlineBadge){
  $onlineBadge.addEventListener("click", ()=>{
    _onlineOpen = !_onlineOpen;
    if($onlinePanel) $onlinePanel.hidden = !_onlineOpen;
    if(_onlineOpen) refreshOnline_();
  });
}

document.addEventListener("click", (e)=>{
  if(!_onlineOpen) return;
  if(!$onlinePanel || !$onlineBadge) return;

  if($onlinePanel.contains(e.target) || $onlineBadge.contains(e.target)) return;

  _onlineOpen = false;
  $onlinePanel.hidden = true;
});

startOnline_();
</script>
