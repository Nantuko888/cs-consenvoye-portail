/* RAMPE LUMINEUSE */
.refreshBtn{
  position:fixed;
  top:14px;
  left:14px;
  z-index:9999;

  width:62px;
  height:44px;
  padding:0;

  border:none;
  background:transparent;
  box-shadow:none;
  cursor:pointer;

  display:none;
  align-items:center;
  justify-content:center;

  -webkit-tap-highlight-color:transparent;
}

.lightbarIcon{
  width:58px;
  height:34px;
  display:block;
  overflow:visible;
  filter: drop-shadow(0 0 3px rgba(120,190,255,.14));
}

.barShell{
  fill: rgba(20,28,38,.78);
  stroke: rgba(255,255,255,.16);
  stroke-width: 1.3;
}

.barFoot{
  fill: rgba(255,255,255,.55);
}

.mod{
  opacity:.28;
  transition:opacity .15s linear, filter .15s linear;
}
.modBlue{
  fill:#3d8cff;
}
.modWhite{
  fill:#eef7ff;
}

.refreshBtn:not(.loading) .lightbarIcon{
  opacity:.92;
  transform:scale(1);
}

.refreshBtn:not(.loading) .modLeftBlue,
.refreshBtn:not(.loading) .modRightBlue{
  opacity:.72;
  filter: drop-shadow(0 0 4px rgba(61,140,255,.28));
}
.refreshBtn:not(.loading) .modMidWhite{
  opacity:.56;
  filter: drop-shadow(0 0 4px rgba(255,255,255,.18));
}

.refreshBtn.loading .lightbarIcon{
  animation: barBodyPulse .9s linear infinite;
}

.refreshBtn.loading .modLeftBlue{
  animation: flashLeft .9s linear infinite;
}
.refreshBtn.loading .modMidWhite{
  animation: flashCenter .9s linear infinite;
}
.refreshBtn.loading .modRightBlue{
  animation: flashRight .9s linear infinite;
}

@keyframes barBodyPulse{
  0%,100%{
    transform:scale(1);
    filter: drop-shadow(0 0 4px rgba(110,180,255,.16));
  }
  50%{
    transform:scale(1.03);
    filter:
      drop-shadow(0 0 6px rgba(110,180,255,.24))
      drop-shadow(0 0 12px rgba(255,255,255,.10));
  }
}

@keyframes flashLeft{
  0%,100%{
    opacity:.22;
    filter:none;
  }
  10%,28%{
    opacity:1;
    filter:
      drop-shadow(0 0 6px rgba(61,140,255,.75))
      drop-shadow(0 0 14px rgba(61,140,255,.45));
  }
  40%,100%{
    opacity:.22;
    filter:none;
  }
}

@keyframes flashCenter{
  0%,18%{
    opacity:.18;
    filter:none;
  }
  30%,48%{
    opacity:1;
    filter:
      drop-shadow(0 0 8px rgba(255,255,255,.78))
      drop-shadow(0 0 16px rgba(255,255,255,.35));
  }
  60%,100%{
    opacity:.18;
    filter:none;
  }
}

@keyframes flashRight{
  0%,40%{
    opacity:.22;
    filter:none;
  }
  52%,70%{
    opacity:1;
    filter:
      drop-shadow(0 0 6px rgba(61,140,255,.75))
      drop-shadow(0 0 14px rgba(61,140,255,.45));
  }
  82%,100%{
    opacity:.22;
    filter:none;
  }
}

<script>
/* CONFIG */
const GOOGLE_CLIENT_ID = "690765229829-6m73boc7cn4lhkvjel8aa2vo96e83f0t.apps.googleusercontent.com";
const API = "https://script.google.com/macros/s/AKfycbzPHCDdW7wkFCVkMOL_2srZmdnjZ1QKmToUFtqIZBPjSUNtOwM-Ac7ua0w9dhCv3oI/exec";
const LS_KEY = "cs_portail_email_v1";
const RTN_TOKEN_KEY = "cs_rtn_google_credential_v1";

/* DOM */
const $loginBox = document.getElementById("loginBox");
const $portal = document.getElementById("portal");
const $msg = document.getElementById("loginMsg");
const $logoutPortal = document.getElementById("logoutBtnPortal");
const $refreshBtn = document.getElementById("refreshBtn");

/* UI */
function showMsg(t){
  $msg.textContent = t || "";
}
function showSync(){
  if($refreshBtn){
    $refreshBtn.classList.add("loading");
    $refreshBtn.style.display = "flex";
  }
}
function hideSync(){
  if($refreshBtn){
    $refreshBtn.classList.remove("loading");
  }
}
function showRefreshBtn(){

}

}

/* État URL portail */
function markPortalUrl_(){
  if (!location.search.includes("portal=1")) {
    history.replaceState({page:"portal"}, "", location.pathname + "?portal=1");
  } else {
    history.replaceState({page:"portal"}, "", location.pathname + location.search);
  }
}
function clearPortalUrl_(){
  history.replaceState({page:"login"}, "", location.pathname);
}

function showPortal(){
  document.body.classList.remove("mode-login");
  document.body.classList.add("mode-portal");
  $loginBox.style.display = "none";
  $portal.style.display = "flex";

function showLogin(){

  document.body.classList.add("mode-login");
  $portal.style.display = "none";
  $loginBox.style.display = "block";
  hideRefreshBtn();
  clearPortalUrl_();
}

/* Refresh sûr */
function refreshPage(){
  window.location.href = window.location.pathname + "?r=" + Date.now();
}

/* JWT email */
function b64urlToUtf8(b64url){
  let s = String(b64url || "").replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  let out = "";
  for (let i=0;i<bin.length;i++){
    out += "%" + bin.charCodeAt(i).toString(16).padStart(2,"0");
  }
  return decodeURIComponent(out);
}
function parseJwtEmail(credential){
  const parts = String(credential || "").split(".");
  if (parts.length < 2) return "";
  const payloadJson = b64urlToUtf8(parts[1]);
  const payload = JSON.parse(payloadJson);
  return String(payload.email || "").trim().toLowerCase();
}

/* JSONP */
function jsonp(url, cbName, timeoutMs = 30000){
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.async = true;
    script.defer = true;
    script.crossOrigin = "anonymous";

    const cleanup = () => {
      script.remove();
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Timeout JSONP"));
    }, timeoutMs);

    window[cbName] = (data) => {
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "_t=" + Date.now();

    script.onerror = () => {
      clearTimeout(timer);
      cleanup();
      reject(new Error("Erreur JSONP (script bloqué)"));
    };

    document.head.appendChild(script);
  });
}

async function authCheck(email){
  const cb = "cb_auth_" + Math.random().toString(36).slice(2);
  const url = `${API}?view=auth_check&email=${encodeURIComponent(email)}&nocache=1&callback=${cb}`;
  try {
    return await jsonp(url, cb, 30000);
  } catch(e1){
    return await jsonp(url, cb, 30000);
  }
}

/* Overlay Vérification */
let $checking = null;

function ensureChecking(){
  if($checking) return;

  $checking = document.createElement("div");
  $checking.style.position = "fixed";
  $checking.style.inset = "0";
  $checking.style.display = "none";
  $checking.style.alignItems = "center";
  $checking.style.justifyContent = "center";
  $checking.style.background = "rgba(0,0,0,.55)";
  $checking.style.backdropFilter = "blur(8px)";
  $checking.style.webkitBackdropFilter = "blur(8px)";
  $checking.style.zIndex = "999999";
  $checking.innerHTML = `
    <div style="padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.60);color:#fff;font-weight:900;">
      Vérification de l’accès…
    </div>
  `;
  document.body.appendChild($checking);
}
function showChecking(){
  ensureChecking();
  $loginBox.style.display = "none";
  $portal.style.display = "none";
  hideRefreshBtn();
  $checking.style.display = "flex";
}
function hideChecking(){
  ensureChecking();
  $checking.style.display = "none";
}

/* Déconnexion */
function doLogout(){
  localStorage.removeItem(LS_KEY);
  sessionStorage.removeItem(RTN_TOKEN_KEY);
  localStorage.removeItem("cs_role_v1");
  sessionStorage.removeItem("cs_formation_v1");
  localStorage.removeItem("cs_online_badge_cache_v1");
  showLogin();
  showMsg("Déconnecté.");
}
$logoutPortal.addEventListener("click", doLogout);

/* logique centrale login */
async function checkAndShow_(email){
  showChecking();
  showMsg("");

  try{
    const res = await authCheck(email);

    if(res && res.ok === true){
      localStorage.setItem(LS_KEY, email);
      localStorage.setItem("cs_role_v1", String(res.role || "").trim().toLowerCase());
      sessionStorage.setItem("cs_formation_v1", res.formation === true ? "1" : "0");

      hideChecking();
      showPortal();
      showMsg("");
      return true;
    }

    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    hideChecking();
    showLogin();
    showMsg("Accès refusé.");
    sessionStorage.removeItem(RTN_TOKEN_KEY);
    return false;

  }catch(err){
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    hideChecking();
    showLogin();
    showMsg("Erreur réseau / serveur.");
    return false;
  }
}

/* Google callback */
async function handleCredentialResponse(response){
  showMsg("Vérification de l’accès…");

  const email = parseJwtEmail(response.credential);
  if (response.credential) sessionStorage.setItem(RTN_TOKEN_KEY, response.credential);
  if(!email){
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem("cs_role_v1");
    localStorage.removeItem("cs_online_badge_cache_v1");
    showLogin();
    showMsg("Erreur : email introuvable.");
    return;
  }

  const portalAllowed = await checkAndShow_(email);
  if (portalAllowed && typeof window.__rtnResumeAfterGoogle === 'function') {
    window.__rtnResumeAfterGoogle();
  }
}

/* Boot */
(async function(){
  const saved = (localStorage.getItem(LS_KEY) || "").trim().toLowerCase();

  if(saved){
    showPortal();
    showSync();

    try{
      const res = await authCheck(saved);

      if(res && res.ok === true){
        localStorage.setItem("cs_role_v1", String(res.role || "").trim().toLowerCase());
        sessionStorage.setItem("cs_formation_v1", res.formation === true ? "1" : "0");
        hideSync();
        return;
      }

      hideSync();
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem("cs_role_v1");
      localStorage.removeItem("cs_online_badge_cache_v1");
      showLogin();
      showMsg("Accès refusé.");
      return;

    }catch(e){
      showSync();
      setTimeout(() => hideSync(), 1800);
      return;
    }
  }

  showLogin();
})();

/* ADMIN */
const ADMIN_URL = "admin.html";
const DENIED_IMG = "acces_refuse.png";

let _denyActive = false;
let _denyPopHandler = null;

function showDenied(){
  if (document.getElementById("denyOverlay")) return;

  _denyActive = true;

  const overlay = document.createElement("div");
  overlay.id = "denyOverlay";
  overlay.style.cssText = `
    position:fixed; inset:0; z-index:999999;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:12px;
  `;

  const img = document.createElement("img");
  img.src = DENIED_IMG;
  img.alt = "Accès refusé";
  img.style.cssText = `
    max-width:100%;
    max-height: calc(100dvh - 110px);
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  `;

  const btn = document.createElement("button");
  btn.id = "denyBackBtn";
  btn.textContent = "← Retour";
  btn.style.cssText = `
    position:fixed;
    left:12px;
    right:12px;
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    padding:14px 16px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.65);
    color:#fff;
    font-weight:950;
    font-size:16px;
    z-index:1000000;
    -webkit-tap-highlight-color: transparent;
  `;

  history.pushState({ deny: 1 }, "", location.href);

  const closeDenied = () => {
    if(!_denyActive) return;
    _denyActive = false;

    if(_denyPopHandler){
      window.removeEventListener("popstate", _denyPopHandler);
      _denyPopHandler = null;
    }

    const ov = document.getElementById("denyOverlay");
    const b = document.getElementById("denyBackBtn");
    if (ov) ov.remove();
    if (b) b.remove();

    history.back();
  };

  _denyPopHandler = () => {
    if(!_denyActive) return;
    closeDenied();
  };

  window.addEventListener("popstate", _denyPopHandler);
  btn.addEventListener("click", closeDenied);

  overlay.appendChild(img);
  document.body.appendChild(overlay);
  document.body.appendChild(btn);
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("#btnAdmin");
  if(!btn) return;
  e.preventDefault();

  if(isAdminLocal()){
    location.href = ADMIN_URL;
  }else{
    showDenied();
  }
});

<script>
(function(){
  const badge = document.getElementById("onlineBadge");
  const text = document.getElementById("onlineBadgeText");
  const panel = document.getElementById("onlinePanel");
  const panelBody = document.getElementById("onlinePanelBody");
  const panelCount = document.getElementById("onlinePanelCount");

  if (!badge || !text || !panel || !panelBody || !panelCount) return;

  const ONLINE_CACHE_KEY = "cs_online_badge_cache_v1";
  const ONLINE_CACHE_TTL = 10000; // 10 secondes

  function escapeHtml(v){
    return String(v || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatLastSeen(v){
    if(!v) return "—";
    const d = new Date(v);
    if(isNaN(d.getTime())) return "—";

    const now = new Date();
    const diffMin = Math.floor((now - d) / 60000);

    if(diffMin < 1) return "à l'instant";
    if(diffMin < 60) return diffMin + " min";

    const sameDay =
      d.getDate() === now.getDate() &&
      d.getMonth() === now.getMonth() &&
      d.getFullYear() === now.getFullYear();

    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");

    if (sameDay) return `${hh}:${mm}`;

    const dd = String(d.getDate()).padStart(2, "0");
    const mo = String(d.getMonth() + 1).padStart(2, "0");
    return `${dd}/${mo} ${hh}:${mm}`;
  }

  function renderPanel(items){
    panelCount.textContent = String(items.length);

    if(!items.length){
      panelBody.innerHTML = `
        <tr>
          <td class="onlineEmpty">Aucune connexion</td>
        </tr>
      `;
      return;
    }

    panelBody.innerHTML = items.map(a => {
      const isOnline = Number(a.en_ligne) === 1;
      return `
        <tr>
          <td>
            <div class="onlineRow">
              <div class="onlineLeft">
                <span class="onlineStatusDot ${isOnline ? "" : "offline"}"></span>
                <span class="onlineName">${escapeHtml(a.nom || a.email || "—")}</span>
              </div>
              <div class="onlineRight">
                ${isOnline ? "en ligne" : escapeHtml(formatLastSeen(a.derniere_connexion || a.maj_session))}
              </div>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function closePanel(){
    panel.hidden = true;
    badge.classList.remove("isOpen");
  }

  function togglePanel(){
    if (badge.hidden) return;
    panel.hidden = !panel.hidden;
    badge.classList.toggle("isOpen", !panel.hidden);
  }

  function saveCache(data){
    try{
      localStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify({
        ts: Date.now(),
        data: data
      }));
    }catch(e){}
  }

  function readCache(){
    try{
      const raw = localStorage.getItem(ONLINE_CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || !parsed.ts || !parsed.data) return null;
      return parsed;
    }catch(e){
      return null;
    }
  }

  function applyData(res){
    if(!res || !res.ok || !Array.isArray(res.items)){
      badge.hidden = true;
      closePanel();
      renderPanel([]);
      return;
    }

    const allWithHistory = res.items
      .filter(x => String(x.derniere_connexion || x.maj_session || "").trim() !== "")
      .sort((a,b) => {
        const aOnline = Number(a.en_ligne) === 1 ? 1 : 0;
        const bOnline = Number(b.en_ligne) === 1 ? 1 : 0;
        if (bOnline !== aOnline) return bOnline - aOnline;

        const ad = String(a.derniere_connexion || a.maj_session || "");
        const bd = String(b.derniere_connexion || b.maj_session || "");
        return bd.localeCompare(ad);
      });

    const onlineCount = res.items.filter(x => Number(x.en_ligne) === 1).length;

    if(onlineCount <= 0 && allWithHistory.length <= 0){
      badge.hidden = true;
      closePanel();
      renderPanel([]);
      return;
    }

    text.textContent = onlineCount > 0
      ? onlineCount + (onlineCount > 1 ? " agents en ligne" : " agent en ligne")
      : "Historique connexions";

    badge.hidden = false;
    renderPanel(allWithHistory);
  }

  function fetchOnlineBadge(){
    const cb = "cb_agents_" + Date.now() + "_" + Math.floor(Math.random()*10000);

    window[cb] = function(res){
      try{
        delete window[cb];
        saveCache(res);
        applyData(res);
      }catch(err){
        badge.hidden = true;
        closePanel();
        renderPanel([]);
      }
    };

    const s = document.createElement("script");
    s.src = API + "?view=agents_status&callback=" + encodeURIComponent(cb) + "&nocache=1";

    s.onerror = function(){
      try{ delete window[cb]; }catch(e){}
    };

    document.body.appendChild(s);
  }

  function loadOnlineBadge(force){
    const cached = readCache();
    const now = Date.now();

    if (!force && cached && (now - cached.ts) < ONLINE_CACHE_TTL){
      applyData(cached.data);
      return;
    }

    fetchOnlineBadge();
  }

  badge.addEventListener("click", function(e){
    e.stopPropagation();
    togglePanel();
  });

  panel.addEventListener("click", function(e){
    e.stopPropagation();
  });

  document.addEventListener("click", function(e){
    if (panel.hidden) return;
    if (!panel.contains(e.target) && !badge.contains(e.target)){
      closePanel();
    }
  });

  loadOnlineBadge(false);
  setInterval(function(){
    loadOnlineBadge(true);
  }, ONLINE_CACHE_TTL);
})();
</script>

<script>
(function () {
  'use strict';

  // À définir après déploiement du nouvel Apps Script RTN.
  const RTN_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby73AKPhdJ67nJncQuRm771Qc9ldEfdI7CJLRqbY0Op6BTpmEHur_ZEv_g448dk0pHG/exec';
  // RTN s'ouvre hors iframe Apps Script ; aucun jeton Google dans l'URL.
  let rtnTab=null, rtnNonce='', rtnOpened=false, rtnPending=false;
  const allowedGASOrigin=origin=>origin==='https://script.google.com' ||
    /^https:\/\/[^/]+\.googleusercontent\.com$/.test(origin);
  function closeRtn(){
    rtnOpened=false; rtnPending=false; rtnNonce='';
    if(rtnTab && !rtnTab.closed){try{rtnTab.close()}catch(e){}}
    rtnTab=null;
  }
  function requestGoogleForRtn(){
    if(document.getElementById('rtn-google-verify'))return;
    const layer=document.createElement('section');
    layer.id='rtn-google-verify';
    layer.setAttribute('aria-label','Vérifier le compte Google pour RTN');
    layer.innerHTML=`<div class="rtn-google-card">
      <h2>Accès au simulateur RTN</h2>
      <p>Confirme ton compte Google pour ouvrir RTN. Tu n’as pas besoin de te déconnecter du portail.</p>
      <div class="rtn-google-host" id="rtn-google-host"></div>
      <p id="rtn-google-error" role="alert" style="color:#ffccaf;display:none"></p>
      <button class="rtn-google-cancel" type="button">Annuler</button>
    </div>`;
    layer.querySelector('.rtn-google-cancel').onclick=()=>{window.__rtnResumeAfterGoogle=null;layer.remove();};
    document.body.appendChild(layer);
    window.__rtnResumeAfterGoogle=()=>{window.__rtnResumeAfterGoogle=null;layer.remove();openRtn();};
    try{
      if(!window.google||!google.accounts||!google.accounts.id)throw Error('Connexion Google indisponible. Recharge la page du portail.');
      google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredentialResponse,auto_select:false});
      google.accounts.id.renderButton(layer.querySelector('#rtn-google-host'),{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'rectangular'});
    }catch(err){
      const error=layer.querySelector('#rtn-google-error');
      error.textContent=err.message||'Impossible de charger la connexion Google';error.style.display='block';
    }
  }
  function hasValidRtnToken(token){
    try{if(!token)return false;const payload=JSON.parse(b64urlToUtf8(token.split('.')[1]));
      return Number(payload.exp||0)*1000>Date.now()+30000;}catch(e){return false;}
  }
  function openRtn(){
    if(rtnOpened && rtnTab && !rtnTab.closed){rtnTab.focus();return;}
    // Ce contrôle client améliore l'interface : il ne remplace PAS le contrôle
    // obligatoire de la colonne formation dans le serveur RTN.
    if(sessionStorage.getItem('cs_formation_v1') !== '1'){
      alert('Accès aux formations non autorisé. Contacte le responsable du portail.');
      return;
    }
    const token=sessionStorage.getItem(RTN_TOKEN_KEY);
    if(!hasValidRtnToken(token)){sessionStorage.removeItem(RTN_TOKEN_KEY);requestGoogleForRtn();return;}
    rtnNonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');
    // Le compte est choisi à la connexion Google du portail.
    // authuser est uniquement un indice de routage pour Google (pas une autorisation).
    // Le serveur RTN conserve sa validation complète du credential et des droits.
    const accountEmail=parseJwtEmail(token);
    const rtnUrl=new URL(RTN_WEBAPP_URL);
    rtnUrl.searchParams.set('launch_nonce',rtnNonce);
    if(accountEmail)rtnUrl.searchParams.set('authuser',accountEmail);
    const url=rtnUrl.href;
    // Lors d'un clic direct dans revisions.html, l'activation utilisateur est conservée.
    rtnTab=window.open(url,'_blank');
    if(!rtnTab){
      // Éviter un faux succès : l'utilisateur doit autoriser l'ouverture.
      const modal=document.createElement('div');modal.id='rtn-popup-blocked';
      modal.style.cssText='position:fixed;inset:0;z-index:30003;background:#000d;display:grid;place-items:center;padding:20px';
      modal.innerHTML='<div style="max-width:380px;background:#14263e;color:white;padding:24px;border-radius:16px;font:600 15px system-ui"><p>Ton navigateur a bloqué le nouvel onglet RTN.</p><button type="button" id="rtn-popup-retry" style="padding:12px;border:0;border-radius:9px;background:#e8323c;color:white;font-weight:bold;cursor:pointer">Ouvrir RTN</button> <button type="button" id="rtn-popup-cancel" style="padding:12px;cursor:pointer">Annuler</button></div>';
      document.body.appendChild(modal);
      modal.querySelector('#rtn-popup-retry').onclick=()=>{modal.remove();openRtn();};
      modal.querySelector('#rtn-popup-cancel').onclick=()=>{modal.remove();rtnNonce='';};
      return;
    }
    rtnOpened=true;rtnPending=true;
    try{rtnTab.focus()}catch(e){}
  }
  // Même origine GitHub : revisions.html peut appeler cette fonction depuis le clic.
  window.__openRtnFromRevisions=openRtn;
  window.addEventListener('message',e=>{
    if(!rtnOpened||!allowedGASOrigin(e.origin)||!e.data||!rtnNonce)return;
    // Dans Apps Script, la page est parfois dans une iframe interne au nouvel onglet.
    // Dans Apps Script la fenêtre fille contient une iframe googleusercontent.
    // Le navigateur interdit de lire sa hiérarchie entre origines ; le nonce
    // imprévisible et l'origine GAS sont vérifiés avant d'envoyer un jeton.
    if(!e.source)return;
    if(e.data.type==='rtn:ready'){
      e.source.postMessage({type:'rtn:init',nonce:rtnNonce},e.origin);return;
    }
    if(e.data.nonce!==rtnNonce)return;
    if(e.data.type==='rtn:hello'){
      const token=sessionStorage.getItem(RTN_TOKEN_KEY)||'';
      if(!hasValidRtnToken(token)){closeRtn();requestGoogleForRtn();return;}
      e.source.postMessage({type:'rtn:credential',nonce:rtnNonce,credential:token},e.origin);
      rtnPending=false;
    }else if(e.data.type==='rtn:exit'){closeRtn();}
  });
  document.getElementById('logoutBtnPortal')?.addEventListener('click',closeRtn);

  const SIMULATOR_VERSION = '28';
  const ICON = 'simulateur-vsav/icone_simulateur_vsav.png';
  const SIMULATOR = 'simulateur-vsav/simulateur.html?v='
    + SIMULATOR_VERSION;

  function init() {
    const portal = document.getElementById('portal');
    if (!portal || portal.querySelector('.vsav-pages')) return;

    const grid = portal.querySelector('section.grid[aria-label="Menu"]');
    if (!grid) return;

    // Ne pas bloquer toute la deuxième page si le nombre d'icônes évolue.
    const currentItems = grid.querySelectorAll(':scope > a.btn');
    if (currentItems.length !== 12) {
      console.info('Portail : ' + currentItems.length + ' modules sur la première page.');
    }

    const pages = document.createElement('div');
    pages.className = 'vsav-pages';
    pages.id = 'vsav-pages';
    pages.setAttribute('aria-label', 'Pages du menu');

    const first = document.createElement('div');
    first.className = 'vsav-page';
    first.setAttribute('aria-label', 'Page 1 sur 2, accueil');

    const second = document.createElement('div');
    second.className = 'vsav-page';
    second.setAttribute('aria-label', 'Page 2 sur 2, simulateur VSAV');

    grid.before(pages);
    first.appendChild(grid);
    pages.append(first, second);

    const grid2 = document.createElement('section');
    grid2.className = 'grid';
    grid2.setAttribute('aria-label', 'Autres modules');

    const link = document.createElement('a');
    link.className = 'btn';
    link.href = SIMULATOR;
    link.title = 'Simulateur VSAV — entraînement fictif';
    link.setAttribute('aria-label', 'Ouvrir le simulateur VSAV');

    const icon = document.createElement('img');
    icon.src = ICON;
    icon.alt = 'Simulateur VSAV';
    icon.draggable = false;

    link.appendChild(icon);
    grid2.appendChild(link);

    // Accès aux Révisions depuis la deuxième page (sélection des thèmes).
    const rtnLink = document.createElement('button');
    rtnLink.type = 'button';
    rtnLink.className = 'btn rtn-launch';
    rtnLink.title = 'Révisions';
    rtnLink.setAttribute('aria-label', 'Révisions');
    const rtnIcon=document.createElement('img');
    rtnIcon.src='icone-revisions.png';
    rtnIcon.alt='Révisions';
    rtnIcon.draggable=false;
    rtnLink.appendChild(rtnIcon);

    // Espace Révisions : page GitHub en plein écran, comme Syopé.
    let revisionsOpened = false;
    const revisionsScreen = document.createElement('section');
    revisionsScreen.id = 'revisions-screen';
    revisionsScreen.setAttribute('aria-label', 'Choix des révisions');
    revisionsScreen.setAttribute('aria-hidden', 'true');
    revisionsScreen.style.cssText = 'position:fixed;inset:0;z-index:20000;display:none;background:#0b1425;';
    const revisionsFrame = document.createElement('iframe');
    revisionsFrame.title = 'Révisions — choix des thèmes';
    revisionsFrame.style.cssText = 'width:100%;height:100%;border:0;display:block;';
    const revisionsBack = document.createElement('button');
    revisionsBack.type = 'button';
    revisionsBack.textContent = '← Portail';
    revisionsBack.setAttribute('aria-label', 'Retour au portail');
    revisionsBack.style.cssText = 'position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:2;border:1px solid #ffffff77;border-radius:10px;background:#14243de8;color:#fff;font:700 13px system-ui;padding:10px 14px;cursor:pointer;';
    revisionsScreen.append(revisionsFrame, revisionsBack);
    document.body.appendChild(revisionsScreen);

    function closeRevisions(useBack) {
      if (!revisionsOpened) return;
      revisionsOpened = false;
      revisionsScreen.style.display = 'none';
      revisionsScreen.setAttribute('aria-hidden', 'true');
      revisionsFrame.removeAttribute('src');
      if (useBack && history.state && history.state.revisionsOpen) history.back();
    }
    function openRevisions(e) {
      if (e) e.preventDefault();
      if (portal.style.display === 'none' || revisionsOpened) return;
      revisionsFrame.src = 'revisions.html';
      revisionsScreen.style.display = 'block';
      revisionsScreen.setAttribute('aria-hidden', 'false');
      revisionsOpened = true;
      history.pushState({ revisionsOpen: true }, '', '#revisions');
    }
    // Le module RTN de revisions.html demande l'ouverture au portail parent.
    // Un message est accepté uniquement depuis NOTRE iframe Révisions, sur la même origine.
    window.addEventListener('message', (event) => {
      if (!revisionsOpened || event.origin !== location.origin ||
          event.source !== revisionsFrame.contentWindow ||
          !event.data || event.data.type !== 'revisions:open-rtn') return;
      openRtn(); // vérification Google et droits RTN assurés par le système existant
    });
    rtnLink.addEventListener('click', openRevisions);
    revisionsBack.addEventListener('click', () => closeRevisions(true));
    window.addEventListener('popstate', () => {
      if (revisionsOpened && (!history.state || !history.state.revisionsOpen)) closeRevisions(false);
    });
    document.getElementById('logoutBtnPortal')?.addEventListener('click', () => closeRevisions(false));


    grid2.appendChild(rtnLink);

    second.appendChild(grid2);

    const dots = document.createElement('nav');
    dots.className = 'vsav-menu-dots';
    dots.setAttribute('aria-label', 'Navigation entre les pages');

    const buttons = [0, 1].map(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'Page ' + (n + 1));

      b.addEventListener('click', () => {
        pages.scrollTo({
          left: n * pages.clientWidth,
          behavior: 'smooth'
        });
      });

      dots.appendChild(b);
      return b;
    });

    portal.appendChild(dots);

    let scheduled = false;

    pages.addEventListener('scroll', () => {
      if (scheduled) return;
      scheduled = true;

      requestAnimationFrame(() => {
        const current = Math.max(0, Math.min(1,
          Math.round(pages.scrollLeft /
            Math.max(1, pages.clientWidth))
        ));

        buttons.forEach((b, n) => {
          if (n === current) {
            b.setAttribute('aria-current', 'page');
          } else {
            b.removeAttribute('aria-current');
          }
        });

        scheduled = false;
      });
    }, { passive: true });

    buttons[0].setAttribute('aria-current', 'page');

    window.addEventListener('resize', () => {
      const n =
        buttons[1].getAttribute('aria-current') === 'page'
          ? 1 : 0;
      pages.scrollLeft = n * pages.clientWidth;
    }, { passive: true });

    const screen = document.createElement('section');
    screen.id = 'vsav-sim-screen';
    screen.setAttribute('aria-label', 'Simulateur VSAV');
    screen.setAttribute('aria-hidden', 'true');

    const back = document.createElement('button');
    back.id = 'vsav-sim-close';
    back.type = 'button';
    back.textContent = '← Portail';

    const frame = document.createElement('iframe');
    frame.title = 'Simulateur VSAV — entraînement fictif';
    frame.setAttribute('allow', 'fullscreen');
    frame.setAttribute('loading', 'lazy');

    screen.append(frame, back);
    document.body.appendChild(screen);

    let opened = false;
    let pushInProgress = false;

    function close(withBack) {
      if (!opened) return;

      opened = false;
      screen.setAttribute('aria-hidden', 'true');
      frame.removeAttribute('src');

      if (withBack &&
          history.state &&
          history.state.vsavSimulation) {
        pushInProgress = true;
        history.back();
      }
    }

    function open(e) {
      if (e) e.preventDefault();

      if (portal.style.display === 'none') return;
      if (opened) return;

      frame.src = SIMULATOR;
      screen.setAttribute('aria-hidden', 'false');
      opened = true;

      history.pushState(
        { vsavSimulation: true },
        '',
        '#simulateur-vsav'
      );
    }

    link.addEventListener('click', open);
    back.addEventListener('click', () => close(true));

    window.addEventListener('popstate', () => {
      if (pushInProgress) {
        pushInProgress = false;
        return;
      }

      if (opened &&
          (!history.state || !history.state.vsavSimulation)) {
        close(false);
      }
    });

    document.getElementById('logoutBtnPortal')
      ?.addEventListener('click', () => close(false));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
