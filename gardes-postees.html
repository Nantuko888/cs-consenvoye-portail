<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gardes postées</title>

<style>
:root{
  --orange:#d46a00;
  --orange2:#b95800;
  --txt:#f4f4f4;
  --card:rgba(0,0,0,.35);
  --stroke:rgba(255,255,255,.10);
}

body{
  margin:0;
  font-family:system-ui;
  background:#0b0b0b;
  color:var(--txt);
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* HEADER */
.topbar{
  padding:12px;
  border-radius:18px;
  background:linear-gradient(180deg,var(--orange),var(--orange2));
  font-weight:900;
  text-align:center;
}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:14px;
  backdrop-filter:blur(10px);
}

/* BUTTON */
.btn{
  padding:10px;
  border-radius:12px;
  border:none;
  background:var(--orange);
  color:#fff;
  font-weight:900;
  width:100%;
}

/* TABS */
.tabs{
  display:flex;
  gap:8px;
}
.tab{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:14px;
  background:var(--card);
  cursor:pointer;
}
.tab.active{
  background:var(--orange);
}

/* ROLE ROW */
.role{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  margin-bottom:8px;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup.show{display:flex;}

.popupBox{
  background:#111;
  padding:14px;
  border-radius:16px;
  width:90%;
  max-width:300px;
}

.agent{
  padding:10px;
  border-bottom:1px solid #333;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

<div class="topbar">Gardes postées</div>

<!-- CONFIG -->
<div id="screen1" class="card">
  <div>Date</div>
  <input type="date" id="date" style="width:100%;margin-bottom:10px;">

  <div>Chef de garde</div>
  <div class="role" onclick="openSelect('chef')">
    <span id="chefLabel">Choisir</span>
  </div>

  <button class="btn" onclick="goConfig()">Configurer la garde</button>
</div>

<!-- AFFECTATION -->
<div id="screen2" style="display:none">

  <div class="tabs">
    <div class="tab active" onclick="setTab('vsav')">VSAV</div>
    <div class="tab" onclick="setTab('ccr')">CCR</div>
    <div class="tab" onclick="setTab('vtul')">VTUL</div>
  </div>

  <div class="card" id="content"></div>

</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popupBox" id="popupList"></div>
</div>

<script>

// ===== AGENTS DEMO =====
let agents = [
  "DUPONT Pierre",
  "LEROY Julien",
  "MARTIN Lucas"
];

let affect = {};
let currentRole = "";

// ===== NAV =====
function goConfig(){
  screen1.style.display="none";
  screen2.style.display="block";
  render();
}

// ===== TABS =====
let currentTab="vsav";

function setTab(tab){
  currentTab=tab;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");

  render();
}

// ===== RENDER =====
function render(){

  let roles = [];

  if(currentTab==="vsav"){
    roles=["Conducteur","Chef","Équipier","Apprenant"];
  }

  if(currentTab==="ccr"){
    roles=["Conducteur","Chef","BAT1","BAT2"];
  }

  if(currentTab==="vtul"){
    roles=["Conducteur","Chef"];
  }

  content.innerHTML = roles.map(r=>`
    <div class="role" onclick="openSelect('${currentTab}_${r}')">
      <span>${r}</span>
      <span>${affect[currentTab+"_"+r] || "—"}</span>
    </div>
  `).join("");
}

// ===== POPUP =====
function openSelect(role){
  currentRole = role;
  popup.classList.add("show");

  popupList.innerHTML = agents.map(a=>`
    <div class="agent" onclick="selectAgent('${a}')">${a}</div>
  `).join("");
}

function selectAgent(name){
  affect[currentRole]=name;

  if(currentRole==="chef"){
    chefLabel.innerText=name;
  }

  popup.classList.remove("show");
  render();
}

popup.onclick = e=>{
  if(e.target.id==="popup") popup.classList.remove("show");
}

</script>

</body>
</html>
