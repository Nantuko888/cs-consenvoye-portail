<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gardes postées — CS Consenvoye</title>

<style>
@page{
  size:A4 portrait;
  margin:10mm;
}

:root{
  --txt:#f4f4f4;
  --muted:rgba(255,255,255,.72);
  --shadow:0 14px 34px rgba(0,0,0,.40);
  --stroke:rgba(255,255,255,.10);
  --orange:#d46a00;
  --orange2:#b95800;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:#0b0b0b;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.68)),
    url("background.png") center/cover no-repeat;
  z-index:-1;
}

.wrap{
  height:100dvh;
  max-width:980px;
  margin:auto;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 18px);
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  gap:10px;
  overflow:hidden;
}

body.printMode .wrap{
  max-width:none;
  grid-template-rows:auto minmax(0,1fr);
}

body.printMode .mainTabs{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(212,106,0,.75), rgba(185,88,0,.58));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}

.title{
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-size:18px;
}

.btn,.miniBtn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.18);
  color:#fff;
  padding:9px 12px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

.mainTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mainTab{
  min-height:48px;
  border-radius:18px;
  background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
  cursor:pointer;
}

.mainTab.active{
  background:linear-gradient(180deg, rgba(212,106,0,.58), rgba(185,88,0,.38));
}

.page{
  display:none;
  min-height:0;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  flex-direction:column;
  gap:10px;
  padding-bottom:120px;
}

.page.show{display:flex}

.card{
  border-radius:22px;
  background:linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.26));
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  padding:12px;
}

.cardTitle{
  font-weight:950;
  text-transform:uppercase;
  margin-bottom:10px;
  font-size:17px;
}

.sub{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:8px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field,.select,.textarea,.colorField,.fileField{
  width:100%;
  border:none;
  outline:none;
  background:rgba(0,0,0,.24);
  color:#fff;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  padding:11px 12px;
  font:inherit;
  font-weight:850;
}

.fileField{font-size:13px}

.colorField{
  height:46px;
  padding:5px;
}

.textarea{
  min-height:90px;
  resize:vertical;
}

.shiftTabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.shiftTab{
  min-height:54px;
  border-radius:18px;
  background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  font-weight:950;
  cursor:pointer;
}

.shiftTab.active{
  background:linear-gradient(180deg, rgba(212,106,0,.62), rgba(185,88,0,.38));
}

.vehicleCard{
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
  margin-bottom:10px;
}

.vehicleHead{
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.vehicleLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.vehicleImg{
  width:78px;
  height:56px;
  object-fit:contain;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  padding:4px;
}

.vehicleName{
  font-weight:950;
  font-size:22px;
}

.vehicleMeta{
  font-size:12px;
  color:rgba(255,255,255,.75);
  font-weight:800;
}

.vehicleBody{
  display:none;
  padding:10px;
  background:rgba(0,0,0,.22);
  border-top:1px solid rgba(255,255,255,.10);
}

.vehicleCard.open .vehicleBody{display:block}

.roleGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.roleSlot{
  border-radius:16px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  padding:10px;
}

.roleName{
  font-weight:950;
  margin-bottom:7px;
}

.itemRow{
  display:grid;
  grid-template-columns:1fr 44px;
  gap:8px;
  align-items:center;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  padding:10px;
  margin-bottom:8px;
}

.itemMain{font-weight:950}
.itemSub{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}
.red{background:rgba(255,80,80,.20)}

.addAgentGrid{
  display:grid;
  grid-template-columns:80px 1fr 1fr 48px;
  gap:8px;
}

.addVehicleGrid{
  display:grid;
  grid-template-columns:1fr 80px 48px;
  gap:8px;
}

.postRow{
  display:grid;
  grid-template-columns:1fr 44px;
  gap:8px;
  margin-top:8px;
}

.vehicleImageConfig{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:8px;
  margin-top:8px;
  align-items:center;
}

.configVehImg{
  width:90px;
  height:60px;
  object-fit:contain;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  padding:4px;
}

.printToolbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.previewWrap{
  background:#fff;
  color:#000;
  border-radius:14px;
  padding:8px;
  overflow:auto;
}

body.printMode .previewWrap{
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.printSheet{
  width:min(190mm, 100%);
  aspect-ratio:190 / 277;
  min-height:auto;
  background:#fff;
  color:#000;
  font-family:Arial,sans-serif;
  margin:auto;
  padding:0;
}

.printTitle{
  text-align:center;
  font-weight:900;
  font-size:24px;
  margin:4px 0;
}

.printInfo{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:2px solid #000;
  margin-bottom:10px;
}

.printInfo div{
  padding:8px;
  font-weight:700;
  border-right:1px solid #000;
}

.printInfo div:last-child{border-right:none}

.printTable{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

.printTable th,.printTable td{
  border:1px solid #000;
  padding:4px;
  text-align:center;
  vertical-align:middle;
}

.printTable th{
  background:#000;
  color:#fff;
}

.printVeh{
  font-weight:900;
  font-size:16px;
}

.printVehImg{
  width:82px;
  height:54px;
  object-fit:contain;
  display:block;
  margin:0 auto 4px;
}

.printBox{
  border:2px solid #000;
  min-height:70px;
  padding:8px;
  margin-top:10px;
  white-space:pre-wrap;
  font-size:12px;
}

.printBtn{
  margin-top:10px;
  width:100%;
  background:linear-gradient(180deg, rgba(212,106,0,.75), rgba(185,88,0,.55));
}

@media(max-width:700px){
  .grid2,.shiftTabs,.roleGrid,.addAgentGrid,.addVehicleGrid,.vehicleImageConfig,.printToolbar{
    grid-template-columns:1fr;
  }
}

@media print{
  html,body{
    width:210mm;
    min-height:297mm;
    margin:0;
    background:#fff;
    overflow:visible;
  }

  .bg,.topbar,.mainTabs,.page:not(#page-print),.printToolbar,.printBtn{
    display:none!important;
  }

  .wrap{
    display:block;
    width:210mm;
    height:auto;
    padding:0;
    margin:0;
    max-width:none;
    overflow:visible;
  }

  #page-print{
    display:block!important;
    overflow:visible;
    padding:0;
  }

  .card{
    box-shadow:none;
    border:none;
    background:#fff;
    padding:0;
    border-radius:0;
  }

  .previewWrap{
    border-radius:0;
    padding:0;
    overflow:visible;
  }

  .printSheet{
    width:190mm;
    min-height:277mm;
    aspect-ratio:auto;
    padding:0;
    margin:0 auto;
  }
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="wrap">
  <div class="topbar">
    <div class="title">Gardes postées</div>
    <button class="btn" id="btnBack">Retour</button>
  </div>

  <div class="mainTabs">
    <div class="mainTab active" data-page="generate">Générer</div>
    <div class="mainTab" data-page="config">Configuration</div>
  </div>

  <div class="page show" id="page-generate">
    <section class="card">
      <div class="cardTitle">Feuille de garde</div>
      <div class="grid2">
        <div>
          <div class="sub">Date</div>
          <input type="date" class="field" id="dateGarde">
        </div>
        <div>
          <div class="sub">Chef de garde</div>
          <select class="select" id="chefGarde"></select>
        </div>
      </div>
    </section>

    <div class="shiftTabs">
      <button class="shiftTab active" data-shift="journee">Garde entière<br>07h–19h</button>
      <button class="shiftTab" data-shift="matin">Matin<br>07h–13h</button>
      <button class="shiftTab" data-shift="aprem">Après-midi<br>13h–19h</button>
    </div>

    <div id="vehicleDeck"></div>

    <section class="card">
      <div class="cardTitle">Remarques / missions</div>
      <textarea class="textarea" id="remarks" placeholder="Consignes, missions, remarques..."></textarea>
    </section>

    <section class="card">
      <button class="btn printBtn" id="goPrint">Visualiser / imprimer A4</button>
    </section>
  </div>

  <div class="page" id="page-config">
    <section class="card">
      <div class="cardTitle">Agents</div>
      <div class="sub">Grade, nom et prénom</div>
      <div class="addAgentGrid">
        <input class="field" id="agentGrade" placeholder="Grade">
        <input class="field" id="agentNom" placeholder="Nom">
        <input class="field" id="agentPrenom" placeholder="Prénom">
        <button class="miniBtn" id="addAgentBtn">＋</button>
      </div>
      <div id="agentList" style="margin-top:10px;"></div>
    </section>

    <section class="card">
      <div class="cardTitle">Véhicules</div>
      <div class="sub">Ajoute un véhicule, choisis sa couleur, son image, puis ajoute ses postes un par un</div>
      <div class="addVehicleGrid">
        <input class="field" id="vehicleName" placeholder="Nom véhicule">
        <input class="colorField" id="vehicleColor" type="color" value="#d93030">
        <button class="miniBtn" id="addVehicleBtn">＋</button>
      </div>

      <div style="margin-top:8px">
        <input class="field" id="vehicleImagePath" placeholder="Image véhicule : vsav.png ou images/vsav.png">
      </div>

      <div style="margin-top:8px">
        <input class="fileField" id="vehicleImageFile" type="file" accept="image/*">
      </div>

      <div id="vehicleConfig" style="margin-top:10px;"></div>
    </section>
  </div>

  <div class="page" id="page-print">
    <section class="card">
      <div class="printToolbar">
        <button class="btn" id="printBackBtn">Retour</button>
        <button class="btn" onclick="window.print()">Imprimer</button>
        <button class="btn" id="downloadBtn">Télécharger</button>
      </div>

      <div class="previewWrap">
        <div class="printSheet" id="printSheet"></div>
      </div>
    </section>
  </div>
</div>

<script>
const LS_AGENTS="cs_gp_agents_v4";
const LS_VEHICLES="cs_gp_vehicles_v4";
const LS_STATE="cs_gp_state_v4";

function loadJson(k,f){
  try{
    const r=localStorage.getItem(k);
    if(r)return JSON.parse(r);
  }catch(e){}
  localStorage.setItem(k,JSON.stringify(f));
  return f;
}

function save(){
  localStorage.setItem(LS_AGENTS,JSON.stringify(agents));
  localStorage.setItem(LS_VEHICLES,JSON.stringify(vehicles));
  localStorage.setItem(LS_STATE,JSON.stringify(state));
}

function esc(s){
  return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function agentName(a){
  return `${a.grade} ${a.nom} ${a.prenom}`.trim().replace(/\s+/g," ");
}

let agents=loadJson(LS_AGENTS,[
  {grade:"ADJ",nom:"DUPONT",prenom:"Pierre"},
  {grade:"CPL",nom:"LEROY",prenom:"Julien"},
  {grade:"SAP",nom:"MARTIN",prenom:"Lucas"}
]);

let vehicles=loadJson(LS_VEHICLES,[
  {name:"VSAV",color:"#d93030",image:"vsav.png",roles:["Conducteur","Chef d’agrès","Équipier","Apprenant"]},
  {name:"CCR",color:"#d46a00",image:"ccr.png",roles:["Conducteur","Chef d’agrès","Chef BAT1","Équipier BAT1","Chef BAT2","Équipier BAT2","Chef BAL","Équipier BAL"]},
  {name:"VTUL",color:"#2f79ff",image:"vtul.png",roles:["Conducteur","Chef d’agrès"]}
]);

let state=loadJson(LS_STATE,{
  page:"generate",
  shift:"journee",
  date:"",
  chef:"",
  remarks:"",
  openVehicle:"",
  affect:{journee:{},matin:{},aprem:{}}
});

function ensure(){
  ["journee","matin","aprem"].forEach(sh=>{
    if(!state.affect[sh])state.affect[sh]={};
    vehicles.forEach(v=>{
      if(!state.affect[sh][v.name])state.affect[sh][v.name]={};
      v.roles.forEach(r=>{
        if(state.affect[sh][v.name][r]===undefined)state.affect[sh][v.name][r]="";
      });
    });
  });
}

function options(selected){
  let h='<option value="">—</option>';
  agents.forEach(a=>{
    const n=agentName(a);
    h+=`<option value="${esc(n)}" ${selected===n?"selected":""}>${esc(n)}</option>`;
  });
  return h;
}

function setPage(p){
  state.page=p;
  save();

  document.body.classList.toggle("printMode",p==="print");

  document.querySelectorAll(".mainTab").forEach(t=>t.classList.toggle("active",t.dataset.page===p));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("show"));
  document.getElementById("page-"+p).classList.add("show");

  if(p==="print") renderPrint();
}

function renderTop(){
  document.getElementById("dateGarde").value=state.date||"";
  const chef=document.getElementById("chefGarde");
  chef.innerHTML=options(state.chef);
  chef.onchange=()=>{
    state.chef=chef.value;
    save();
  };
}

function shiftLabel(s){
  if(s==="journee")return"07h–19h";
  if(s==="matin")return"07h–13h";
  return"13h–19h";
}

function vehicleImageHtml(v,cls){
  if(!v.image)return "";
  return `<img class="${cls}" src="${esc(v.image)}" onerror="this.style.display='none'">`;
}

function renderVehicles(){
  ensure();
  const deck=document.getElementById("vehicleDeck");
  deck.innerHTML="";

  vehicles.forEach(v=>{
    const open=state.openVehicle===v.name;
    const card=document.createElement("section");
    card.className="vehicleCard"+(open?" open":"");
    card.style.background=`linear-gradient(180deg, ${v.color}66, rgba(0,0,0,.28))`;

    let body="";
    v.roles.forEach(role=>{
      const val=state.affect[state.shift][v.name][role]||"";
      body+=`
        <div class="roleSlot">
          <div class="roleName">${esc(role)}</div>
          <select class="select" data-v="${esc(v.name)}" data-r="${esc(role)}">${options(val)}</select>
        </div>`;
    });

    card.innerHTML=`
      <div class="vehicleHead" data-open="${esc(v.name)}">
        <div class="vehicleLeft">
          ${vehicleImageHtml(v,"vehicleImg")}
          <div>
            <div class="vehicleName">${esc(v.name)}</div>
            <div class="vehicleMeta">${v.roles.length} postes — ${shiftLabel(state.shift)}</div>
          </div>
        </div>
        <div style="font-weight:950;font-size:22px">${open?"−":"+"}</div>
      </div>
      <div class="vehicleBody"><div class="roleGrid">${body}</div></div>`;

    deck.appendChild(card);
  });

  deck.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{
    state.openVehicle = state.openVehicle===el.dataset.open ? "" : el.dataset.open;
    save();
    renderVehicles();
  });

  deck.querySelectorAll("select[data-v]").forEach(sel=>sel.onchange=()=>{
    state.affect[state.shift][sel.dataset.v][sel.dataset.r]=sel.value;
    save();
  });
}

function renderAgents(){
  const box=document.getElementById("agentList");
  box.innerHTML="";

  agents.forEach((a,i)=>{
    const d=document.createElement("div");
    d.className="itemRow";
    d.innerHTML=`
      <div>
        <div class="itemMain">${esc(agentName(a))}</div>
        <div class="itemSub">${esc(a.grade)} — ${esc(a.nom)} ${esc(a.prenom)}</div>
      </div>
      <button class="miniBtn red">−</button>`;
    d.querySelector("button").onclick=()=>{
      agents.splice(i,1);
      save();
      renderAll();
    };
    box.appendChild(d);
  });
}

function renderVehicleConfig(){
  const box=document.getElementById("vehicleConfig");
  box.innerHTML="";

  vehicles.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="card";
    d.style.marginBottom="10px";

    d.innerHTML=`
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div style="display:flex;gap:10px;align-items:center">
          ${v.image ? `<img class="configVehImg" src="${esc(v.image)}" onerror="this.style.display='none'">` : `<div class="configVehImg"></div>`}
          <div>
            <div class="itemMain" style="color:${esc(v.color)}">${esc(v.name)}</div>
            <div class="itemSub">${esc(v.roles.join(", "))}</div>
            <div class="itemSub">Image : ${esc(v.image || "aucune")}</div>
          </div>
        </div>
        <button class="miniBtn red" data-del="${i}">−</button>
      </div>

      <div class="postRow">
        <input class="field" placeholder="Ajouter un poste" data-post="${i}">
        <button class="miniBtn" data-addpost="${i}">＋</button>
      </div>

      <div class="vehicleImageConfig">
        <div class="sub">Image</div>
        <input class="field" placeholder="vsav.png ou images/vsav.png" value="${esc(v.image || "")}" data-imgpath="${i}">
      </div>

      <div style="margin-top:8px">
        <input class="fileField" type="file" accept="image/*" data-imgfile="${i}">
      </div>`;

    box.appendChild(d);
  });

  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    vehicles.splice(Number(b.dataset.del),1);
    state.openVehicle="";
    save();
    renderAll();
  });

  box.querySelectorAll("[data-addpost]").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.addpost);
    const input=box.querySelector(`[data-post="${i}"]`);
    const val=input.value.trim();
    if(!val)return;
    vehicles[i].roles.push(val);
    save();
    renderAll();
  });

  box.querySelectorAll("[data-imgpath]").forEach(input=>input.onchange=()=>{
    const i=Number(input.dataset.imgpath);
    vehicles[i].image=input.value.trim();
    save();
    renderAll();
  });

  box.querySelectorAll("[data-imgfile]").forEach(input=>input.onchange=()=>{
    const i=Number(input.dataset.imgfile);
    const file=input.files && input.files[0];
    if(!file)return;

    const reader=new FileReader();
    reader.onload=()=>{
      vehicles[i].image=reader.result;
      save();
      renderAll();
    };
    reader.readAsDataURL(file);
  });
}

function renderPrint(){
  ensure();

  const date=state.date?state.date.split("-").reverse().join("/"):"—";

  let h=`
    <div class="printTitle">CENTRE DE SECOURS DE CONSENVOYE</div>
    <div class="printTitle">FEUILLE DE GARDE</div>

    <div class="printInfo">
      <div>Date : ${esc(date)}</div>
      <div>Chef de garde : ${esc(state.chef||"—")}</div>
    </div>

    <table class="printTable">
      <thead>
        <tr>
          <th>Véhicule</th>
          <th>Poste</th>
          <th>Garde entière<br>07h-19h</th>
          <th>Matin<br>07h-13h</th>
          <th>Après-midi<br>13h-19h</th>
        </tr>
      </thead>
      <tbody>`;

  vehicles.forEach(v=>{
    v.roles.forEach((r,idx)=>{
      h+=`
        <tr>
          ${idx===0?`
            <td rowspan="${v.roles.length}">
              ${v.image ? `<img class="printVehImg" src="${esc(v.image)}" onerror="this.style.display='none'">` : ""}
              <div class="printVeh" style="color:${esc(v.color)}">${esc(v.name)}</div>
            </td>`:""}
          <td>${esc(r)}</td>
          <td>${esc(state.affect.journee[v.name]?.[r]||"—")}</td>
          <td>${esc(state.affect.matin[v.name]?.[r]||"—")}</td>
          <td>${esc(state.affect.aprem[v.name]?.[r]||"—")}</td>
        </tr>`;
    });
  });

  h+=`
      </tbody>
    </table>

    <div class="printBox"><b>REMARQUES / MISSIONS</b><br>${esc(state.remarks||"")}</div>`;

  document.getElementById("printSheet").innerHTML=h;
}

function downloadPrintHtml(){
  renderPrint();

  const content=document.getElementById("printSheet").innerHTML;
  const date=state.date || "sans-date";

  const html=`<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Feuille de garde ${esc(date)}</title>
<style>
@page{size:A4 portrait;margin:10mm}
body{margin:0;background:#fff;color:#000;font-family:Arial,sans-serif}
.printSheet{width:190mm;min-height:277mm;margin:0 auto;background:#fff;color:#000}
.printTitle{text-align:center;font-weight:900;font-size:24px;margin:4px 0}
.printInfo{display:grid;grid-template-columns:1fr 1fr;border:2px solid #000;margin-bottom:10px}
.printInfo div{padding:8px;font-weight:700;border-right:1px solid #000}
.printInfo div:last-child{border-right:none}
.printTable{width:100%;border-collapse:collapse;font-size:11px}
.printTable th,.printTable td{border:1px solid #000;padding:4px;text-align:center;vertical-align:middle}
.printTable th{background:#000;color:#fff}
.printVeh{font-weight:900;font-size:16px}
.printVehImg{width:82px;height:54px;object-fit:contain;display:block;margin:0 auto 4px}
.printBox{border:2px solid #000;min-height:70px;padding:8px;margin-top:10px;white-space:pre-wrap;font-size:12px}
@media print{body{width:210mm;min-height:297mm}.printSheet{width:190mm;min-height:277mm}}
</style>
</head>
<body>
<div class="printSheet">${content}</div>
</body>
</html>`;

  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`feuille-garde-${date}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderAll(){
  ensure();

  document.getElementById("dateGarde").value=state.date||"";
  document.getElementById("remarks").value=state.remarks||"";

  document.querySelectorAll(".shiftTab").forEach(b=>b.classList.toggle("active",b.dataset.shift===state.shift));

  renderTop();
  renderVehicles();
  renderAgents();
  renderVehicleConfig();

  save();
}

document.querySelectorAll(".mainTab").forEach(t=>t.onclick=()=>setPage(t.dataset.page));

document.querySelectorAll(".shiftTab").forEach(b=>b.onclick=()=>{
  state.shift=b.dataset.shift;
  state.openVehicle="";
  save();
  renderAll();
});

document.getElementById("dateGarde").onchange=e=>{
  state.date=e.target.value;
  save();
};

document.getElementById("remarks").oninput=e=>{
  state.remarks=e.target.value;
  save();
};

document.getElementById("goPrint").onclick=()=>setPage("print");

document.getElementById("printBackBtn").onclick=()=>setPage("generate");

document.getElementById("downloadBtn").onclick=downloadPrintHtml;

document.getElementById("addAgentBtn").onclick=()=>{
  const grade=document.getElementById("agentGrade").value.trim();
  const nom=document.getElementById("agentNom").value.trim().toUpperCase();
  const prenom=document.getElementById("agentPrenom").value.trim();

  if(!grade||!nom||!prenom)return;

  agents.push({grade,nom,prenom});

  document.getElementById("agentGrade").value="";
  document.getElementById("agentNom").value="";
  document.getElementById("agentPrenom").value="";

  save();
  renderAll();
};

document.getElementById("addVehicleBtn").onclick=()=>{
  const name=document.getElementById("vehicleName").value.trim().toUpperCase();
  const color=document.getElementById("vehicleColor").value.trim()||"#d93030";
  const imagePath=document.getElementById("vehicleImagePath").value.trim();
  const imageFile=document.getElementById("vehicleImageFile").files[0];

  if(!name)return;

  function createVehicle(imageValue){
    vehicles.push({
      name,
      color,
      image:imageValue || imagePath || name.toLowerCase()+".png",
      roles:[]
    });

    document.getElementById("vehicleName").value="";
    document.getElementById("vehicleColor").value="#d93030";
    document.getElementById("vehicleImagePath").value="";
    document.getElementById("vehicleImageFile").value="";

    save();
    renderAll();
  }

  if(imageFile){
    const reader=new FileReader();
    reader.onload=()=>createVehicle(reader.result);
    reader.readAsDataURL(imageFile);
  }else{
    createVehicle("");
  }
};

document.getElementById("btnBack").onclick=()=>{
  if(state.page==="print"){
    setPage("generate");
    return;
  }

  if(state.page==="config"){
    setPage("generate");
    return;
  }

  location.href="index.html?portal=1";
};

setPage(state.page||"generate");
renderAll();
</script>
</body>
</html>
