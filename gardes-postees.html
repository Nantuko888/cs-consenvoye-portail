<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Gardes postées — CS Consenvoye</title>

<style>
:root{
  --txt:#f4f4f4;
  --muted:rgba(255,255,255,.72);
  --shadow:0 14px 34px rgba(0,0,0,.40);
  --stroke:rgba(255,255,255,.10);

  --orange:#d46a00;
  --orange2:#b95800;

  --vsav:#d93030;
  --ccr:#d46a00;
  --vtul:#2f79ff;
}

*{box-sizing:border-box}

html,body{
  height:100%;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:#0b0b0b;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.65)),
    url("background.png") center/cover no-repeat;
  z-index:-2;
}

.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 10%, rgba(255,170,60,.16), rgba(0,0,0,.64) 62%);
}

.wrap{
  height:100vh;
  max-width:980px;
  margin:auto;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    12px
    calc(env(safe-area-inset-bottom) + 12px);

  display:grid;
  grid-template-rows:auto auto 1fr;
  gap:10px;
}

/* TOPBAR */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:10px 12px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.75),
      rgba(185,88,0,.58)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:var(--shadow);

  backdrop-filter:blur(10px);
}

.title{
  font-weight:950;
  letter-spacing:.8px;
  text-transform:uppercase;
  font-size:18px;
}

.btn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.18);
  color:#fff;
  padding:9px 12px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

/* MAIN TABS */

.mainTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mainTab{
  min-height:48px;

  border-radius:18px;

  background:rgba(0,0,0,.35);

  border:1px solid rgba(255,255,255,.10);

  box-shadow:var(--shadow);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:950;

  cursor:pointer;
}

.mainTab.active{
  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.60),
      rgba(185,88,0,.40)
    );

  border-color:rgba(255,255,255,.22);
}

/* PAGE */

.page{
  min-height:0;
  overflow:auto;

  display:none;
  flex-direction:column;
  gap:10px;

  padding-right:2px;
}

.page.show{
  display:flex;
}

/* CARD */

.card{
  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.42),
      rgba(0,0,0,.26)
    );

  border:1px solid var(--stroke);

  box-shadow:var(--shadow);

  backdrop-filter:blur(10px);

  padding:12px;
}

.cardTitle{
  font-weight:950;
  font-size:17px;
  margin-bottom:10px;
  text-transform:uppercase;
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
  font-weight:800;
}

/* GRID */

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

/* FIELDS */

.field,
.select,
.textarea{
  width:100%;

  border:none;
  outline:none;

  background:rgba(0,0,0,.24);

  color:#fff;

  border:1px solid rgba(255,255,255,.10);

  border-radius:14px;

  padding:11px 12px;

  font:inherit;
  font-weight:800;
}

.textarea{
  min-height:90px;
  resize:vertical;
}

/* AGENTS */

.agentList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.agentRow{
  display:grid;
  grid-template-columns:110px 1fr 1fr 52px;
  gap:8px;

  align-items:center;

  padding:10px;

  border-radius:16px;

  background:rgba(255,255,255,.04);

  border:1px solid rgba(255,255,255,.08);
}

.miniBtn{
  border:none;

  background:rgba(255,255,255,.10);

  color:#fff;

  border-radius:12px;

  padding:10px;

  font-weight:950;

  cursor:pointer;
}

.miniBtn.red{
  background:rgba(255,80,80,.18);
}

/* VEHICLES */

.vehicleTabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.vehicleTab{
  min-height:48px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,.10);

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:950;

  cursor:pointer;
}

.vehicleTab[data-veh="VSAV"]{
  background:rgba(217,48,48,.25);
}

.vehicleTab[data-veh="CCR"]{
  background:rgba(212,106,0,.25);
}

.vehicleTab[data-veh="VTUL"]{
  background:rgba(47,121,255,.25);
}

.vehicleTab.active{
  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.15);
}

/* SHIFT */

.shiftTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.shiftTab{
  min-height:48px;

  border-radius:18px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:950;

  cursor:pointer;
}

.shiftTab.active{
  background:
    linear-gradient(
      180deg,
      rgba(212,106,0,.58),
      rgba(185,88,0,.35)
    );
}

/* ROLE */

.roleList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.roleCard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  align-items:center;

  padding:12px;

  border-radius:18px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);
}

.roleName{
  font-weight:950;
}

.previewTable{
  width:100%;
  border-collapse:collapse;
}

.previewTable th,
.previewTable td{
  border:1px solid rgba(255,255,255,.10);
  padding:8px;
}

.previewTable th{
  background:rgba(212,106,0,.35);
}

/* MOBILE */

@media(max-width:700px){

  .grid2,
  .grid3,
  .vehicleTabs{
    grid-template-columns:1fr;
  }

  .agentRow{
    grid-template-columns:1fr;
  }

  .roleCard{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrap">

  <!-- TOP -->
  <div class="topbar">
    <div class="title">Gardes postées</div>
    <button class="btn" id="btnBack">Retour</button>
  </div>

  <!-- MAIN TABS -->
  <div class="mainTabs">

    <div class="mainTab active" data-page="generate">
      Générer la feuille
    </div>

    <div class="mainTab" data-page="config">
      Configuration
    </div>

  </div>

  <!-- GENERATE -->
  <div class="page show" id="page-generate">

    <!-- DATE -->
    <div class="card">

      <div class="cardTitle">Informations</div>

      <div class="grid2">

        <div>
          <div class="sub">Date</div>
          <input type="date" class="field" id="dateGarde">
        </div>

        <div>
          <div class="sub">Chef de garde</div>
          <select class="select" id="chefGarde"></select>
        </div>

      </div>

    </div>

    <!-- SHIFTS -->
    <div class="shiftTabs">

      <div class="shiftTab active" data-shift="matin">
        Matin<br>07h-13h
      </div>

      <div class="shiftTab" data-shift="aprem">
        Après-midi<br>13h-19h
      </div>

    </div>

    <!-- VEHICLES -->
    <div class="vehicleTabs">

      <div class="vehicleTab active" data-veh="VSAV">
        VSAV
      </div>

      <div class="vehicleTab" data-veh="CCR">
        CCR
      </div>

      <div class="vehicleTab" data-veh="VTUL">
        VTUL
      </div>

    </div>

    <!-- ROLES -->
    <div class="card">

      <div class="cardTitle" id="rolesTitle">
        VSAV — Matin
      </div>

      <div class="roleList" id="roleList"></div>

    </div>

    <!-- REM -->
    <div class="card">

      <div class="cardTitle">Remarques / missions</div>

      <textarea class="textarea" id="remarks"></textarea>

    </div>

    <!-- PREVIEW -->
    <div class="card">

      <div class="cardTitle">Aperçu</div>

      <div id="preview"></div>

    </div>

  </div>

  <!-- CONFIG -->
  <div class="page" id="page-config">

    <!-- AGENTS -->
    <div class="card">

      <div class="cardTitle">Agents</div>

      <div class="sub">
        Grade + nom + prénom
      </div>

      <div class="agentList" id="agentList"></div>

      <div style="margin-top:10px;">
        <button class="miniBtn" id="addAgentBtn">
          Ajouter un agent
        </button>
      </div>

    </div>

    <!-- VEHICLES -->
    <div class="card">

      <div class="cardTitle">Véhicules</div>

      <div class="sub">
        Ajout / suppression véhicules
      </div>

      <div id="vehiculeConfig"></div>

    </div>

  </div>

</div>

<script>

const ROLES = {
  VSAV:[
    "Conducteur",
    "Chef d’agrès",
    "Équipier",
    "Apprenant"
  ],

  CCR:[
    "Conducteur",
    "Chef d’agrès",
    "Chef BAT1",
    "Équipier BAT1",
    "Chef BAT2",
    "Équipier BAT2",
    "Chef BAL",
    "Équipier BAL"
  ],

  VTUL:[
    "Conducteur",
    "Chef d’agrès"
  ]
};

let agents = [
  {
    grade:"ADJ",
    nom:"DUPONT",
    prenom:"Pierre"
  },
  {
    grade:"CPL",
    nom:"LEROY",
    prenom:"Julien"
  }
];

let vehicules = [
  "VSAV",
  "CCR",
  "VTUL"
];

let currentPage = "generate";
let currentVeh = "VSAV";
let currentShift = "matin";

let affect = {
  matin:{},
  aprem:{}
};

function fullName(a){
  return `${a.grade} ${a.nom} ${a.prenom}`;
}

function agentOptions(selected=""){
  return `
    <option value="">--</option>
    ${agents.map(a=>{
      const n = fullName(a);
      return `
        <option ${selected===n?"selected":""}>
          ${n}
        </option>
      `;
    }).join("")}
  `;
}

/* MAIN TABS */

document.querySelectorAll(".mainTab").forEach(tab=>{

  tab.onclick = ()=>{

    currentPage = tab.dataset.page;

    document.querySelectorAll(".mainTab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");

    document.querySelectorAll(".page")
      .forEach(p=>p.classList.remove("show"));

    document
      .getElementById("page-" + currentPage)
      .classList.add("show");

  };

});

/* SHIFT */

document.querySelectorAll(".shiftTab").forEach(tab=>{

  tab.onclick = ()=>{

    currentShift = tab.dataset.shift;

    document.querySelectorAll(".shiftTab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");

    renderRoles();

  };

});

/* VEH */

document.querySelectorAll(".vehicleTab").forEach(tab=>{

  tab.onclick = ()=>{

    currentVeh = tab.dataset.veh;

    document.querySelectorAll(".vehicleTab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");

    renderRoles();

  };

});

/* AGENTS */

function renderAgents(){

  const box = document.getElementById("agentList");

  box.innerHTML = "";

  agents.forEach((a,idx)=>{

    const row = document.createElement("div");

    row.className = "agentRow";

    row.innerHTML = `

      <input class="field"
        value="${a.grade}"
        onchange="agents[${idx}].grade=this.value">

      <input class="field"
        value="${a.nom}"
        onchange="agents[${idx}].nom=this.value">

      <input class="field"
        value="${a.prenom}"
        onchange="agents[${idx}].prenom=this.value">

      <button class="miniBtn red"
        onclick="deleteAgent(${idx})">
        −
      </button>

    `;

    box.appendChild(row);

  });

}

function deleteAgent(idx){

  agents.splice(idx,1);

  renderAgents();
  renderRoles();

}

document.getElementById("addAgentBtn").onclick = ()=>{

  agents.push({
    grade:"SAP",
    nom:"",
    prenom:""
  });

  renderAgents();

};

/* ROLES */

function renderRoles(){

  document.getElementById("rolesTitle").innerHTML =
    `${currentVeh} — ${currentShift}`;

  const box = document.getElementById("roleList");

  box.innerHTML = "";

  const roles = ROLES[currentVeh] || [];

  roles.forEach(role=>{

    if(!affect[currentShift][currentVeh]){
      affect[currentShift][currentVeh] = {};
    }

    const current =
      affect[currentShift][currentVeh][role] || "";

    const div = document.createElement("div");

    div.className = "roleCard";

    div.innerHTML = `

      <div class="roleName">
        ${role}
      </div>

      <select class="select"
        onchange="
          affect['${currentShift}']['${currentVeh}']['${role}']=this.value;
          renderPreview();
        ">
        ${agentOptions(current)}
      </select>

    `;

    box.appendChild(div);

  });

  renderPreview();

}

/* PREVIEW */

function renderPreview(){

  const box = document.getElementById("preview");

  let html = `

    <table class="previewTable">

      <thead>
        <tr>
          <th>Poste</th>
          <th>Agent</th>
        </tr>
      </thead>

      <tbody>

  `;

  const roles = ROLES[currentVeh] || [];

  roles.forEach(role=>{

    const val =
      affect[currentShift][currentVeh]?.[role] || "—";

    html += `

      <tr>
        <td>${role}</td>
        <td>${val}</td>
      </tr>

    `;

  });

  html += `
      </tbody>
    </table>
  `;

  box.innerHTML = html;

}

/* CHEF */

function renderChef(){

  const sel = document.getElementById("chefGarde");

  sel.innerHTML = agentOptions();

}

/* BACK */

document.getElementById("btnBack").onclick = ()=>{

  if(currentPage !== "generate"){

    currentPage = "generate";

    document.querySelectorAll(".mainTab")
      .forEach(t=>t.classList.remove("active"));

    document.querySelector(`[data-page="generate"]`)
      .classList.add("active");

    document.querySelectorAll(".page")
      .forEach(p=>p.classList.remove("show"));

    document.getElementById("page-generate")
      .classList.add("show");

    return;

  }

  location.href = "index.html?portal=1";

};

/* INIT */

renderAgents();
renderRoles();
renderChef();

</script>

</body>
</html>
