<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gardes postées</title>

<style>
body{
  font-family:system-ui;
  background:#0b0b0b;
  color:#fff;
  padding:15px;
}

.section{
  background:rgba(255,255,255,.05);
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}

.title{
  font-weight:900;
  margin-bottom:8px;
}

.row{
  display:grid;
  grid-template-columns:130px 1fr 1fr;
  gap:6px;
  margin-bottom:6px;
}

select, input, textarea{
  padding:8px;
  border-radius:10px;
  border:none;
  font-weight:700;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  font-weight:900;
  cursor:pointer;
}

.agentRow{
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}
</style>
</head>

<body>

<!-- INFO -->
<div class="section">
  <div class="title">Informations</div>
  Date : <input type="date" id="date">
  Chef de garde : <select id="chef"></select>
</div>

<!-- AGENTS -->
<div class="section">
  <div class="title">Gestion des agents</div>

  <input id="newAgent" placeholder="Nom Prénom">
  <button onclick="addAgent()">➕</button>

  <div id="agentsList" style="margin-top:10px;"></div>
</div>

<!-- VSAV -->
<div class="section">
  <div class="title">VSAV</div>

  <div class="row"><div>Conducteur</div><select id="vsav_cd_m"></select><select id="vsav_cd_a"></select></div>
  <div class="row"><div>Chef d’agrès</div><select id="vsav_ca_m"></select><select id="vsav_ca_a"></select></div>
  <div class="row"><div>Équipier</div><select id="vsav_eq_m"></select><select id="vsav_eq_a"></select></div>
  <div class="row"><div>Apprenant</div><select id="vsav_ap_m"></select><select id="vsav_ap_a"></select></div>

</div>

<!-- CCR -->
<div class="section">
  <div class="title">CCR</div>

  <div class="row"><div>Conducteur</div><select id="ccr_cd_m"></select><select id="ccr_cd_a"></select></div>
  <div class="row"><div>Chef d’agrès</div><select id="ccr_ca_m"></select><select id="ccr_ca_a"></select></div>

  <div class="row"><div>Chef BAT1</div><select id="ccr_b1c_m"></select><select id="ccr_b1c_a"></select></div>
  <div class="row"><div>Équipier BAT1</div><select id="ccr_b1e_m"></select><select id="ccr_b1e_a"></select></div>

  <div class="row"><div>Chef BAT2</div><select id="ccr_b2c_m"></select><select id="ccr_b2c_a"></select></div>
  <div class="row"><div>Équipier BAT2</div><select id="ccr_b2e_m"></select><select id="ccr_b2e_a"></select></div>

  <div class="row"><div>Chef BAL</div><select id="ccr_bal_c_m"></select><select id="ccr_bal_c_a"></select></div>
  <div class="row"><div>Équipier BAL</div><select id="ccr_bal_e_m"></select><select id="ccr_bal_e_a"></select></div>

</div>

<!-- VTUL -->
<div class="section">
  <div class="title">VTUL</div>

  <div class="row"><div>Conducteur</div><select id="vtul_cd_m"></select><select id="vtul_cd_a"></select></div>
  <div class="row"><div>Chef d’agrès</div><select id="vtul_ca_m"></select><select id="vtul_ca_a"></select></div>

</div>

<!-- REMARQUE -->
<div class="section">
  <div class="title">Remarques</div>
  <textarea id="rem" style="width:100%;height:80px;"></textarea>
</div>

<button onclick="generate()">GÉNÉRER (démo)</button>

<script>

// ===== STORAGE =====
const LS_AGENTS = "cs_agents_demo";

// ===== LOAD =====
function loadAgents(){
  let list = JSON.parse(localStorage.getItem(LS_AGENTS) || "[]");

  if(!list.length){
    list = ["DUPONT Pierre","LEROY Julien","MOREAU Thomas"];
    localStorage.setItem(LS_AGENTS, JSON.stringify(list));
  }

  return list;
}

function saveAgents(list){
  localStorage.setItem(LS_AGENTS, JSON.stringify(list));
}

// ===== UI =====
function refreshAll(){
  const list = loadAgents();

  document.querySelectorAll("select").forEach(sel=>{
    const val = sel.value;

    sel.innerHTML = `<option value="">--</option>` +
      list.map(a=>`<option>${a}</option>`).join("");

    if(list.includes(val)) sel.value = val;
  });

  renderAgentsList();
}

// ===== AGENTS LIST =====
function renderAgentsList(){
  const list = loadAgents();
  const box = document.getElementById("agentsList");

  box.innerHTML = "";

  list.forEach((name,i)=>{
    const row = document.createElement("div");
    row.className = "agentRow";

    row.innerHTML = `
      <div>${name}</div>
      <button onclick="removeAgent(${i})">➖</button>
    `;

    box.appendChild(row);
  });
}

// ===== ACTIONS =====
function addAgent(){
  const input = document.getElementById("newAgent");
  const name = input.value.trim();

  if(!name) return;

  let list = loadAgents();

  if(!list.includes(name)){
    list.push(name);
    saveAgents(list);
  }

  input.value="";
  refreshAll();
}

function removeAgent(i){
  let list = loadAgents();
  list.splice(i,1);
  saveAgents(list);
  refreshAll();
}

// ===== GENERATE =====
function generate(){
  const data = {
    date: date.value,
    chef: chef.value,
    rem: rem.value
  };

  console.log(data);
  alert("OK démo → prochaine étape impression");
}

// INIT
window.onload = refreshAll;

</script>

</body>
</html>
