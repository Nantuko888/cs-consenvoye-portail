<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Statistiques — CS Consenvoye</title>

<style>

:root{
  --txt:#f4f4f4;
  --muted:rgba(255,255,255,.68);
  --stroke:rgba(255,255,255,.13);

  --orange1:rgba(196,94,0,.58);
  --orange2:rgba(126,57,0,.48);

  --violet1:rgba(104,82,139,.52);
  --violet2:rgba(61,47,84,.46);

  --panel:rgba(8,8,8,.52);

  --green:#168039;
  --red:#a71f1f;

  --shadow:0 10px 26px rgba(0,0,0,.30);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;

  color:var(--txt);

  background:transparent;
}

body{
  padding:
    calc(env(safe-area-inset-top) + 10px)
    10px
    calc(env(safe-area-inset-bottom) + 18px);
}


/* =========================================================
   FOND
========================================================= */

.bg{
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.30)
    ),
    url("background.png")
      center top /
      cover
      no-repeat;
}


/* =========================================================
   CONTENEUR
========================================================= */

.wrap{
  width:100%;
  max-width:980px;
  margin:0 auto;
}


/* =========================================================
   BANDEAU HAUT
========================================================= */

.topbar{
  min-height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:8px 12px;

  margin-bottom:12px;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      var(--orange1),
      var(--orange2)
    );

  border:1px solid var(--stroke);

  box-shadow:var(--shadow);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.pageTitle{
  margin:0;

  font-size:19px;
  line-height:1;

  font-weight:950;

  letter-spacing:.5px;

  text-transform:uppercase;
}

.topActions{
  display:flex;
  align-items:center;
  gap:7px;
}

.btn{
  min-height:42px;

  border:1px solid rgba(255,255,255,.14);

  border-radius:14px;

  padding:8px 14px;

  color:#fff;

  background:
    rgba(20,20,20,.24);

  font-family:inherit;

  font-size:15px;
  font-weight:900;

  cursor:pointer;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.btn:active{
  transform:scale(.98);
}

.lockBtn{
  width:46px;
  min-width:46px;

  padding:0;

  font-size:20px;
}


/* =========================================================
   ADMIN
========================================================= */

.adminPanel{
  display:none;

  margin-bottom:12px;

  padding:14px;

  border-radius:20px;

  background:
    rgba(38,23,10,.52);

  border:
    1px solid
    rgba(255,147,38,.20);

  box-shadow:var(--shadow);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.adminPanel.show{
  display:block;
}

.adminTitle{
  margin-bottom:12px;

  font-size:17px;
  font-weight:950;
}

.adminButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btnGreen{
  background:
    rgba(22,128,57,.88)
    !important;
}

.btnRed{
  background:
    rgba(167,31,31,.88)
    !important;
}


/* =========================================================
   FORMULAIRE ANNUEL ADMIN
========================================================= */

.annualForm{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:12px;
}

.annualForm button{
  grid-column:1 / -1;
}

input,
select{
  width:100%;

  min-height:44px;

  padding:9px 12px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,255,255,.13);

  background:
    rgba(5,5,5,.58);

  color:#fff;

  font-family:inherit;

  font-size:16px;
  font-weight:850;

  outline:none;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

select option{
  color:#111;
  background:#fff;
}


/* =========================================================
   ACCORDÉONS
========================================================= */

.accordion{
  margin-bottom:12px;

  border-radius:20px;

  overflow:hidden;

  background:transparent;

  border:
    1px solid
    rgba(255,255,255,.11);

  box-shadow:var(--shadow);
}

.accordionHeader{
  width:100%;

  min-height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:9px 16px;

  border:0;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      var(--violet1),
      var(--violet2)
    );

  font-family:inherit;

  font-size:18px;
  font-weight:900;

  text-align:left;

  cursor:pointer;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.accordionHeader:active{
  filter:brightness(.94);
}

.accordionArrow{
  flex:0 0 auto;

  font-size:17px;

  transition:
    transform .22s ease;
}

.accordion.open
.accordionArrow{
  transform:rotate(180deg);
}

.accordionContent{
  display:none;

  padding:14px;

  background:
    rgba(5,5,5,.50);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.accordion.open
.accordionContent{
  display:block;
}


/* =========================================================
   CHARGEMENT INTERNE
========================================================= */

.sectionLoading{
  padding:16px 8px;

  text-align:center;

  color:
    rgba(255,255,255,.66);

  font-size:15px;
  font-weight:800;
}


/* =========================================================
   MENSUEL
========================================================= */

.intro{
  margin:
    0 0 14px;

  color:var(--muted);

  font-size:15px;
  font-weight:700;
}

.selectGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-bottom:14px;
}

.fieldLabel{
  display:block;

  margin-bottom:6px;

  color:
    rgba(255,255,255,.65);

  font-size:12px;
  font-weight:950;

  text-transform:uppercase;
}


/* =========================================================
   CAPTURES
========================================================= */

.captureCard{
  position:relative;

  overflow:hidden;

  margin-top:12px;

  border-radius:18px;

  background:
    rgba(0,0,0,.34);

  border:
    1px solid
    rgba(255,255,255,.10);
}

.captureTitle{
  padding:
    10px 13px;

  font-size:17px;
  font-weight:950;
}

.captureImage{
  display:block;

  width:100%;
  height:auto;

  background:#fff;
}

.captureActions{
  display:flex;

  justify-content:flex-end;

  padding:9px;
}

.deleteBtn{
  border:0;

  border-radius:12px;

  padding:
    9px 13px;

  background:
    rgba(165,30,30,.90);

  color:#fff;

  font-family:inherit;

  font-weight:900;
}


/* =========================================================
   VIDE
========================================================= */

.empty{
  padding:
    22px 8px;

  text-align:center;

  color:
    rgba(255,255,255,.48);

  font-size:15px;
  font-weight:750;
}


/* =========================================================
   ACTIVITÉ ANNUELLE
========================================================= */

.annualRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:
    11px 13px;

  margin-bottom:7px;

  border-radius:15px;

  background:
    rgba(255,255,255,.055);
}

.annualYear{
  font-size:17px;
  font-weight:950;
}

.annualValue{
  font-size:17px;
  font-weight:900;
}

.annualDelete{
  width:35px;
  height:35px;

  border:0;

  border-radius:11px;

  background:
    rgba(160,25,25,.90);

  color:#fff;

  font-size:17px;
  font-weight:900;
}


/* =========================================================
   GRAPHIQUE
========================================================= */

.chartBox{
  margin-top:15px;

  padding:10px;

  border-radius:18px;

  background:
    rgba(0,0,0,.27);

  overflow:hidden;
}

.chartTitle{
  margin:
    3px 5px 8px;

  font-size:16px;
  font-weight:950;
}

.chartSvg{
  display:block;

  width:100%;
  height:auto;
}


/* =========================================================
   OVERLAY IMPORT
========================================================= */

.uploadOverlay{
  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  padding:
    calc(env(safe-area-inset-top) + 10px)
    10px
    calc(env(safe-area-inset-bottom) + 10px);

  background:
    rgba(0,0,0,.90);
}

.uploadOverlay.show{
  display:flex;
  flex-direction:column;
}

.uploadTop{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:7px 2px 10px;
}

.uploadTitle{
  font-size:18px;
  font-weight:950;
}

.uploadWindow{
  flex:1;

  min-height:0;

  overflow:hidden;

  border-radius:22px;

  background:#151515;

  border:
    1px solid
    rgba(255,255,255,.12);
}

.uploadFrame{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#151515;
}

</style>

</head>

<body>


<div class="bg"></div>


<div class="wrap">


  <header class="topbar">

    <h1 class="pageTitle">
      Statistiques
    </h1>

    <div class="topActions">

      <button
        id="adminLock"
        class="btn lockBtn"
        type="button">
        🔒
      </button>

      <button
        id="backBtn"
        class="btn"
        type="button">
        Retour
      </button>

    </div>

  </header>


  <section
    id="adminPanel"
    class="adminPanel">

    <div class="adminTitle">
      Administration
    </div>

    <div class="adminButtons">

      <button
        id="addCaptureBtn"
        class="btn btnGreen"
        type="button">

        + Ajouter une capture

      </button>

    </div>

    <div class="annualForm">

      <input
        id="annualYearInput"
        type="number"
        min="2000"
        max="2200"
        placeholder="Année">

      <input
        id="annualValueInput"
        type="number"
        min="0"
        placeholder="Interventions">

      <button
        id="saveAnnualBtn"
        class="btn btnGreen"
        type="button">

        Enregistrer l’activité annuelle

      </button>

    </div>

  </section>


  <section
    id="monthlyAccordion"
    class="accordion">

    <button
      id="monthlyHeader"
      class="accordionHeader"
      type="button"
      aria-expanded="false">

      <span>
        Statistiques mensuelles
      </span>

      <span class="accordionArrow">
        ▼
      </span>

    </button>


    <div class="accordionContent">

      <div
        id="monthlyLoading"
        class="sectionLoading"
        style="display:none;">

        Chargement…

      </div>


      <div id="monthlyBody">

        <p class="intro">
          Sélectionnez une année puis un mois.
        </p>

        <div class="selectGrid">

          <div>

            <label
              class="fieldLabel"
              for="yearSelect">

              Année

            </label>

            <select id="yearSelect">
            </select>

          </div>

          <div>

            <label
              class="fieldLabel"
              for="monthSelect">

              Mois

            </label>

            <select id="monthSelect">
            </select>

          </div>

        </div>

        <div id="capturesContainer">
        </div>

      </div>

    </div>

  </section>


  <section
    id="annualAccordion"
    class="accordion">

    <button
      id="annualHeader"
      class="accordionHeader"
      type="button"
      aria-expanded="false">

      <span>
        Activité annuelle
      </span>

      <span class="accordionArrow">
        ▼
      </span>

    </button>


    <div class="accordionContent">

      <div
        id="annualLoading"
        class="sectionLoading"
        style="display:none;">

        Chargement…

      </div>


      <div id="annualContainer">
      </div>


      <div
        id="chartBox"
        class="chartBox"
        style="display:none;">

        <div class="chartTitle">
          Évolution de l’activité
        </div>

        <svg
          id="chartSvg"
          class="chartSvg"
          viewBox="0 0 700 300"
          preserveAspectRatio="xMidYMid meet">

        </svg>

      </div>

    </div>

  </section>


</div>


<div
  id="uploadOverlay"
  class="uploadOverlay">

  <div class="uploadTop">

    <div class="uploadTitle">
      Ajouter une capture
    </div>

    <button
      id="cancelUpload"
      class="btn btnRed"
      type="button">

      Annuler

    </button>

  </div>

  <div class="uploadWindow">

    <iframe
      id="uploadFrame"
      class="uploadFrame"
      src="about:blank">
    </iframe>

  </div>

</div>


<script>

const API =
  "https://script.google.com/macros/s/AKfycbzPHCDdW7wkFCVkMOL_2srZmdnjZ1QKmToUFtqIZBPjSUNtOwM-Ac7ua0w9dhCv3oI/exec";

const BACK_URL =
  "informations.html";

const EMAIL_KEY =
  "cs_portail_email_v1";

const ROLE_KEY =
  "cs_role_v1";

const MONTHS = [
  "",
  "Janvier",
  "Février",
  "Mars",
  "Avril",
  "Mai",
  "Juin",
  "Juillet",
  "Août",
  "Septembre",
  "Octobre",
  "Novembre",
  "Décembre"
];

const $ =
  id =>
    document.getElementById(id);

let STATS = {
  captures:[],
  annual:[]
};

let IS_ADMIN = false;

let ADMIN_OPEN = false;

let STATS_LOADED = false;

let STATS_LOADING = null;


/* =========================================================
   IDENTITÉ
========================================================= */

function getEmail(){

  return String(
    localStorage.getItem(
      EMAIL_KEY
    )
    ||
    ""
  )
  .trim()
  .toLowerCase();

}


function getRole(){

  return String(
    localStorage.getItem(
      ROLE_KEY
    )
    ||
    ""
  )
  .trim()
  .toLowerCase();

}


/* =========================================================
   JSONP
========================================================= */

function jsonp(params){

  return new Promise(
    function(resolve,reject){

      const callback =
        "statsCb_"
        +
        Date.now()
        +
        "_"
        +
        Math.random()
          .toString(36)
          .slice(2);

      const script =
        document.createElement(
          "script"
        );

      let finished =
        false;

      const timeout =
        setTimeout(
          function(){

            cleanup();

            reject(
              new Error(
                "Délai dépassé"
              )
            );

          },
          20000
        );

      function cleanup(){

        if(finished){
          return;
        }

        finished = true;

        clearTimeout(timeout);

        try{
          delete window[callback];
        }catch(err){}

        try{
          script.remove();
        }catch(err){}

      }

      window[callback] =
        function(data){

          cleanup();

          resolve(data);

        };

      const query =
        new URLSearchParams();

      Object.entries(
        params || {}
      )
      .forEach(
        function([key,value]){

          if(
            value !== undefined
            &&
            value !== null
          ){

            query.set(
              key,
              String(value)
            );

          }

        }
      );

      query.set(
        "callback",
        callback
      );

      query.set(
        "_",
        Date.now()
      );

      script.src =
        API
        +
        "?"
        +
        query.toString();

      script.onerror =
        function(){

          cleanup();

          reject(
            new Error(
              "Erreur de connexion"
            )
          );

        };

      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   CHARGEMENT À LA DEMANDE
========================================================= */

async function ensureStatsLoaded(){

  if(STATS_LOADED){
    return;
  }

  if(STATS_LOADING){
    return STATS_LOADING;
  }

  $("monthlyLoading").style.display =
    "block";

  $("annualLoading").style.display =
    "block";

  STATS_LOADING =
    loadStats(false);

  try{

    await STATS_LOADING;

    STATS_LOADED = true;

  }
  finally{

    STATS_LOADING = null;

    $("monthlyLoading").style.display =
      "none";

    $("annualLoading").style.display =
      "none";

  }

}


/* =========================================================
   CHARGEMENT DONNÉES
========================================================= */

async function loadStats(
  keepSelection = true
){

  const oldYear =
    $("yearSelect").value;

  const oldMonth =
    $("monthSelect").value;

  const result =
    await jsonp({

      view:
        "statistiques_list"

    });

  if(
    !result
    ||
    result.ok === false
  ){

    throw new Error(
      result &&
      result.error
        ?
        result.error
        :
        "Chargement impossible"
    );

  }

  STATS.captures =
    Array.isArray(
      result.captures
    )
    ?
    result.captures
    :
    [];

  STATS.annual =
    Array.isArray(
      result.annual
    )
    ?
    result.annual
    :
    Array.isArray(
      result.annuel
    )
    ?
    result.annuel
    :
    [];

  buildYearSelect(
    keepSelection
      ?
      oldYear
      :
      ""
  );

  buildMonthSelect(
    keepSelection
      ?
      oldMonth
      :
      ""
  );

  renderCaptures();

  renderAnnual();

}


/* =========================================================
   ANNÉES
========================================================= */

function getCaptureYears(){

  const years =
    new Set();

  STATS.captures
    .forEach(
      function(item){

        const y =
          Number(
            item.year
          );

        if(y){
          years.add(y);
        }

      }
    );

  return Array
    .from(years)
    .sort(
      (a,b) =>
        b-a
    );

}


function buildYearSelect(
  preferredYear
){

  const select =
    $("yearSelect");

  const years =
    getCaptureYears();

  select.innerHTML =
    "";

  if(
    years.length === 0
  ){

    const option =
      document.createElement(
        "option"
      );

    option.value =
      "";

    option.textContent =
      "—";

    select.appendChild(
      option
    );

    buildMonthSelect();

    return;

  }

  years.forEach(
    function(year){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(year);

      option.textContent =
        String(year);

      select.appendChild(
        option
      );

    }
  );

  if(
    preferredYear
    &&
    years.includes(
      Number(
        preferredYear
      )
    )
  ){

    select.value =
      String(
        preferredYear
      );

  }
  else{

    select.value =
      String(
        years[0]
      );

  }

}


/* =========================================================
   MOIS
========================================================= */

function buildMonthSelect(
  preferredMonth
){

  const year =
    Number(
      $("yearSelect").value
    );

  const select =
    $("monthSelect");

  const months =
    Array.from(
      new Set(

        STATS.captures

          .filter(
            item =>
              Number(
                item.year
              )
              ===
              year
          )

          .map(
            item =>
              Number(
                item.month
              )
          )

      )
    )
    .filter(
      month =>
        month >= 1
        &&
        month <= 12
    )
    .sort(
      (a,b) =>
        b-a
    );

  select.innerHTML =
    "";

  if(
    months.length === 0
  ){

    const option =
      document.createElement(
        "option"
      );

    option.value =
      "";

    option.textContent =
      "—";

    select.appendChild(
      option
    );

    return;

  }

  months.forEach(
    function(month){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(month);

      option.textContent =
        MONTHS[month];

      select.appendChild(
        option
      );

    }
  );

  if(
    preferredMonth
    &&
    months.includes(
      Number(
        preferredMonth
      )
    )
  ){

    select.value =
      String(
        preferredMonth
      );

  }
  else{

    select.value =
      String(
        months[0]
      );

  }

}


/* =========================================================
   TITRE CAPTURE
========================================================= */

function captureTitle(
  capture
){

  const year =
    Number(
      capture.year
    );

  const month =
    Number(
      capture.month
    );

  const value =
    String(
      capture.title
      ||
      ""
    )
    .trim();

  if(
    !value
    ||
    /GMT/i.test(value)
  ){

    return (
      MONTHS[month]
      +
      " "
      +
      year
    );

  }

  return value;

}


/* =========================================================
   CAPTURES
========================================================= */

function renderCaptures(){

  const year =
    Number(
      $("yearSelect").value
    );

  const month =
    Number(
      $("monthSelect").value
    );

  const container =
    $("capturesContainer");

  const list =
    STATS.captures

      .filter(
        item =>
          Number(
            item.year
          )
          ===
          year
          &&
          Number(
            item.month
          )
          ===
          month
      )

      .sort(
        function(a,b){

          return (
            Number(
              a.order || 0
            )
            -
            Number(
              b.order || 0
            )
          );

        }
      );

  container.innerHTML =
    "";

  if(
    list.length === 0
  ){

    container.innerHTML =
      '<div class="empty">'
      +
      'Aucune capture pour cette période.'
      +
      '</div>';

    return;

  }

  list.forEach(
    function(capture){

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "captureCard";

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "captureTitle";

      title.textContent =
        captureTitle(
          capture
        );

      const img =
        document.createElement(
          "img"
        );

      img.className =
        "captureImage";

      img.src =
        String(
          capture.image_url
          ||
          ""
        );

      img.alt =
        captureTitle(
          capture
        );

      card.appendChild(
        title
      );

      card.appendChild(
        img
      );

      if(
        IS_ADMIN
        &&
        ADMIN_OPEN
      ){

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "captureActions";

        const del =
          document.createElement(
            "button"
          );

        del.type =
          "button";

        del.className =
          "deleteBtn";

        del.textContent =
          "Supprimer";

        del.onclick =
          function(){

            deleteCapture(
              capture.id
            );

          };

        actions.appendChild(del);

        card.appendChild(actions);

      }

      container.appendChild(card);

    }
  );

}


/* =========================================================
   SUPPRESSION CAPTURE
========================================================= */

async function deleteCapture(id){

  if(!id){
    return;
  }

  if(
    !confirm(
      "Supprimer cette capture ?"
    )
  ){
    return;
  }

  STATS.captures =
    STATS.captures.filter(
      item =>
        String(item.id)
        !==
        String(id)
    );

  buildYearSelect(
    $("yearSelect").value
  );

  buildMonthSelect(
    $("monthSelect").value
  );

  renderCaptures();

  try{

    const result =
      await jsonp({

        view:
          "statistiques_capture_delete",

        id:id,

        email:
          getEmail()

      });

    if(
      result
      &&
      result.ok === false
    ){

      throw new Error(
        result.error
        ||
        "Suppression impossible"
      );

    }

  }catch(err){

    alert(
      "Erreur lors de la suppression : "
      +
      err.message
    );

    STATS_LOADED = false;

    await ensureStatsLoaded();

  }

}


/* =========================================================
   ACTIVITÉ ANNUELLE
========================================================= */

function normalizeAnnual(){

  return STATS.annual

    .map(
      function(item){

        return {

          year:
            Number(
              item.year
            ),

          interventions:
            Number(
              item.interventions
              ??
              item.value
              ??
              item.total
              ??
              0
            )

        };

      }
    )

    .filter(
      item =>
        item.year
        &&
        Number.isFinite(
          item.interventions
        )
    )

    .sort(
      (a,b) =>
        a.year-b.year
    );

}


function renderAnnual(){

  const container =
    $("annualContainer");

  const list =
    normalizeAnnual();

  container.innerHTML =
    "";

  if(
    list.length === 0
  ){

    container.innerHTML =
      '<div class="empty">'
      +
      'Aucune donnée annuelle enregistrée.'
      +
      '</div>';

    $("chartBox").style.display =
      "none";

    return;

  }

  list
    .slice()
    .reverse()
    .forEach(
      function(item){

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "annualRow";

        const year =
          document.createElement(
            "div"
          );

        year.className =
          "annualYear";

        year.textContent =
          item.year;

        const value =
          document.createElement(
            "div"
          );

        value.className =
          "annualValue";

        value.textContent =
          item.interventions
          +
          " interventions";

        row.appendChild(year);

        row.appendChild(value);

        if(
          IS_ADMIN
          &&
          ADMIN_OPEN
        ){

          const del =
            document.createElement(
              "button"
            );

          del.type =
            "button";

          del.className =
            "annualDelete";

          del.textContent =
            "×";

          del.onclick =
            function(){

              deleteAnnual(
                item.year
              );

            };

          row.appendChild(del);

        }

        container.appendChild(row);

      }
    );

  renderChart(list);

}


/* =========================================================
   SAUVEGARDE ANNUELLE
========================================================= */

async function saveAnnual(){

  const year =
    Number(
      $("annualYearInput").value
    );

  const interventions =
    Number(
      $("annualValueInput").value
    );

  if(
    !Number.isInteger(year)
    ||
    year < 2000
    ||
    year > 2200
  ){

    alert(
      "Année incorrecte."
    );

    return;

  }

  if(
    !Number.isFinite(
      interventions
    )
    ||
    interventions < 0
  ){

    alert(
      "Nombre d’interventions incorrect."
    );

    return;

  }

  try{

    const result =
      await jsonp({

        view:
          "statistiques_annual_set",

        email:
          getEmail(),

        year:year,

        interventions:
          interventions

      });

    if(
      !result
      ||
      result.ok === false
    ){

      throw new Error(
        result &&
        result.error
          ?
          result.error
          :
          "Enregistrement impossible"
      );

    }

    $("annualYearInput").value =
      "";

    $("annualValueInput").value =
      "";

    STATS_LOADED = false;

    await ensureStatsLoaded();

  }catch(err){

    alert(
      "Erreur : "
      +
      err.message
    );

  }

}


/* =========================================================
   SUPPRESSION ANNUELLE
========================================================= */

async function deleteAnnual(year){

  if(
    !confirm(
      "Supprimer l’activité annuelle "
      +
      year
      +
      " ?"
    )
  ){
    return;
  }

  STATS.annual =
    STATS.annual.filter(
      item =>
        Number(item.year)
        !==
        Number(year)
    );

  renderAnnual();

  try{

    const result =
      await jsonp({

        view:
          "statistiques_annual_delete",

        email:
          getEmail(),

        year:year

      });

    if(
      result
      &&
      result.ok === false
    ){

      throw new Error(
        result.error
        ||
        "Suppression impossible"
      );

    }

  }catch(err){

    alert(
      "Erreur lors de la suppression : "
      +
      err.message
    );

  }

}


/* =========================================================
   GRAPHIQUE
========================================================= */

function renderChart(list){

  const box =
    $("chartBox");

  const svg =
    $("chartSvg");

  if(
    list.length < 2
  ){

    box.style.display =
      "none";

    return;

  }

  box.style.display =
    "block";

  svg.innerHTML =
    "";

  const W = 700;
  const H = 300;

  const LEFT = 65;
  const RIGHT = 30;
  const TOP = 30;
  const BOTTOM = 55;

  const chartW =
    W - LEFT - RIGHT;

  const chartH =
    H - TOP - BOTTOM;

  const maxValue =
    Math.max(
      1,
      ...list.map(
        item =>
          item.interventions
      )
    );

  function xAt(index){

    return (
      LEFT
      +
      (
        index
        /
        Math.max(
          1,
          list.length - 1
        )
      )
      *
      chartW
    );

  }

  function yAt(value){

    return (
      TOP
      +
      chartH
      -
      (
        value
        /
        maxValue
      )
      *
      chartH
    );

  }

  for(
    let i=0;
    i<=4;
    i++
  ){

    const y =
      TOP
      +
      chartH
      *
      i
      /
      4;

    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line.setAttribute(
      "x1",
      LEFT
    );

    line.setAttribute(
      "x2",
      W-RIGHT
    );

    line.setAttribute(
      "y1",
      y
    );

    line.setAttribute(
      "y2",
      y
    );

    line.setAttribute(
      "stroke",
      "rgba(255,255,255,.12)"
    );

    svg.appendChild(line);

  }

  const points =
    list
      .map(
        function(item,index){

          return (
            xAt(index)
            +
            ","
            +
            yAt(
              item.interventions
            )
          );

        }
      )
      .join(" ");

  const polyline =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "polyline"
    );

  polyline.setAttribute(
    "points",
    points
  );

  polyline.setAttribute(
    "fill",
    "none"
  );

  polyline.setAttribute(
    "stroke",
    "#f28a21"
  );

  polyline.setAttribute(
    "stroke-width",
    "5"
  );

  polyline.setAttribute(
    "stroke-linecap",
    "round"
  );

  polyline.setAttribute(
    "stroke-linejoin",
    "round"
  );

  svg.appendChild(polyline);

  list.forEach(
    function(item,index){

      const x =
        xAt(index);

      const y =
        yAt(
          item.interventions
        );

      const circle =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      circle.setAttribute(
        "cx",
        x
      );

      circle.setAttribute(
        "cy",
        y
      );

      circle.setAttribute(
        "r",
        7
      );

      circle.setAttribute(
        "fill",
        "#fff"
      );

      circle.setAttribute(
        "stroke",
        "#f28a21"
      );

      circle.setAttribute(
        "stroke-width",
        "4"
      );

      svg.appendChild(circle);

      const value =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );

      value.setAttribute(
        "x",
        x
      );

      value.setAttribute(
        "y",
        Math.max(
          18,
          y-14
        )
      );

      value.setAttribute(
        "text-anchor",
        "middle"
      );

      value.setAttribute(
        "fill",
        "#fff"
      );

      value.setAttribute(
        "font-size",
        "17"
      );

      value.setAttribute(
        "font-weight",
        "900"
      );

      value.textContent =
        item.interventions;

      svg.appendChild(value);

      const year =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );

      year.setAttribute(
        "x",
        x
      );

      year.setAttribute(
        "y",
        H-20
      );

      year.setAttribute(
        "text-anchor",
        "middle"
      );

      year.setAttribute(
        "fill",
        "rgba(255,255,255,.72)"
      );

      year.setAttribute(
        "font-size",
        "16"
      );

      year.setAttribute(
        "font-weight",
        "800"
      );

      year.textContent =
        item.year;

      svg.appendChild(year);

    }
  );

}


/* =========================================================
   UPLOAD
========================================================= */

function openUpload(){

  let year =
    Number(
      $("yearSelect").value
    );

  let month =
    Number(
      $("monthSelect").value
    );

  if(!year){

    year =
      new Date()
        .getFullYear();

  }

  if(!month){

    month =
      new Date()
        .getMonth()
      +
      1;

  }

  const url =
    API
    +
    "?view=statistiques_upload_page"
    +
    "&email="
    +
    encodeURIComponent(
      getEmail()
    )
    +
    "&year="
    +
    encodeURIComponent(year)
    +
    "&month="
    +
    encodeURIComponent(month)
    +
    "&_="
    +
    Date.now();

  $("uploadFrame").src =
    url;

  $("uploadOverlay")
    .classList
    .add("show");

}


/* =========================================================
   FERMETURE UPLOAD
========================================================= */

function closeUpload(){

  $("uploadOverlay")
    .classList
    .remove("show");

  $("uploadFrame").src =
    "about:blank";

}


/* =========================================================
   RETOUR APRÈS IMPORT
========================================================= */

window.addEventListener(
  "message",
  function(event){

    const data =
      event.data || {};

    if(
      data.type
      ===
      "stats-upload-success"
    ){

      STATS_LOADED = false;

    }

    if(
      data.type
      ===
      "stats-upload-close"
    ){

      closeUpload();

      STATS_LOADED = false;

      setTimeout(
        async function(){

          try{

            await ensureStatsLoaded();

          }catch(err){

            console.error(err);

          }

        },
        250
      );

    }

  }
);


/* =========================================================
   ADMIN
========================================================= */

function updateAdminUi(){

  if(!IS_ADMIN){

    $("adminLock").style.display =
      "none";

    $("adminPanel")
      .classList
      .remove("show");

    ADMIN_OPEN = false;

    return;

  }

  $("adminLock").style.display =
    "";

  $("adminLock").textContent =
    ADMIN_OPEN
      ?
      "🔓"
      :
      "🔒";

  $("adminPanel")
    .classList
    .toggle(
      "show",
      ADMIN_OPEN
    );

  if(STATS_LOADED){

    renderCaptures();

    renderAnnual();

  }

}


/* =========================================================
   ACCORDÉONS
========================================================= */

async function openAccordion(
  accordionId,
  headerId
){

  const accordion =
    $(accordionId);

  const header =
    $(headerId);

  const opening =
    !accordion
      .classList
      .contains("open");

  accordion
    .classList
    .toggle("open");

  header.setAttribute(
    "aria-expanded",
    opening
      ?
      "true"
      :
      "false"
  );

  if(opening){

    try{

      await ensureStatsLoaded();

    }catch(err){

      console.error(err);

      alert(
        "Impossible de charger les statistiques."
      );

    }

  }

}


/* =========================================================
   ÉVÉNEMENTS
========================================================= */

$("backBtn")
  .onclick =
    function(){

      window.location.href =
        BACK_URL;

    };


$("adminLock")
  .onclick =
    function(){

      if(!IS_ADMIN){
        return;
      }

      ADMIN_OPEN =
        !ADMIN_OPEN;

      updateAdminUi();

    };


$("addCaptureBtn")
  .onclick =
    openUpload;


$("cancelUpload")
  .onclick =
    closeUpload;


$("saveAnnualBtn")
  .onclick =
    saveAnnual;


$("monthlyHeader")
  .onclick =
    function(){

      openAccordion(
        "monthlyAccordion",
        "monthlyHeader"
      );

    };


$("annualHeader")
  .onclick =
    function(){

      openAccordion(
        "annualAccordion",
        "annualHeader"
      );

    };


$("yearSelect")
  .addEventListener(
    "change",
    function(){

      buildMonthSelect();

      renderCaptures();

    }
  );


$("monthSelect")
  .addEventListener(
    "change",
    renderCaptures
  );


/* =========================================================
   DÉMARRAGE
========================================================= */

function init(){

  IS_ADMIN =
    getRole()
    ===
    "admin";

  updateAdminUi();

}


init();

</script>
